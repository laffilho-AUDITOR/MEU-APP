      ],
      "correta": 3,
      "fundamento": "a) ERRADA. A lei sujeita à inscrição os imóveis da zona urbana e de transição urbana ainda que isentos ou imunes. b) ERRADA. A inscrição é requerida separadamente para cada imóvel, e o fracionamento é admitido nas situações do regulamento. c) ERRADA. O critério não é a extensão da testada, e sim a entrada principal do imóvel. d) CERTA. Reúne as três regras do cadastro: obrigatoriedade, inscrição por imóvel com fracionamento admitido e cadastramento pela testada principal, que é a da entrada principal. e) ERRADA. O imóvel não edificado é inscrito, correspondendo a inscrição ao endereço descrito no documento de propriedade ou posse.\nArt. 13. Os imóveis localizados na zona urbana e de transição urbana de Manaus, ainda que isentos ou imunes ao IPTU, ficam sujeitos à inscrição no cadastro imobiliário municipal da Secretaria Municipal de\nFinanças, Planejamento e Tecnologia da Informação - SEMEF.\nParágrafo único - A inscrição cadastral é obrigatória e deve ser requerida separadamente para cada imóvel do contribuinte, admitindo-se o fracionamento da inscrição nas situações previstas em regulamento.\nArt. 14, § 1º O contribuinte requererá a inscrição cadastral sempre que formar uma unidade imobiliária, ficando, ainda, obrigado a comunicar sua atualização sempre que promover modificações em suas características físicas.\nArt. 14, § 4º A unidade imobiliária será cadastrada em função da testada principal, sendo esta considerada a da entrada principal do imóvel.\n§ 5º Tratando-se de imóvel não edificado, a inscrição cadastral corresponderá à do endereço descrito no documento de propriedade ou posse do imóvel.\nResposta: Letra D"
    },
    {
      "id": "q-iptu-l57",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Contribuinte de Manaus que optou pelo pagamento parcelado do IPTU deixou de pagar diversas parcelas.\nConforme a Lei nº 1628/2011, o atraso no pagamento de parcelas, consecutivas ou não, em quantidade e situações definidas em regulamento,",
      "alts": [
        "acarreta o vencimento antecipado do total da dívida.",
        "acarreta apenas a perda do desconto que havia sido concedido para o pagamento em cota única do imposto.",
        "impede o contribuinte de optar pelo parcelamento no exercício seguinte, sem qualquer outro efeito sobre o débito em curso.",
        "obriga a administração a inscrever imediatamente o crédito em dívida ativa, ficando vedado o pagamento na via administrativa.",
        "converte automaticamente o débito remanescente em parcelamento de longo prazo, com novos vencimentos definidos em regulamento."
      ],
      "correta": 0,
      "fundamento": "Analisando cada alternativa: a) CERTA. Perdida a confiança no cronograma, a lei antecipa o vencimento de todo o saldo, e não apenas das parcelas atrasadas. b) ERRADA. A consequência é bem mais severa do que a simples perda de desconto. c) ERRADA. A lei não trata de vedação de novo parcelamento, e sim do vencimento antecipado da dívida atual. d) ERRADA. O vencimento antecipado não se confunde com inscrição obrigatória em dívida ativa, nem impede o pagamento administrativo. e) ERRADA. É o inverso do que a lei determina: em vez de alongar o prazo, ela o encurta.\nArt. 39. O pagamento de cada parcela independe das anteriores e não presume a quitação das mesmas.\nParágrafo único - O atraso no pagamento de parcelas consecutivas ou não, em quantidade e situações definidas em regulamento, acarretará o vencimento antecipado do total da dívida.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l58",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Sobre o critério de arbitramento previsto na Lei nº 1628/2011, é correto afirmar que ele",
      "alts": [
        "aplica-se indistintamente a imóveis edificados e não edificados, sempre que o contribuinte deixar de apresentar declaração ao Fisco.",
        "aplica-se apenas quando houver decisão judicial autorizando a administração tributária a fixar o valor venal do imóvel.",
        "aplica-se à fixação do valor venal de imóveis edificados, inclusive quando não merecerem fé as declarações, os esclarecimentos e os documentos fornecidos pelo sujeito passivo.",
        "aplica-se somente ao imóvel fechado ou inabitado, sendo irrelevante a conduta do contribuinte quanto ao levantamento dos dados do bem.",
        "aplica-se a imóveis não edificados situados em zona de expansão urbana, cujo valor unitário não conste da Planta Genérica de Valores."
      ],
      "correta": 2,
      "fundamento": "a) ERRADA. O arbitramento é medida de exceção, previsto apenas para imóveis edificados. b) ERRADA. O arbitramento é medida administrativa e não depende de autorização judicial. c) CERTA. O arbitramento serve à fixação do valor venal de imóveis edificados e uma de suas hipóteses é justamente a de as declarações e documentos do sujeito passivo não merecerem fé. d) ERRADA. O imóvel fechado ou inabitado é apenas uma das hipóteses. Outra é o próprio contribuinte impedir o levantamento dos elementos do imóvel. e) ERRADA. A lei não vincula o arbitramento à zona de expansão urbana nem à ausência de valor unitário na\nPlanta Genérica.\nArt. 10. Aplicar-se-á o critério de arbitramento para fixação do valor venal de imóveis edificados quando:\nI - o contribuinte impedir o levantamento dos elementos e características do imóvel, necessários à apuração de sua base de cálculo;\nII - o imóvel estiver fechado ou inabitado e seu proprietário ou responsável não for localizado;\nIII - houver omissão quanto às informações que possibilitem apurar a base de cálculo, ou não mereçam fé as declarações, esclarecimentos e documentos fornecidos pelo sujeito passivo.\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l59",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Sobre as penalidades pelo descumprimento das obrigações estabelecidas na Lei nº 1628/2011, é correto afirmar que elas",
      "alts": [
        "são fixadas em reais e reajustadas anualmente pela taxa SELIC acumulada no período de referência.",
        "são idênticas para pessoa física e pessoa jurídica, pois a lei veda a diferenciação segundo a natureza do infrator.",
        "alcançam no máximo cinco UFM, tanto para a pessoa física quanto para a pessoa jurídica ou o empresário infrator.",
        "somente se aplicam ao contribuinte do imposto, não alcançando o responsável tributário pelo imóvel autuado.",
        "são medidas em UFM e diferenciadas conforme sejam cometidas por pessoa física ou por pessoa jurídica ou empresário, chegando a 15 UFM e 30 UFM nos casos mais graves."
      ],
      "correta": 4,
      "fundamento": "a) ERRADA. A unidade de medida das penalidades é a UFM, e não o real corrigido por índice financeiro. b) ERRADA. A lei diferencia expressamente a pessoa física da pessoa jurídica ou empresário. c) ERRADA. O teto de cinco UFM não existe. Os patamares mais graves vão bem além disso. d) ERRADA. As penalidades alcançam o infrator, que pode ser o contribuinte ou o responsável. e) CERTA. As penalidades são medidas em UFM, vão de frações de UFM para omissões cadastrais simples até\n15 UFM para pessoa física e 30 UFM para pessoa jurídica nos casos mais graves, como embaraço à ação fiscal.\nArt. 47. O descumprimento das obrigações established nesta Lei, apuradas por procedimento administrativo fiscal, ou detectadas pela administração fazendária por meio de outros instrumentos, sujeita o infrator às seguintes penalidades:\nI - quando cometida por pessoa física: k) de 15 (quinze) UFM´s, por embaraçar ou impedir a ação da autoridade fiscal, ou por deixar de prestar informação, não apresentar comprovante de pagamento, documento ou outro qualquer, quando solicitado pelo fisco, ou por prestar informações com dolo, má fé, fraude ou simulação, ou, ainda, por falsificar autenticação bancária em guias de recolhimento de imposto, para cada guia falsificada;\nII - quando cometida por pessoa jurídica, ou empresário: k) de 30 (trinta) UFM´s, por embaraçar ou impedir a ação da autoridade fiscal ou por deixar de prestar informação, não apresentar comprovante de pagamento, documento ou outro qualquer, quando solicitado pelo Fisco ou por prestar informações com dolo, má fé, fraude ou simulação ou, ainda, por falsificar autenticação bancária em guias de recolhimento de imposto, para cada guia falsificada;\nResposta: Letra E"
    },
    {
      "id": "q-iptu-l60",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Sobre as disposições gerais da Lei nº 1628/2011, é correto afirmar que",
      "alts": [
        "o órgão competente pode, a qualquer tempo, efetivar a inscrição de ofício de imóveis, legalizados ou não, desde que apurados os elementos necessários.",
        "a inscrição de ofício de imóveis depende de prévia regularização urbanística e cartorária do bem, vedada a inscrição de imóvel não legalizado.",
        "a inscrição de ofício só pode ser efetivada no próprio exercício em que o imóvel tenha sido identificado pela fiscalização municipal.",
        "a variação percentual anual do crédito tributário, nos exercícios de 2012 a 2016, seria crescente e progressiva a cada ano, até atingir o total previsto.",
        "a lei dependia de lei complementar municipal posterior para produzir efeitos, o que somente vem a ocorrer no exercício de 2016."
      ],
      "correta": 0,
      "fundamento": "a) CERTA. A inscrição de ofício pode ser feita a qualquer tempo e não se limita a imóveis regulares. O único requisito é que a administração tenha apurado os elementos necessários. b) ERRADA. A lei diz exatamente o contrário: alcança imóveis legalizados ou não. c) ERRADA. Não há limitação ao exercício da identificação. A expressão legal é a qualquer tempo. d) ERRADA. A lei previu variação constante no período, e não crescente e progressiva, para diluir em cinco anos o impacto das alterações. e) ERRADA. A lei entrou em vigor na publicação e produziu efeitos no exercício de 2012, sem depender de lei complementar.\nArt. 52. O órgão competente poderá, a qualquer tempo, efetivar a inscrição de ofício de imóveis, legalizados ou não, desde que apurados os elementos necessários para esse fim.\nArt. 54. Para efeito de lançamento do IPTU sobre fatos geradores ocorridos nos exercícios de 2012 a 2016, a variação percentual anual do crédito tributário se manterá constante, atingindo a variação percentual total decorrente das alterações introduzidas nesta lei em um prazo de 5 (cinco) anos.\nArt. 57. Esta Lei entra em vigor na data de sua publicação, producing seus efeitos no exercício de 2012.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l61",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Em procedimento fiscal, a administração tributária de Manaus comprovou que alterações nas características físicas de determinado imóvel implicaram mudança na base de cálculo e na alíquota aplicadas no lançamento original. Nos termos da Lei nº 1628/2011,",
      "alts": [
        "a revisão só pode alcançar o exercício em curso, sendo vedado o lançamento complementar relativo a exercícios anteriores.",
        "a revisão alcança os exercícios anteriores, mas o valor já recolhido pelo contribuinte não pode ser deduzido do complemento apurado.",
        "a revisão depende de prévia impugnação apresentada pelo contribuinte quanto ao lançamento original do imposto do exercício.",
        "a administração pode efetuar o lançamento do IPTU complementar de exercícios anteriores não atingidos pela decadência, deduzindo o valor previamente recolhido.",
        "a revisão é vedada, pois o lançamento original é ato definitivo e não pode ser revisto depois da notificação do contribuinte."
      ],
      "correta": 3,
      "fundamento": "Analisando cada alternativa: a) ERRADA. O alcance retroativo é justamente o efeito que a lei autoriza, limitado pela decadência. b) ERRADA. A lei manda deduzir o que já foi recolhido, para que se cobre apenas a diferença. c) ERRADA. A revisão pode ser feita a qualquer tempo pela administração, independentemente de impugnação do contribuinte. d) CERTA. Comprovada em procedimento fiscal a alteração física que modificou a base de cálculo ou a alíquota, cabe lançamento complementar dos exercícios não decaídos, descontado o imposto já pago. e) ERRADA. O lançamento do IPTU é revisável, e a própria lei estrutura o procedimento de revisão cadastral.\nArt. 16, § 2º a qualquer tempo poderá ser realizada a revisão das informações cadastrais de imóvel existente no cadastro municipal, procedendo-se à revisão do lançamento do valor do IPTU de exercícios anteriores, observando-se as seguintes regras:\nII - quando a revisão cadastral resultar em diferença de IPTU a recolher, a Administração Tributária deverá efetuar a correção no lançamento do exercício em curso, deduzindo o valor que tenha sido previamente recolhido pelo contribuinte;\nIII - a Administração Tributária poderá efetuar o lançamento do IPTU complementar de exercícios anteriores quando ficar comprovado, durante procedimento fiscal ou qualquer procedimento administrativo de atualização ou revisão cadastral, que ocorreram alterações nas características físicas do imóvel que implicaram a alteração na base de cálculo ou na alíquota, ou de ambas, aplicadas no lançamento original dos períodos não atingidos pela decadência;\nResposta: Letra D"
    },
    {
      "id": "q-iptu-l62",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Conforme a Lei nº 1628/2011, considera-se bem imóvel edificado o equipamento, a construção ou a edificação permanente que sirva para uso, gozo ou habitação, quaisquer que sejam suas formas ou destino,",
      "alts": [
        "apenas quando a construção estiver averbada na matrícula do imóvel junto ao registro de imóveis competente.",
        "bem como suas unidades ou dependências com economia autônoma, ainda que localizadas em lotes distintos.",
        "desde que a construção ocupe ao menos um nono da área total do terreno em que se encontra situada.",
        "exceto quando a edificação servir a finalidade não residencial, hipótese que recebe tratamento próprio na lei.",
        "somente se a construção tiver sido erguida em exercício financeiro anterior ao que se referir o lançamento."
      ],
      "correta": 1,
      "fundamento": "a) ERRADA. O conceito é físico e não registral. A lei prestigia a situação de fato do imóvel. b) CERTA. O conceito de edificado alcança as unidades ou dependências com economia autônoma, e a lei é expressa em dizer que isso vale ainda que elas estejam em lotes distintos. c) ERRADA. A fração de um nono aparece na definição de gleba e na regra de alíquota da redação anterior, não no conceito de imóvel edificado. d) ERRADA. O conceito é indiferente ao destino do imóvel, tanto que a lei diz sejam quais forem as suas formas ou destino. e) ERRADA. A construção erguida no exercício a que se referir o lançamento é a edificação de natureza temporária, que a lei classifica como imóvel não edificado.\nArt. 6º, § 1º Para os efeitos desta Lei, considera-se bem imóvel edificado o equipamento, a construção ou edificação permanentes, que sirvam para uso, gozo ou habitação, sejam quais forem as suas formas ou destino, bem como suas unidades ou dependências com economia autônoma, ainda que localizadas em lotes distintos.\nArt. 6º, § 2º Considera-se não edificado o bem imóvel:\nIV - em que houver obra paralisada ou em andamento, em condições de inabitabilidade, possua edificações de natureza temporária, assim consideradas as construídas no exercício financeiro que se referir ao lançamento, sejam demolíveis por força de disposição contratual, ou ordem judicial;\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l63",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Conforme as definições técnicas do Decreto nº 3.748/2017, a edificação coberta, com pé direito acima de três metros nas extremidades laterais e de aproximadamente seis metros no vão central, sem paredes definidas em pelo menos dois lados, destinada à garagem de veículos, classifica-se como",
      "alts": [
        "cobertura simples.",
        "galpão fechado.",
        "galpão aberto.",
        "arquitetura especial.",
        "construção precária."
      ],
      "correta": 2,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A cobertura simples é a unidade sem paredes ou fechada em até dois lados, sustentada por colunas, sem exigência de pé direito mínimo nem destinação a garagem. b) ERRADA. No galpão fechado as paredes laterais existem, e é nelas que se mede o pé direito; a destinação é depósito, sala de produção ou oficina. c) CERTA. A ausência de paredes definidas em pelo menos dois lados, o pé direito medido nas extremidades laterais e a destinação a garagens caracterizam o galpão aberto. d) ERRADA. A arquitetura especial pressupõe projeto arquitetônico específico e uso diferenciado, com materiais de revestimento e acabamento próprios, como em centros médicos e hospitais. e) ERRADA. A construção precária define-se pela baixa qualidade do material e da execução e pela deficiência para a sua finalidade, e não pela geometria da edificação.\nArt. 2º Para efeitos de tributação, considera-se:\nI - construção precária: unidade edificada, cuja construção é de baixa qualidade de material e de execução, e é deficiente para a sua finalidade;\nVII - cobertura simples: unidade sem paredes ou fechada em até dois lados, sustentada por colunas e coberta com telhas de qualquer espécie ou de diversos tipos na mesma unidade;\nX - galpão fechado: edificação coberta com pé direito acima de 3,00 m (três metros) nas paredes laterais e aproximadamente 6,00 m (seis metros) no vão central, para fins de depósito, sala de produção, oficinas, etc.;\nXI - galpão aberto: edificação coberta com pé direito acima de 3,00 m (três metros) nas extremidades laterais e aproximadamente 6,00 m (seis metros) no vão central, sem paredes definidas em pelo menos dois lados, para fins de garagens de veículos, aquáticos, terrestres e aéreos, garagens, e outras prestações de serviços;\nXIII - arquitetura especial: unidades com projeto arquitetônico específico e uso diferenciado que exija o uso de materiais de revestimento e acabamento específicos tais como centros médicos e hospitalares, bancos, teatros e cinemas, terminais de passageiros portuários e aeroportuários, hotéis temáticos, etc.;\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l64",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "O Decreto nº 3.748/2017 admite o lançamento e a revisão de lançamento do IPTU no curso do próprio exercício. A respeito dessa hipótese, é correto afirmar que",
      "alts": [
        "o prazo de impugnação é de trinta dias, contado do vencimento da cota única ou da primeira parcela, e a regra alcança o lançamento ou a revisão efetuados de ofício, não decorrentes de impugnação do sujeito passivo.",
        "o prazo de impugnação é de quinze dias, contado da ciência da notificação de lançamento.",
        "o pagamento deve ser feito exclusivamente em cota única, vedado o parcelamento nos lançamentos realizados durante o exercício.",
        "a data de vencimento da primeira parcela é fixada trinta dias após a estabelecida para a cota única.",
        "o regramento aplica-se igualmente à revisão de lançamento decorrente de impugnação interposta pelo sujeito passivo."
      ],
      "correta": 0,
      "fundamento": "Analisando cada alternativa: a) CERTA. Admite-se o pagamento em cota única ou parceladamente, em até doze parcelas mensais, conforme dispuser o decreto anual de lançamento, coincidindo a data da primeira parcela com aquela fixada para cota única. b) ERRADA. Não há prazo de quinze dias contado da ciência da notificação: a impugnação pode ser apresentada até a data do vencimento da cota única ou da primeira parcela. c) ERRADA. O prazo de trinta dias após o vencimento consta do regulamento, mas reproduz redação hoje superada: a Lei nº 2.564/2019 passou a exigir a impugnação até a data do vencimento da cota única ou da primeira parcela, e a lei prevalece sobre o decreto. d) ERRADA. A data da primeira parcela coincide com aquela fixada para a cota única, e não é posterior a ela. e) ERRADA. A disciplina é expressamente reservada ao lançamento ou à revisão efetuados de ofício, excluída a revisão decorrente de impugnação do sujeito passivo.\nArt. 7º, § 1º Admitir-se-á o lançamento e a revisão de lançamento do Imposto sobre a Propriedade Predial e\nTerritorial Urbana - IPTU referido no caput deste artigo durante o exercício, devendo ser observado:\nI - o prazo de pagamento em cota única ou parceladamente, em até 12 (doze) parcelas mensais, conforme dispuser o decreto anual de lançamento, coincidindo a data da primeira parcela com aquela fixada para cota única; e\nII - o prazo de impugnação de 30 (trinta) dias, contado da data do vencimento da cota única ou primeira parcela.\n§ 2º O disposto nos incisos I e II do § 1º deste artigo, refere-se a lançamento ou revisão de lançamento efetuado de ofício, não decorrente de impugnação interposta pelo sujeito passivo.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l65",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Proprietário de imóvel em Manaus pediu a revisão do valor venal, alegando tributação manifestamente injusta. Aplicada a metodologia do Decreto nº 3.748/2017, apuraram-se os seguintes valores venais: pelos\nAnexos I e II da Lei nº 1.628/2011, R$ 900.000,00; pela Tabela dos Valores Básicos dos Bairros e Logradouros,\nR$ 700.000,00; e pela guia de ITBI mais recente e efetivamente paga, R$ 750.000,00. Nesse caso,",

        "caracteriza-se a tributação manifestamente injusta, e a revisão adotará como base de cálculo R$ 750.000,00.",
        "caracteriza-se a tributação manifestamente injusta, e a revisão adotará como base de cálculo R$ 700.000,00.",
        "caracteriza-se a tributação manifestamente injusta, e a revisão adotará como base de cálculo a média aritmética dos três valores apurados.",
        "a revisão é inviável, pois depende de decisão judicial e não pode ser promovida de ofício pela administração."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. O valor apurado pelos anexos é apenas o primeiro dos critérios da comparação; se superar o maior dos demais, a tributação é considerada manifestamente injusta. b) CERTA. O valor do primeiro critério (R$ 900.000,00) supera o maior dos valores obtidos pelos critérios comparativos (R$ 750.000,00), o que caracteriza a tributação manifestamente injusta, e a revisão adota como base de cálculo esse maior valor. c) ERRADA. A base de cálculo revisada é o maior, e não o menor, dos valores obtidos pelos dois critérios comparativos. d) ERRADA. A metodologia não trabalha com média: a base de cálculo revisada é o maior valor venal obtido pelos critérios comparativos. e) ERRADA. A revisão pode ser promovida por solicitação do contribuinte ou de ofício, na esfera administrativa, sem necessidade de decisão judicial.\nArt. 21 Nos casos singulares de imóveis para os quais a aplicação dos procedimentos previstos na Lei nº\n1.628, de 30 de dezembro de 2011 possa conduzir a tributação manifestamente injusta ou inadequada, o órgão competente poderá rever os valores venais, base de cálculo do IPTU, por solicitação do contribuinte ou de ofício, adotando a seguinte metodologia:\nI - será calculado o valor venal do imóvel, utilizando suas características existentes no Cadastro Imobiliário\nMunicipal, atualizadas no ato da revisão do lançamento, com o valor do metro quadrado da construção e do valor do metro quadrado do terreno estabelecidos nos Anexo I e II da Lei nº 1.628, de 30 de dezembro de\n2011, com as modificações estabelecidas na Lei nº 2.192, 28 de dezembro de 2016, e todos os demais procedimentos constantes do Anexo IV da referida Lei;\nII - será calculated o valor venal do imóvel, utilizando suas características existentes no Cadastro\nImobiliário Municipal, atualizadas no ato da revisão do lançamento, com o valor do metro quadrado da construção estabelecido no Anexo I da Lei nº 1.628, de 30 de dezembro de 2011 e o valor do metro quadrado do terreno correspondente ao valor do bairro ou do polo de valorização onde se localizar o imóvel revisado de acordo com a Tabela dos Valores Básicos dos Bairros e Logradouros, publicada pela Procuradoria Geral do\nMunicípio - PGM no sítio da Prefeitura Municipal de Manaus - PMM e em vigor na data da revisão do lançamento, mantendo-se os demais critérios determinados no Anexo IV da referida Lei;\nIII - quando da existência de transação imobiliária, será apurado o valor venal utilizado como base de cálculo na emissão de guia de lançamento do Imposto de Transmissão de Bens Imóveis Inter Vivos - ITBI para o imóvel avaliado a partir de 01 de janeiro de 2012, mais recente e efetivamente paga, observando se as características físicas são as mesmas do imóvel em processo de revisão;\nIV - será comparado o valor venal do imóvel, conforme o critério descrito no inc. I deste artigo, com os valores venais do imóvel obtidos utilizando-se os critérios descritos nos incisos II e III, deste artigo; e\nV - será considerada manifestamente injusta ou inadequada a tributação de IPTU caso o valor venal obtido utilizando-se o critério descrito no inciso I resultar superior ao maior valor venal obtido pelos métodos descritos nos incisos II e III, deste artigo.\nArt. 21, § 2º Na hipótese de ser constatada a tributação manifestamente injusta ou inadequada, a revisão dos valores lançados será efetuada utilizando como base de cálculo o maior valor venal obtido pelos critérios previstos nos incisos II e III do caput deste artigo.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l66",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "A empresa Construtora Amazonas S.A. concluiu a edificação de um edifício residencial em Manaus no dia 15 de setembro de 2025, realizando a entrega oficial das chaves aos adquirentes uma semana depois. Em outubro de 2025, a construtora transmitiu a Declaração Mensal Imobiliária Eletrônica (DMI-e). Um dos adquirentes, ao receber o carnê do imposto relativo à sua unidade em 2026, pretende contestar o lançamento.\nÀ luz das disposições da Lei Municipal nº 1.628/2011 sobre lançamento, impugnação e vigência dos dados cadastrais, assinale a alternativa correta:",
      "alts": [
        "A nova edificação deveria ser considerada no lançamento do IPTU do próprio exercício de 2025, de forma proporcional aos meses restantes do ano a contar da entrega das chaves.",
        "O lançamento da unidade edificada ocorrerá no exercício de 2026, com base nas informações obtidas na DMI-e; caso o adquirente discorde do lançamento, poderá apresentar impugnação até a data do vencimento da cota única ou da primeira parcela.",
        "Eventual impugnação do lançamento do IPTU apresentada pelo adquirente exige o prévio depósito do montante integral do crédito tributário como condição de procedibilidade.",
        "A impugnação do lançamento do IPTU extingue em definitivo o crédito tributário, impedindo a incidência de encargos moratórios mesmo em caso de julgamento de improcedência.",
        "O Chefe do Poder Executivo Municipal pode conceder desconto de até 50% no pagamento em cota única para quem optar por débito automático bancário, a ser definido anualmente."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A atualização decorrente de edificação concluída só é considerada a partir do exercício seguinte ao da entrega; não há lançamento proporcional por meses no ano da conclusão. b) CERTA. O lançamento da unidade ocorre no exercício seguinte, com base na DMI-e, e o adquirente pode impugnar até o vencimento da cota única ou da primeira parcela. c) ERRADA. A impugnação tempestiva apenas suspende a exigibilidade do crédito tributário, sem exigir depósito prévio do valor integral. d) ERRADA. A suspensão da exigibilidade não é extinção do crédito; julgada improcedente a impugnação, incidem os encargos moratórios normalmente. e) ERRADA. O desconto máximo para pagamento em cota única é de 30%, e não 50%.\nArt. 23. O lançamento do IPTU será efetuado no exercício posterior ao da data da entrega do imóvel alienado ou construído, com base nas informações obtidas na declaração referida no art. 31 desta Lei.\nArt. 26. O lançamento será efetuado com base nas características do imóvel, existentes no Cadastro\nImobiliário Municipal na data da ocorrência do Fato Gerador, e poderá ser impugnado pelo sujeito passivo, seja contribuinte, responsável solidário ou representante legal, até a data do vencimento da cota única ou da primeira parcela, observadas as demais disposições regulamentares.\n§ 1º A impugnação tempestiva suspende a exigibilidade do crédito tributário até a decisão definitiva na esfera administrativa.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l67",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Analise as três situações hipotéticas descritas a seguir, ocorridas no Município de Manaus no exercício de\n2025:\nMarcos arrematou um imóvel em leilão judicial (hasta pública), sendo a Carta de Arrematação emitida em\n10/05/2025, existindo débitos de IPTU inscritos em dívida ativa dos exercícios de 2023 e 2024.\nRenata, proprietária de um imóvel com IPTU de 2025 lançado em 10 parcelas, alienou o bem para uma entidade religiosa imune em julho de 2025, após ter pago 4 parcelas.\nSérgio é usufrutuário de um imóvel urbano e detém a posse direta do bem, estando a nu-propriedade registrada em nome de seu filho.\nCom base nos preceitos da Lei nº 1.628/2011 sobre sujeição passiva e responsabilidade tributária:",
      "alts": [
        "Marcos responde pessoalmente por todos os débitos de IPTU dos exercícios de 2023 e 2024, em razão do princípio da sucessão tributária universal do imóvel.",
        "No caso do imóvel de Renata, a imunidade superveniente do adquirente cancela as 6 parcelas restantes de 2025, exonerando tanto o alienante quanto o adquirente.",
        "No caso do imóvel de Renata, as 6 parcelas vincendas do IPTU de 2025 vencem antecipadamente, e a responsabilidade pelo seu pagamento recai sobre Renata (alienante).",
        "Marcos responde pelos débitos de IPTU retroativamente a 1º de janeiro de 2025, alcançando a totalidade do imposto do ano da arrematação.",
        "Sérgio responde apenas subsidiariamente pelo IPTU, sendo indispensável a prévia e frustrada cobrança contra o nu-proprietário."
      ],
      "correta": 2,
      "fundamento": "Analisando cada alternativa: a) ERRADA. Na aquisição em hasta pública, o arrematante não herda os débitos anteriores; responde apenas pelos créditos referentes aos fatos geradores ocorridos a partir da emissão da carta de arrematação. b) ERRADA. A imunidade superveniente do adquirente não cancela o crédito já constituído sobre fato gerador ocorrido quando o bem ainda pertencia a pessoa tributável. c) CERTA. Quando o adquirente do imóvel já lançado é pessoa imune ou isenta, as prestações vincendas vencem antecipadamente, respondendo por elas o alienante. d) ERRADA. O marco inicial da responsabilidade do arrematante é a data de emissão da carta de arrematação, não o dia 1º de janeiro do exercício. e) ERRADA. Os titulares de direito real na posse direta ficam solidariamente responsáveis, sem benefício de ordem nem necessidade de cobrança prévia contra o nu-proprietário.\nArt. 5º § 1º Os titulares de direito real sobre bem imóvel alheio, estabelecidos na forma da lei civil, quando estiverem na posse direta do imóvel, ficam solidariamente responsáveis pelo pagamento do imposto.\n§ 2º Quando a aquisição do imóvel ocorrer em hasta pública, o adquirente será responsável pelos créditos tributários referentes aos fatos geradores ocorridos a partir da emissão da Carta de Arrematação definida na forma do parágrafo único do art. 693 da Lei nº 5.869, de 11 de janeiro de 1973.\n§ 3º Quando o adquirente da posse, domínio útil ou propriedade de bem imóvel já lançado for pessoa imune ou isenta, vencerão antecipadamente as prestações vincendas relativas ao imposto, respondendo por elas o alienante.\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l68",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "A empresa KFA Empreendimentos Ltda. é proprietária de um terreno urbano não parcelado de 12.000 m² localizado em Manaus. No local, há um pequeno galpão construído com 1.000 m² de área coberta. Além disso, uma faixa de 2.000 m² do terreno situa-se em Área de Preservação Permanente (APP) às margens de um igarapé.\nDiante do regramento da Lei nº 1.628/2011 relativo à base de cálculo, fatores de correção e arbitramento:",
      "alts": [
        "O imóvel é classificado como edificado comercial, sendo vedado o enquadramento como gleba em razão da presença de edificação permanente com mais de 500 m².",
        "O imóvel é enquadrado como gleba para fim exclusivo de aplicação do fator de correção de terrenos, pois não é parcelado, possui área igual ou superior a 10.000 m² e a área construída é inferior a 1/9 da área do terreno.",
        "A exclusão da faixa de APP da base de cálculo do IPTU opera-se automaticamente a partir da decretação ambiental, produzindo efeitos retroativos aos últimos cinco exercícios.",
        "O critério de arbitramento da base de cálculo aplica-se indistintamente a imóveis edificados e não edificados quando o contribuinte recusar a exibição de documentos à fiscalização.",
        "Na hipótese de arbitramento de imóvel edificado com dois pavimentos, a topografia do terreno é arbitrada como declive e a pedologia como terreno inundável."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. O imóvel pode ser classificado como gleba mesmo havendo edificação, desde que a área construída seja inferior a um nono do terreno e o lote alcance ao menos 10.000 m², situação que é exatamente a do enunciado. b) CERTA. Trata-se de gleba para fim exclusivo do fator de correção de terrenos: o imóvel não é parcelado, tem 12.000 m² (acima de 10.000 m²) e a área construída de 1.000 m² é inferior a um nono do lote (1.333,33 m²). c) ERRADA. A exclusão da faixa de APP da base de cálculo exige reconhecimento pelo órgão ambiental municipal e deferimento do pedido do contribuinte, produzindo efeitos apenas a partir do exercício seguinte, sem automatismo nem retroação. d) ERRADA. O critério de arbitramento da base de cálculo aplica-se exclusivamente a imóveis edificados. e) ERRADA. No arbitramento, a topografia é arbitrada como terreno plano e a pedologia como terreno normal, condições que mais valorizam o lote, e não as piores.\nArt. 6º § 3º Considera-se gleba, para fim exclusivo de aplicação do fator de correção de terrenos de que trata o Anexo IV desta Lei, o imóvel não parcelado e não edificado, ou edificado com área total construída inferior a 1/9 (um nono) da área do terreno, cuja área do lote seja igual ou superior a 10.000 M² (dez mil metros quadrados).\nArt. 6º § 5º Não integrará a Base de Cálculo do imposto as áreas do terreno classificadas pela legislação municipal como Área de Preservação Permanente (APP), reconhecida pelo órgão ambiental municipal nos termos regulamentares e das normas ambientais vigentes, localizadas nas margens de curso d'água, a partir do exercício seguinte em que for deferido o pedido do contribuinte pela administração tributária.\nArt. 10. Aplicar-se-á o critério de arbitramento para fixação do valor venal de imóveis edificados quando o contribuinte impedir o levantamento, o imóvel estiver fechado e não localizado o responsável, ou houver omissão/inidoneidade das informações prestadas. Parágrafo Único, II - para avaliação do valor venal do terreno... arbitrados o fator de topografia FC2 como terreno plano e o fator de pedologia FC3 como terreno normal.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l69",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "A empresa Serviços Imobiliários Manaus Ltda. foi autuada em procedimento fiscal da SEMEF por ter deixado de entregar a Declaração Mensal Imobiliária Eletrônica (DMI-e) relativa a três meses de operações. Ficou comprovado no processo que a empresa já havia sido condenada irrecorrivelmente pela mesma infração há dois anos. Cientificada do Auto de Infração, a empresa busca orientação sobre os prazos de defesa, o agravamento da sanção e os encargos de mora.\nCom base no regime de infrações e penalidades estabelecido na Lei nº 1.628/2011:",
      "alts": [
        "A infração tributária exige a comprovação da intenção dolosa do contribuinte, de modo que a ausência de dolo descaracteriza o Auto de Infração.",
        "Como a infração foi cometida no prazo de até 5 anos contados da decisão condenatória irrecorrível anterior, restou caracterizada a reincidência, aplicando-se as penalidades em dobro.",
        "O prazo para a empresa autuada efetuar o pagamento integral com desconto, parcelar ou apresentar impugnação é de 15 dias contados da ciência do Auto de Infração.",
        "O recolhimento do IPTU fora do prazo legal sujeita o débito a multa de mora de 1% ao dia (sem limite máximo) e juros de mora de 20% ao mês.",
        "Caso a empresa opte pelo pagamento integral em até 30 dias contados da ciência da intimação, fará jus à remissão total de 100% do valor da multa por infração."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A infração independe de dolo ou culpa: a responsabilidade é objetiva, bastando a ação ou omissão do contribuinte. b) CERTA. Caracteriza-se a reincidência quando a mesma infração é cometida no prazo de até 5 anos contados do pagamento, do fim do prazo de defesa ou da decisão condenatória irrecorrível anterior, aplicando-se a penalidade em dobro. c) ERRADA. O prazo para pagar, parcelar ou impugnar é de 30 dias, e não 15, contados da ciência da intimação. d) ERRADA. O recolhimento em atraso sujeita o débito a multa de mora de 0,33% ao dia (limitada a 20%) e juros de mora de 1% ao mês ou fração, o inverso do que a alternativa afirma. e) ERRADA. A redução para pagamento integral dentro do prazo é de 50%, e não 100%, do valor da multa.\nArt. 45. Constitui infração a ação ou omissão, voluntária ou não, que importe em inobservância, por parte do sujeito passivo, de obrigação tributária principal ou acessória estabelecida na legislação municipal.\nArt. 48. O sujeito passivo de autuação ou notificação fiscal poderá proceder ao recolhimento do valor lançado em até 150 (cento e cinquenta) dias, com as seguintes reduções do valor da multa: I - 50%, para recolhimento integral em até 30 dias.\nArt. 49. As penalidades previstas nesta Lei serão aplicadas em dobro em caso de reincidência, assim considerada quando ocorrer o cometimento da mesma infração no prazo de até 5 (cinco) anos contados da data do pagamento da exigência, do término do prazo de defesa ou da decisão condenatória irrecorrível relativa à infração anterior.\nArt. 50. O sujeito passivo autuado ou notificado terá o prazo de trinta dias, contado da ciência da intimação ou notificação, para efetuar o pagamento ou parcelamento do crédito tributário ou penalidade, na forma do art. 48, ou para apresentação de impugnação, nos termos do Processo Administrativo Fiscal.\nArt. 51. O recolhimento do IPTU fora do prazo legal será atualizado pelo mesmo índice que reajustar a UFM, incidindo sobre seu valor os seguintes encargos: I - juros de mora, à razão de 1% (um por cento) ao mês ou fração; II - multa de mora à razão de 0,33% ao dia, limitada a 20% (vinte por cento).\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l70",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Bruno ampliou a área construída de sua casa em Manaus no ano de 2022 em 60 m², mas omitiu a informação do Cadastro Imobiliário Municipal. Em 2025, arrependido, Bruno compareceu espontaneamente à SEMEF e apresentou requerimento informando a alteração física. Em outro processo, Cláudio impugnou o lançamento do IPTU do seu imóvel alegando divergência na área construída, mas, quando da visita de aferição, impediu o acesso do fiscal de tributos.\nConforme as normas da Lei nº 1.628/2011 que regem o Cadastro Imobiliário Municipal:",
      "alts": [
        "A comunicação espontânea efetuada por Bruno elide tanto a aplicação das penalidades por falta de comunicação quanto a cobrança das diferenças de IPTU dos exercícios anteriores.",
        "A revisão cadastral de Bruno elide a aplicação das penalidades de falta de comunicação de alteração cadastral (salvo dolo, fraude ou simulação), mas autoriza o lançamento do IPTU complementar dos exercícios anteriores não atingidos pela decadência.",
        "O dever de comunicar alterações nas características físicas do imóvel prescreve em 90 dias contados da conclusão da obra, após o qual o Fisco não pode efetuar lançamento complementar.",
        "O impedimento de acesso causado por Cláudio enseja a procedência automática do seu pedido de revisão, ante a presunção de veracidade das declarações do contribuinte.",
        "O impedimento ou inviabilização de acesso ao imóvel no caso do pedido de revisão de lançamento por impugnação implicará a suspensão do processo até que sobrevenha decisão judicial autorizando o acesso, sendo vedado o arquivamento administrativo do pedido. @@PAG@@ [p199]"
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A comunicação espontânea afasta apenas as penalidades pela falta de comunicação, mas não dispensa o pagamento das diferenças de IPTU dos exercícios anteriores não atingidos pela decadência. b) CERTA. A revisão cadastral com base em informação espontânea do contribuinte afasta a penalidade por falta de comunicação, salvo dolo, fraude ou simulação, mas autoriza o lançamento do IPTU complementar dos exercícios anteriores não decaídos. c) ERRADA. Não há esse prazo de 90 dias nem essa consequência; a comunicação de alteração cadastral segue prazo próprio, e a revisão pelo Fisco só é limitada pela decadência tributária. d) ERRADA. O impedimento de acesso não gera procedência automática do pedido; ao contrário, implica o arquivamento imediato do próprio pedido de revisão. e) ERRADA. A consequência legal do impedimento de acesso é o arquivamento imediato do próprio pedido de revisão, e não a suspensão do feito até decisão judicial.\nArt. 16, § 2º, III - lançamento do IPTU complementar de exercícios anteriores quando ficar comprovado, durante procedimento fiscal ou qualquer procedimento administrativo de atualização ou revisão cadastral, que ocorreram alterações nas características físicas do imóvel que implicaram a alteração na base de cálculo ou na alíquota, ou de ambas, aplicadas no lançamento original dos períodos não atingidos pela decadência.\nArt. 16, § 2º, IV - a revisão cadastral efetuada com base em informações espontaneamente apresentadas pelo contribuinte elide a aplicação das penalidades de falta de comunicação de alteração cadastral, salvo se comprovada, no âmbito do processo administrativo, a ocorrência de dolo, fraude ou simulação.\nArt. 34, § 1º O impedimento ou a inviabilização de acesso ao imóvel, quando do pedido de revisão de lançamento por impugnação, implicará seu imediato arquivamento, além da possibilidade de aplicação de sanções definidas na legislação municipal.\nResposta: Letra B\n\n@@PAG@@\n[p173]"
    },
    {
      "id": "q-iptu-t01",
      "materia": "IPTU",
      "origem": "FGV - 2024 - Prefeitura de Macaé - RJ - Auditor Fiscal Tributário — questão do meio da aula",
      "enunciado": "O Imposto sobre Propriedade Predial e Territorial Urbana (IPTU) é um importante meio de arrecadação tributária para os Municípios, cuja possibilidade de instituição e alguns aspectos de seu regime são diretamente previstos na Constituição Federal de 1988. À luz do texto constitucional, assinale a afirmativa correta.",
      "alts": [
        "O IPTU pode ter sua base de cálculo atualizada por decreto do Prefeito, conforme critérios estabelecidos em lei municipal.",
        "Não incide o IPTU sobre o imóvel onde funciona o edifício-sede de um sindicato patronal, por se tratar de entidade imune.",
        "A progressividade do IPTU em razão do valor do imóvel e a progressividade para cumprimento da função social da propriedade foram previstas na Constituição Federal de 1988 por obra do constituinte originário.",
        "Quando uma organização religiosa é mera locatária de imóvel para instalar templo de seu culto no imóvel alugado, o locador continua obrigado ao pagamento do IPTU durante o período da locação.",
        "A aplicação do IPTU progressivo no tempo para tutela da função social da propriedade urbana pode ser a primeira medida adotada pelo Poder Público municipal para exigir do proprietário do solo urbano não edificado, subutilizado ou não utilizado, que promova seu adequado aproveitamento."
      ],
      "correta": 0,
      "fundamento": "Analisando cada alternativa: a) CERTA. A base de cálculo pode ser atualizada por ato do Executivo, desde que a atualização siga critérios previamente definidos em lei municipal: corrige-se o valor venal para acompanhar o mercado, sem alterar a forma de cálculo, por isso não configura majoração e dispensa lei. b) ERRADA. A imunidade do art. 150, VI, c, alcança as entidades sindicais dos trabalhadores; os sindicatos patronais ficaram de fora do rol, de modo que o edifício-sede de sindicato patronal é normalmente tributado. c) ERRADA. A progressividade no tempo (função social) é obra do constituinte originário no art. 182, § 4º; foi a progressividade em razão do valor venal que veio depois, pelo constituinte derivado (EC 29/2000). A assertiva atribui as duas ao texto original. d) ERRADA. Utilizado como templo, o imóvel é imune mesmo com a entidade religiosa na condição de mera locatária: a proteção recai sobre a função religiosa do imóvel, não sobre a titularidade, afastando a cobrança também em relação ao locador. e) ERRADA. O IPTU progressivo no tempo é a segunda etapa do ritual do art. 182, § 4º; a primeira medida é sempre o parcelamento ou edificação compulsórios, e a desapropriação com títulos é a última.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-t02",
      "materia": "IPTU",
      "origem": "FGV - 2023 - ISS-RJ - Fiscal de Rendas — questão do meio da aula",
      "enunciado": "De modo a tutelar a função social da propriedade urbana, a Constituição da República de 1988, em seu Art.\n182, §4º, prevê a possibilidade de cobrança de IPTU progressivo no tempo.\nSão requisitos para a instituição dessa cobrança progressiva no tempo, EXCETO:",
      "alts": [
        "deve-se atender ao previsto no Estatuto da Cidade;",

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY_PROG='semef2026_progresso_v1', KEY_USER='semef2026_meusitens_v1';
const mem={};
const store={
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null }catch(e){ return mem[k]??null } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){ mem[k]=v } }
};

// ===== SINCRONIZAÇÃO OPCIONAL =====
// Depois de criar seu projeto no Supabase, preencha estes dois valores.
const SUPABASE_URL = 'https://iyzojejpeueoqgapseuh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CoL8WD5Kj0Psqarh7ai28w_GUm6o0B4';
let sb = null;
try {
  if (window.supabase && SUPABASE_URL.startsWith('http') && !SUPABASE_URL.includes('COLE_AQUI')) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch(e) { console.warn('Supabase não configurado', e); }

async function sincronizarNuvem(){
  if(!sb){ toast('Supabase ainda não configurado'); return; }
  const email = prompt('E-mail da sua conta de sincronização:');
  if(!email) return;
  const senha = prompt('Senha:');
  if(!senha) return;
  try {
    let { data, error } = await sb.auth.signInWithPassword({email, password:senha});
    if(error) throw error;
    const userId=data.user.id;
    const payload={user_id:userId, progresso, meus, updated_at:new Date().toISOString()};
    const r=await sb.from('app_state').upsert(payload,{onConflict:'user_id'});
    if(r.error) throw r.error;
    const q=await sb.from('app_state').select('progresso,meus,updated_at').eq('user_id',userId).single();
    if(q.error) throw q.error;
    if(q.data?.progresso) progresso=q.data.progresso;
    if(q.data?.meus) meus=q.data.meus;
    salvarProg(); salvarMeus(); render();
    toast('Sincronização concluída!');
  } catch(e){ console.error(e); toast('Falha na sincronização: '+(e.message||'verifique a configuração')); }
}

let progresso = store.get(KEY_PROG) || {};
let meus = store.get(KEY_USER) || {juris:[],questoes:[]};
['juris','questoes'].forEach(t=>{ if(!Array.isArray(meus[t])) meus[t]=[] });

const salvarProg=()=>store.set(KEY_PROG,progresso);
const salvarMeus=()=>store.set(KEY_USER,meus);
const hoje=()=>new Date().toISOString().slice(0,10);
const somaDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function base(tipo){ return (SEED[tipo]||[]).concat(meus[tipo]||[]) }
function prog(id){ return progresso[id] || {caixa:0, prox:'2000-01-01', acertos:0, erros:0, ultimaResp:null} }
function devida(id){ return prog(id).prox <= hoje() }

let estado={aba:'juris', materia:'TODAS', tema:'TODOS', soDevidas:false, soErradas:false, adiantarJuris:false, idx:0, revelado:false, respondida:null, fontSize:15, riscadas:{}, selecionada:null};

function materiasDisponiveis(){
  const s=new Set();
  ['juris','questoes'].forEach(t=>base(t).forEach(i=>s.add(i.materia||'Sem matéria')));
  return ['TODAS',...[...s].sort()];
}
function temasDisponiveis(){
  const s=new Set();
  ['juris','questoes'].forEach(t=>base(t).forEach(i=>{
    if(estado.materia==='TODAS'||i.materia===estado.materia) s.add(i.tema||'Sem tema');
  }));
  return ['TODOS',...[...s].sort()];
}
function fila(tipo){
  let l=base(tipo).filter(i=>estado.materia==='TODAS'||i.materia===estado.materia);
  l=l.filter(i=>estado.tema==='TODOS'||(i.tema||'Sem tema')===estado.tema);
  if(tipo==='juris' && estado.adiantarJuris){
    return l;
  }
  if(estado.soErradas){ l=l.filter(i=>prog(i.id).erros > 0); }
  else if(estado.soDevidas || tipo==='juris'){ const d=l.filter(i=>devida(i.id)); if(d.length || estado.soDevidas) l=d }
  return l;
}

function irParaPrimeiraNaoResolvida(){
  const l = fila('questoes');
  if(!l.length) { estado.idx = 0; return; }
  const iNaoResolvida = l.findIndex(item => {
    const p = prog(item.id);
    return (p.acertos + p.erros) === 0;
  });
  estado.idx = iNaoResolvida !== -1 ? iNaoResolvida : 0;
}

function responderJuris(id, dias){
  const p = prog(id);
  p.acertos = (p.acertos || 0) + 1;
  p.prox = somaDias(dias);
  p.visto = hoje();
  progresso[id] = p;
  salvarProg();
}

function responderQuestao(id, nota, altEscolhida=null){
  const p=prog(id);
  if(nota===2){ p.acertos++ }
  else { p.erros++ }
  p.prox = somaDias(nota===0 ? 0 : 3);
  p.visto = hoje();
  if(altEscolhida !== null) p.ultimaResp = altEscolhida;
  progresso[id]=p; salvarProg();
}

function refazerQuestao(id){
  delete progresso[id];
  salvarProg();
  estado.respondida = null;
  estado.selecionada = null;
  if(estado.riscadas[id]) delete estado.riscadas[id];
  toast('Questão liberada para responder!');
  render();
}

function restaurarTodasDoFiltro(){
  const l = fila('questoes');
  if(!l.length) return;
  if(confirm(`Deseja restaurar/limpar o histórico de todas as ${l.length} questões deste filtro?`)){
    l.forEach(i => delete progresso[i.id]);
    salvarProg();
    estado.idx = 0;
    estado.respondida = null;
    estado.selecionada = null;
    toast('Caderno restaurado com sucesso!');
    render();
  }
}

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1600) }

function placar(){
  const todos=['juris','questoes'].flatMap(t=>base(t));
  const dominados=todos.filter(i=>prog(i.id).acertos>=3).length;
  const dev=todos.filter(i=>devida(i.id)).length;
  document.getElementById('placar').innerHTML=`<b>${dominados}</b>/${todos.length} dominados<br>${dev} para revisar hoje`;
}

function filtros(){
  const sel=document.getElementById('fMateria');
  const atual=estado.materia;
  sel.innerHTML=materiasDisponiveis().map(m=>`<option ${m===atual?'selected':''}>${esc(m)}</option>`).join('');
  const st=document.getElementById('fTema');
  const temas=temasDisponiveis();
  if(!temas.includes(estado.tema)) estado.tema='TODOS';
  st.innerHTML=temas.map(m=>`<option ${m===estado.tema?'selected':''}>${esc(m)}</option>`).join('');
  document.getElementById('cDevidas').classList.toggle('on',estado.soDevidas);
  document.getElementById('cErradas').classList.toggle('erradas-on',estado.soErradas);
}

function render(){
  filtros(); placar();
  const tela=document.getElementById('tela');
  tela.innerHTML = ({juris:vJuris,questoes:vQuestao,add:vAdd,ajustes:vAjustes})[estado.aba]();
  document.documentElement.style.setProperty('--font-size-base', estado.fontSize + 'px');
  ligar();
}

function vazio(msg){ return `<div class="vazio"><b>Nada por aqui</b>${msg}</div>` }

function vJuris(){
  const l=fila('juris');
  if(!l.length){
    return `
      <div class="vazio">
        <b>Parabéns! Nenhuma jurisprudência para revisar hoje.</b>
        <button class="btn linha cheio" id="btn-adiantar" style="margin-top:14px;">Adiantar Revisão</button>
      </div>`;
  }
  if(estado.idx>=l.length) estado.idx=0;
  const it=l[estado.idx], p=prog(it.id);
  const frente = it.ref;
  const olho   = `${it.tribunal||''} · ${it.materia||''}`;
  const verso  = it.tese;
  const rodape = it.obs||'';
  return `
    <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
      <button class="chip ${estado.adiantarJuris?'on':''}" id="btn-adiantar-toggle">
        ${estado.adiantarJuris?'Modo: Adiantando Todas':'Adiantar Revisão'}
      </button>
    </div>
    <div class="card" id="card">
      <div class="eyebrow">${esc(olho)}</div>
      <div class="chave">${esc(frente)}</div>
      ${estado.revelado?`
        <div class="verso">${esc(verso)}</div>
        ${rodape?`<div class="fonte">${esc(rodape)}</div>`:''}`:''}
    </div>
    ${estado.revelado?`
      <div class="acoes">
        <button class="btn meio" data-dias="1">Revisar em 1 dia</button>
        <button class="btn meio" data-dias="3">Revisar em 3 dias</button>
        <button class="btn ok"    data-dias="7">Revisar em 7 dias</button>
      </div>`:`<p class="dica">toque no cartão para revelar · ${estado.idx+1} de ${l.length}</p>`}
    <button class="btn linha" id="pular">Pular</button>`;
}

function vQuestao(){
  const l=fila('questoes');
  if(!l.length) return vazio('Sem questões nesta matéria com os filtros aplicados.');
  if(estado.idx>=l.length) estado.idx=0;
  
  const q=l[estado.idx], p=prog(q.id);
  const r = (estado.respondida !== null) ? estado.respondida : p.ultimaResp;
  
  const letras='ABCDE';
  const riscadas = estado.riscadas[q.id] || {};

  let totalCaderno = l.length;
  let resolvidasCaderno = 0;
  let acertosCaderno = 0;
  let errosCaderno = 0;

  l.forEach(item => {
    const pr = prog(item.id);
    const tot = pr.acertos + pr.erros;
    if (tot > 0) {
      resolvidasCaderno++;
      acertosCaderno += pr.acertos;
      errosCaderno += pr.erros;
    }
  });
  
  return `
    <div class="questao-container" id="questao-container">
      <div class="tec-stats-container">
        <div class="tec-stats">
          Questão <b>${estado.idx + 1}</b> de <b>${totalCaderno}</b> 
          <span style="font-size:12px; display:block; margin-top:2px;">(<span class="st-res"><b>${resolvidasCaderno}</b> Resolvidas</span>, <span class="st-ok"><b>${acertosCaderno}</b> Acertos</span> e <span class="st-err"><b>${errosCaderno}</b> Erros</span>)</span>
        </div>
        <button class="btn-restaurar-todas" id="btn-restaurar-todas" title="Zerar histórico deste caderno">Restaurar Todas</button>
      </div>

      <div class="enunciado">
        <div class="eyebrow"><b>#${q.id||'--'}</b> ${esc(q.origem||'')} — ${esc(q.materia||'')}</div>
        <div class="txt">${esc(q.enunciado)}</div>
      </div>
      
      <div class="controles-questao">
        <div class="controle-fonte">
          <button class="btn-fonte" id="diminuir-fonte">A-</button>
          <button class="btn-fonte" id="aumentar-fonte">A+</button>
        </div>
        <div class="info-questao">${estado.idx+1} de ${l.length}</div>
      </div>
      
      <div class="alts">
        ${q.alts.map((a,i)=>{
          let cls='alt';
          if(r!==null){ if(i===q.correta) cls+=' certa'; else if(i===r) cls+=' errada' }
          if(riscadas[i]) cls+=' riscada';
          if(estado.selecionada===i && r===null) cls+=' selecionada';
          return `<button class="${cls}" data-alt="${i}" ${r!==null?'disabled':''}>
                    <span class="letra">${letras[i]}</span><span class="texto-alt">${esc(a)}</span></button>`;
        }).join('')}
      </div>
      
      ${r!==null?`
        <div class="gab"><b>${r===q.correta?'✓ Acertou!':'✗ Errou.'} Gabarito: ${letras[q.correta]}</b><br>${esc(q.fundamento||'')}</div>
        <div class="linha-refazer">
          <button class="btn-refazer-circulo" id="btn-refazer" title="Refazer esta questão">↺</button>
        </div>
        <button class="btn-resolver" id="proxima" style="background:#2563eb">Próxima questão</button>`
       :`<button class="btn-resolver" id="resolver">RESOLVER QUESTÃO</button>`}
    </div>`;
}

function vAdd(){
  return `
    <div class="filtros" style="margin:0 0 4px">
      <button class="chip on" data-add="juris">Jurisprudência</button>
      <button class="chip" data-add="questoes">Questão</button>
    </div>
    <div id="form"></div>
    <hr>
    <label>Importar arquivo de lote (.json)</label>
    <input type="file" accept=".json,application/json" id="arq">
    <label>Ou colar em lote (JSON)</label>
    <textarea id="lote" placeholder='[{"tipo":"juris","materia":"IPTU","tribunal":"STF","ref":"...","tese":"..."}]'></textarea>
    <button class="btn linha" id="importarLote">Adicionar lote</button>
    <div class="aviso">Itens adicionados aqui ficam guardados no aparelho. Para levar para o celular, use a aba <b>Ajustes</b> e baixe o <b>Backup</b> ou o <b>App com Dados</b>.</div>
    <hr>
    <div id="listaMeus"></div>`;
}

function formAdd(tipo){
  const campos={
    juris:[['materia','Matéria'],['tribunal','Tribunal'],['ref','Referência (súmula / RE / Tema)'],['tese','Tese','area'],['obs','Observação / pegadinha','area']],
    questoes:[['materia','Matéria'],['origem','Origem (banca, ano, cargo)'],['enunciado','Enunciado','area'],
              ['a','Alternativa A'],['b','Alternativa B'],['c','Alternativa C'],['d','Alternativa D'],['e','Alternativa E'],
              ['correta','Letra correta (A a E)'],['fundamento','Fundamento','area']]
  }[tipo];
  return campos.map(([k,l,t])=>`<label>${l}</label>${t==='area'?`<textarea data-k="${k}"></textarea>`:`<input data-k="${k}">`}`).join('')
    + `<button class="btn linha cheio" id="salvarItem">Adicionar</button>`;
}

function listaMeus(){
  const el=document.getElementById('listaMeus'); if(!el) return;
  const tudo=['juris','questoes'].flatMap(t=>meus[t].map(i=>({t,i})));
  el.innerHTML = tudo.length
    ? `<label>Meus itens (${tudo.length})</label>` + tudo.slice(-40).reverse().map(({t,i})=>`
        <div class="item"><h4>${esc(i.ref||(i.enunciado||'').slice(0,60))}</h4>
        <p>${t} · ${esc(i.materia||'')} · <a href="#" data-del="${i.id}" data-tipo="${t}" style="color:var(--errado)">apagar</a></p></div>`).join('')
    : '';
}

function vAjustes(){
  const todos=['juris','questoes'].flatMap(t=>base(t));
  const vistos=todos.filter(i=>progresso[i.id]).length;
  return `
    <div class="item"><h4>☁️ Sincronização</h4><p>Use o mesmo e-mail e senha no PC, celular e tablet. O app continua funcionando offline; a internet é usada somente quando você tocar em sincronizar.</p><button class="btn linha cheio" id="btSincronizar">🔄 Sincronizar agora</button></div>
    <div class="item"><h4>Situação</h4><p>${SEED.juris.length+SEED.questoes.length} itens no arquivo · ${meus.juris.length+meus.questoes.length} adicionados por você · ${vistos} itens já estudados</p></div>
    
    <label>Portabilidade (PC ↔ Celular)</label>
    <button class="btn linha cheio" id="baixarApp">Baixar APP com meus dados embutidos</button>
    <div class="aviso">Esta é a melhor forma de levar seus dados para o celular. Ele gera um novo arquivo .html já com tudo que você adicionou dentro dele.</div>
    
    <hr>
    <label>Backup de Dados</label>
    <button class="btn linha" id="exportar">Exportar Backup (.json)</button>
    
    <label>Restaurar Backup</label>
    <input type="file" accept=".json,application/json" id="arqBackup" style="margin-bottom:8px">
    <textarea id="restaurar" placeholder="Ou cole aqui o conteúdo do JSON de backup"></textarea>
    <button class="btn linha" id="btRestaurar">Restaurar backup</button>
    
    <hr>
    <label>Limpar itens por matéria e tema</label>
    <select id="limpMateria">${materiasDisponiveis().map(m=>`<option>${esc(m)}</option>`).join('')}</select>
    <select id="limpTema">${['TODOS',...[...new Set(['juris','questoes'].flatMap(t=>base(t).map(i=>i.tema||'Sem tema')))].sort()].map(m=>`<option>${esc(m)}</option>`).join('')}</select>
    <button class="btn linha err" id="limpar">Apagar itens do filtro acima</button>
    <hr>
    <button class="btn linha err" id="zerar">Zerar progresso (mantém os itens)</button>
    <div class="aviso">Se o celular "zerar" os dados ao fechar, é porque o navegador bloqueia o armazenamento local para arquivos. Use o botão <b>Baixar APP com meus dados</b> para salvar permanentemente.</div>`;
}

/* ---------- eventos ---------- */
let touchStartX = 0;
let touchEndX = 0;
let tapTimer = null;
let lastTapAlt = null;

function ligar(){
  const card=document.getElementById('card');
  if(card) card.onclick=()=>{ estado.revelado=!estado.revelado; render() };

  document.querySelectorAll('[data-dias]').forEach(b=>b.onclick=()=>{
    const l=fila('juris');
    if(l.length > 0){
      responderJuris(l[estado.idx].id, +b.dataset.dias);
      toast(`Revisão agendada para +${b.dataset.dias} dia(s)`);
      estado.revelado=false;
      if(estado.adiantarJuris){
        estado.idx++;
      }
      render();
    }
  });

  const btnAdiantar=document.getElementById('btn-adiantar');
  if(btnAdiantar) btnAdiantar.onclick=()=>{
    estado.adiantarJuris = true;
    estado.idx = 0;
    render();
  };

  const btnAdiantarToggle=document.getElementById('btn-adiantar-toggle');
  if(btnAdiantarToggle) btnAdiantarToggle.onclick=()=>{
    estado.adiantarJuris = !estado.adiantarJuris;
    estado.idx = 0;
    render();
  };

  const pular=document.getElementById('pular');
  if(pular) pular.onclick=()=>{ estado.revelado=false; estado.idx++; estado.riscadas={}; render() };

  // NAVEGAÇÃO DE SWIPE EM QUESTÕES
  const container = document.getElementById('questao-container');
  if(container){
    container.addEventListener('touchstart', e=>{ touchStartX=e.changedTouches[0].screenX }, false);
    container.addEventListener('touchend', e=>{
      touchEndX=e.changedTouches[0].screenX;
      if(touchEndX < touchStartX - 80){ estado.idx++; estado.riscadas={}; estado.selecionada=null; estado.respondida=null; render() }
      else if(touchEndX > touchStartX + 80){ estado.idx--; if(estado.idx<0) estado.idx=0; estado.riscadas={}; estado.selecionada=null; estado.respondida=null; render() }
    }, false);
  }

  // LÓGICA DE UM TOQUE (SELECIONAR) E DOIS TOQUES (RISCAR)
  document.querySelectorAll('[data-alt]').forEach(b=>{
    b.onclick = ev => {
      ev.preventDefault();
      const l = fila('questoes'), q = l[estado.idx], i = +b.dataset.alt;
      const p = prog(q.id);
      if (estado.respondida !== null || p.ultimaResp !== null) return;

      if (tapTimer && lastTapAlt === i) {
        clearTimeout(tapTimer);
        tapTimer = null;
        lastTapAlt = null;
        if (!estado.riscadas[q.id]) estado.riscadas[q.id] = {};
        estado.riscadas[q.id][i] = !estado.riscadas[q.id][i];
        if (navigator.vibrate) navigator.vibrate(40);
        render();
      } else {
        clearTimeout(tapTimer);
        lastTapAlt = i;
        tapTimer = setTimeout(() => {
          estado.selecionada = i;
          tapTimer = null;
          lastTapAlt = null;
          render();
        }, 250);
      }
    };
  });

  const resolver=document.getElementById('resolver');
  if(resolver) resolver.onclick=()=>{
    if(estado.selecionada===null){
      toast('Selecione uma alternativa');
    } else {
      const l=fila('questoes'), q=l[estado.idx];
      estado.respondida=estado.selecionada;
      responderQuestao(q.id, estado.selecionada===q.correta?2:0, estado.selecionada);
      render();
    }
  };

  const prox=document.getElementById('proxima');
  if(prox) prox.onclick=()=>{ estado.respondida=null; estado.idx++; estado.riscadas={}; estado.selecionada=null; render() };

  const refazer=document.getElementById('btn-refazer');
  if(refazer) refazer.onclick=()=>{
    const l=fila('questoes'), q=l[estado.idx];
    refazerQuestao(q.id);
  };

  const resTodas=document.getElementById('btn-restaurar-todas');
  if(resTodas) resTodas.onclick=()=>{
    restaurarTodasDoFiltro();
  };

  const aumentar=document.getElementById('aumentar-fonte');
  const diminuir=document.getElementById('diminuir-fonte');
  if(aumentar) aumentar.onclick=()=>{ estado.fontSize=Math.min(estado.fontSize+2,24); render() };
  if(diminuir) diminuir.onclick=()=>{ estado.fontSize=Math.max(estado.fontSize-2,12); render() };

  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-add]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('form').innerHTML=formAdd(b.dataset.add);
    document.getElementById('form').dataset.tipo=b.dataset.add;
    ligarForm();
  });

  if(estado.aba==='add'){
    const f=document.getElementById('form');
    if(f && !f.innerHTML){ f.innerHTML=formAdd('juris'); f.dataset.tipo='juris'; ligarForm() }
    listaMeus(); ligarLote();
  }
  if(estado.aba==='ajustes') ligarAjustes();
}

function ligarForm(){
  const f=document.getElementById('form');
  document.getElementById('salvarItem').onclick=()=>{
    const tipo=f.dataset.tipo, v={};
    f.querySelectorAll('[data-k]').forEach(e=>v[e.dataset.k]=e.value.trim());
    const id=tipo[0]+'-u-'+Date.now().toString(36);
    let item;
    if(tipo==='questoes'){
      const alts=['a','b','c','d','e'].map(k=>v[k]).filter(Boolean);
      const letra=(v.correta||'').toUpperCase();
      if(!v.enunciado||alts.length<2||!'ABCDE'.includes(letra)) return toast('Falta enunciado, alternativas ou letra correta');
      item={id,materia:v.materia||'Sem matéria',origem:v.origem||'sem origem',enunciado:v.enunciado,alts,correta:'ABCDE'.indexOf(letra),fundamento:v.fundamento};
    } else {
      if(!v.ref||!v.tese) return toast('Falta referência ou tese');
      item={id,materia:v.materia||'Sem matéria',tribunal:v.tribunal,ref:v.ref,tese:v.tese,obs:v.obs};
    }
    meus[tipo].push(item); salvarMeus();
    f.querySelectorAll('[data-k]').forEach(e=>e.value='');
    toast('Adicionado'); listaMeus(); ligarDel(); placar(); filtros();
  };
  ligarDel();
}

function ligarDel(){
  document.querySelectorAll('[data-del]').forEach(a=>a.onclick=ev=>{
    ev.preventDefault();
    const {del,tipo}=a.dataset;
    meus[tipo]=meus[tipo].filter(i=>i.id!==del); salvarMeus();
    listaMeus(); ligarDel(); placar(); toast('Apagado');
  });
}

function idsExistentes(){
  const s=new Set();
  ['juris','questoes'].forEach(t=>base(t).forEach(i=>s.add(i.id)));
  return s;
}

function importarArray(arr){
  if(!Array.isArray(arr)) throw 0;
  const jaTem=idsExistentes();
  let n=0,pulados=0;
  arr.forEach(o=>{
    const tipo=o.tipo||'juris'; if(!meus[tipo]) return;
    const item=Object.assign({},o); delete item.tipo;
    item.id=item.id||tipo[0]+'-u-'+Math.random().toString(36).slice(2,9);
    if(jaTem.has(item.id)){ pulados++; return }
    meus[tipo].push(item); jaTem.add(item.id); n++;
  });
  salvarMeus(); placar(); filtros();
  return {n,pulados};
}

function ligarLote(){
  const arq=document.getElementById('arq');
  if(arq) arq.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const r=importarArray(JSON.parse(fr.result));
        toast(r.n+' adicionados'+(r.pulados?' · '+r.pulados+' já existiam':''));
        listaMeus(); ligarDel();
      }catch(err){ toast('Arquivo inválido') }
    };
    fr.readAsText(f);
  };
  document.getElementById('importarLote').onclick=()=>{
    try{
      const arr=JSON.parse(document.getElementById('lote').value);
      const r=importarArray(arr);
      document.getElementById('lote').value='';
      toast(r.n+' adicionados'+(r.pulados?' · '+r.pulados+' já existiam':''));
      listaMeus(); ligarDel();
    }catch(e){ toast('JSON inválido') }
  };
}

function ligarAjustes(){
  const bs=document.getElementById('btSincronizar');
  if(bs) bs.onclick=sincronizarNuvem;
  document.getElementById('baixarApp').onclick=()=>{
    const html=document.documentElement.outerHTML;
    const novoSeed = {
      juris: SEED.juris.concat(meus.juris),
      questoes: SEED.questoes.concat(meus.questoes)
    };
    const dadosStr = 'const SEED = ' + JSON.stringify(novoSeed, null, 2) + ';';
    const regex = /const SEED = \{[\s\S]*?\};/;
    const novoHtml = html.replace(regex, dadosStr);
    
    const blob=new Blob([novoHtml],{type:'application/html'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='app_semef_dados.html'; a.click();
    toast('App gerado com sucesso!');
  };

  document.getElementById('exportar').onclick=()=>{
    const blob=new Blob([JSON.stringify({progresso,meus},null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='backup_semef_'+hoje()+'.json'; a.click();
  };

  const arqB=document.getElementById('arqBackup');
  if(arqB) arqB.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(d.progresso){ progresso=d.progresso; salvarProg() }
        if(d.meus){ meus=d.meus; salvarMeus() }
        toast('Backup restaurado'); render();
      }catch(err){ toast('Arquivo inválido') }
    };
    fr.readAsText(f);
  };

  document.getElementById('btRestaurar').onclick=()=>{
    try{
      const d=JSON.parse(document.getElementById('restaurar').value);
      if(d.progresso){ progresso=d.progresso; salvarProg() }
      if(d.meus){ meus=d.meus; salvarMeus() }
      toast('Backup restaurado'); render();
    }catch(e){ toast('JSON inválido') }
  };
  document.getElementById('zerar').onclick=()=>{
    if(confirm('Zerar todo o progresso? Os itens continuam.')){ progresso={}; salvarProg(); toast('Progresso zerado'); render() }
  };
  const bl=document.getElementById('limpar');
  if(bl) bl.onclick=()=>{
    const m=document.getElementById('limpMateria').value, t=document.getElementById('limpTema').value;
    const alvo=i=>(m==='TODAS'||i.materia===m)&&(t==='TODOS'||(i.tema||'Sem tema')===t);
    const ids=['juris','questoes'].flatMap(x=>meus[x].filter(alvo).map(i=>i.id));
    if(!ids.length){ toast('Nada corresponde a esse filtro'); return }
    if(!confirm('Apagar '+ids.length+' itens de '+m+' / '+t+'? O progresso deles também some.')) return;
    ['juris','questoes'].forEach(x=>{ meus[x]=meus[x].filter(i=>!alvo(i)) });
    ids.forEach(i=>{ delete progresso[i] });
    salvarMeus(); salvarProg(); estado.tema='TODOS'; toast(ids.length+' itens apagados'); render();
  };
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  estado.aba=b.dataset.aba; estado.revelado=false; estado.respondida=null; estado.riscadas={}; estado.selecionada=null;
  if(estado.aba === 'questoes'){
    irParaPrimeiraNaoResolvida();
  } else {
    estado.idx = 0;
  }
  window.scrollTo(0,0); render();
});

document.getElementById('fMateria').onchange=e=>{ 
  estado.materia=e.target.value; estado.tema='TODOS'; estado.revelado=false; estado.respondida=null; estado.selecionada=null; 
  if(estado.aba === 'questoes') irParaPrimeiraNaoResolvida();
  else estado.idx=0;
  render(); 
};

document.getElementById('fTema').onchange=e=>{ 
  estado.tema=e.target.value; estado.revelado=false; estado.respondida=null; estado.selecionada=null; 
  if(estado.aba === 'questoes') irParaPrimeiraNaoResolvida();
  else estado.idx=0;
  render(); 
};

document.getElementById('cDevidas').onclick=()=>{ 
  estado.soDevidas = !estado.soDevidas; 
  if(estado.soDevidas) estado.soErradas = false;
  estado.revelado=false; estado.respondida=null; 
  if(estado.aba === 'questoes') irParaPrimeiraNaoResolvida();
  else estado.idx=0;
  render();
};

document.getElementById('cErradas').onclick=()=>{ 
  estado.soErradas = !estado.soErradas; 
  if(estado.soErradas) estado.soDevidas = false;
  estado.revelado=false; estado.respondida=null; 
  if(estado.aba === 'questoes') irParaPrimeiraNaoResolvida();
  else estado.idx=0;
  render();
};

render();
</script>
