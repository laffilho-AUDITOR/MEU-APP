<html lang="pt-BR" style="--font-size-base: 15px;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1412">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SEMEF Manaus 2026</title>
<style>
:root{
  --agua-preta:#0B1412;
  --agua-funda:#101E1B;
  --barranco:#172A26;
  --linha:#24413A;
  --areia:#EFE7D6;
  --areia-fraca:#C9BFA8;
  --ouro:#E0A32E;
  --ouro-fraco:#8A6A22;
  --certo:#3FB27F;
  --errado:#D9584B;
  --texto:#DCE9E4;
  --texto-fraco:#8FA8A0;
  --r:14px;
  --font-size-base: 16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--agua-preta);
  color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
  font-size:var(--font-size-base);line-height:1.45;
  padding-bottom:86px;
  overscroll-behavior-y:contain;
}
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--agua-funda) 70%,rgba(16,30,27,.85));
  border-bottom:1px solid var(--linha);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;
}
.topo{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:15px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--areia)}
h1 small{display:block;letter-spacing:.04em;text-transform:none;font-weight:400;font-size:11px;color:var(--texto-fraco);margin-top:2px}
.placar{font-variant-numeric:tabular-nums;font-size:12px;color:var(--texto-fraco);text-align:right;white-space:nowrap}
.placar b{color:var(--ouro);font-size:15px}
.filtros{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
select,input,textarea,button{font-family:inherit;font-size:calc(var(--font-size-base) - 2px)}
select,input,textarea{
  background:var(--barranco);color:var(--texto);border:1px solid var(--linha);
  border-radius:99px;padding:8px 10px;width:100%;
}
select,input{border-radius:9px}
textarea{min-height:78px;resize:vertical;line-height:1.4;border-radius:9px}
.filtros select{flex:1;min-width:120px}
.chip{
  border:1px solid var(--linha);background:transparent;color:var(--texto-fraco);
  border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer;white-space:nowrap
}
.chip.on{background:var(--ouro);border-color:var(--ouro);color:#1a1206;font-weight:700}
.chip.erradas-on{background:var(--errado);border-color:var(--errado);color:#ffffff;font-weight:700}
main{padding:14px;max-width:720px;margin:0 auto}
.vazio{border:1px dashed var(--linha);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--texto-fraco);font-size:14px}
.vazio b{color:var(--areia);display:block;margin-bottom:6px;font-size:15px}

/* ---- cartão ---- */
.card{
  background:var(--areia);color:#1B1B17;border-radius:var(--r);
  padding:20px 18px;min-height:190px;
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 10px 26px rgba(0,0,0,.45);cursor:pointer;position:relative;overflow:hidden
}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ouro)}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7A6A45;margin-bottom:10px;font-weight:700}
.chave{font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.verso{
  font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.5;
  margin-top:14px;padding-top:14px;border-top:1px solid #D5C9AC;white-space:pre-wrap
}
.fonte{margin-top:12px;font-size:12px;color:#6F6244;font-weight:600}
.detalhe{margin-top:12px;font-size:13.5px;line-height:1.5;color:#4A4030;border-top:1px solid rgba(0,0,0,.12);padding-top:8px}
.detalhe summary{cursor:pointer;font-size:12px;font-weight:600;color:#6F6244;letter-spacing:.02em;margin-bottom:6px}
.conferir{display:inline-block;margin-top:8px;font-size:11px;background:#F3D9A0;color:#6B4E06;border-radius:6px;padding:3px 7px;font-weight:700}
.dica{text-align:center;color:var(--texto-fraco);font-size:12px;margin:12px 0 0}

/* ---- botoes de resposta ---- */
.acoes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.btn{
  border:1px solid var(--linha);background:var(--barranco);color:var(--texto);
  border-radius:11px;padding:14px 8px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;
}
.btn:active{transform:translateY(1px)}
.btn.err{border-color:#5A2A26;color:#F0A79E}
.btn.meio{border-color:#5E4A1B;color:#EBCB86}
.btn.ok{border-color:#215243;color:#93E2C0}
.btn.cheio{background:var(--ouro);border-color:var(--ouro);color:#1a1206}
.btn.linha{width:100%;margin-top:8px}
.btn:focus-visible,.chip:focus-visible,.alt:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}

/* ---- QUESTAO ESTILO TEC CONCURSOS ---- */
.questao-container{
  background:#ffffff;
  border-radius:10px;
  padding:20px 16px;
  color:#2c3e50;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

/* Placar Estilo TEC */
.tec-stats-container{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid #f0f0f0;
}
.tec-stats{
  font-size:14px;
  color:#333;
  font-weight:400;
}
.tec-stats b{ font-weight:700; }
.tec-stats .st-res{ color:#555; }
.tec-stats .st-ok{ color:#2e7d32; font-weight:700; }
.tec-stats .st-err{ color:#c62828; font-weight:700; }

.btn-restaurar-todas{
  background:#fff0f0;
  border:1px solid #ffccc7;
  color:#d9363e;
  border-radius:6px;
  padding:4px 8px;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
}
.btn-restaurar-todas:hover{ background:#ff4d4f; color:#fff; }

.enunciado{
  background:transparent;
  border:none;
  padding:0;
  margin-bottom:20px;
}
.enunciado .eyebrow{
  font-size:12px;
  color:#7f8c8d;
  margin-bottom:12px;
  font-weight:600;
  letter-spacing: normal;
  text-transform: none;
}
.enunciado .txt{
  font-size:var(--font-size-base);
  line-height:1.65;
  white-space:pre-line;
  text-align:justify;
  text-justify:inter-word;
  color:#333;
}

.alts{
  margin:16px 0;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.alt{
  display:flex;
  gap:14px;
  text-align:left;
  align-items:flex-start;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  color:#374151;
  border-radius:8px;
  padding:14px 16px;
  cursor:pointer;
  font-size:var(--font-size-base);
  line-height:1.55;
  width:100%;
  position:relative;
  transition:all .15s ease;
  -webkit-user-select:none;
  user-select:none;
}
.alt .letra{
  font-weight:600;
  color:#4b5563;
  min-width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #d1d5db;
  border-radius:50%;
  flex-shrink:0;
  font-size:13px;
  background:#fff;
}
.alt .texto-alt{
  flex:1;
  white-space:pre-line;
  text-align:justify;
  text-justify:inter-word;
}

/* Riscada com dois toques */
.alt.riscada{
  background:#f3f4f6!important;
  border-color:#e5e7eb!important;
}
.alt.riscada .texto-alt{
  text-decoration:line-through;
  text-decoration-thickness: 1.5px;
  opacity:0.4;
  color:#6b7280;
}
.alt.riscada .letra{
  opacity:0.35;
  border-color:#d1d5db;
  background:#e5e7eb;
  text-decoration:line-through;
}

/* Seleção e Gabarito */
.alt.selecionada{
  border-color:#3b82f6;
  background:#eff6ff;
}
.alt.selecionada .letra{
  color:#1d4ed8;
  border-color:#3b82f6;
  background:#dbeafe;
}
.alt.certa{
  border-color:#10b981!important;
  background:#ecfdf5!important;
}
.alt.certa .letra{
  color:#047857!important;
  border-color:#10b981!important;
  background:#d1fae5!important;
}
.alt.errada{
  border-color:#ef4444!important;
  background:#fef2f2!important;
}
.alt.errada .letra{
  color:#b91c1c!important;
  border-color:#ef4444!important;
  background:#fee2e2!important;
}

.gab{
  margin-top:18px;
  border-left:4px solid #10b981;
  padding:16px;
  background:#f0fdf4;
  border-radius:0 8px 8px 0;
  font-size:calc(var(--font-size-base) - 1px);
  line-height:1.65;
  color:#166534;
  white-space:pre-line;
  word-break:break-word;
}
.gab b{
  color:#15803d;
  font-size:calc(var(--font-size-base) + 1px);
  display:block;
  margin-bottom:8px;
}

/* Controles */
.controles-questao{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:12px 0 20px;
  padding:8px 12px;
  background:#f3f4f6;
  border-radius:8px;
}
.controle-fonte{
  display:flex;
  gap:6px;
  align-items:center;
}
.btn-fonte{
  background:#fff;
  border:1px solid #d1d5db;
  color:#374151;
  border-radius:6px;
  padding:4px 8px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  min-width:28px;
}
.info-questao{
  font-size:12px;
  color:#6b7280;
  white-space:nowrap;
}

/* Botão Resolver / Próxima em Largura Total */
.btn-resolver{
  width:100%;
  padding:14px 16px;
  background:#52c41a;
  border:none;
  color:#fff;
  border-radius:6px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:.04em;
  box-shadow:0 2px 4px rgba(0,0,0,.1);
  display:block;
  text-align:center;
  margin-top:12px;
}
.btn-resolver:active{ opacity:0.9; }

.linha-refazer{
  display:flex;
  justify-content:flex-end;
  margin-top:12px;
}
.btn-refazer-circulo{
  width:38px;
  height:38px;
  background:#f3f4f6;
  border:1px solid #d1d5db;
  color:#4b5563;
  border-radius:50%;
  font-size:16px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .15s ease;
}
.btn-refazer-circulo:hover{
  background:#e5e7eb;
  color:#111827;
}

/* ---- listas / formulario ---- */
.item{border:1px solid var(--linha);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--agua-funda)}
.item h4{margin:0 0 4px;font-size:14px;color:var(--areia)}
.item p{margin:0;font-size:13px;color:var(--texto-fraco)}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-fraco);margin:12px 0 5px;font-weight:600}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aviso{font-size:13px;color:var(--texto-fraco);border:1px dashed var(--linha);border-radius:12px;padding:12px;margin-top:14px}
.aviso code{color:var(--ouro);font-size:12px}
hr{border:0;border-top:1px solid var(--linha);margin:20px 0}

/* ---- abas ---- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--agua-funda);border-top:1px solid var(--linha);
  padding-bottom:env(safe-area-inset-bottom)
}
nav button{
  background:none;border:0;color:var(--texto-fraco);padding:10px 2px 12px;
  font-size:10.5px;letter-spacing:.04em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px
}
nav button .ic{font-size:17px;line-height:1}
nav button.on{color:var(--ouro)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:50;
  background:var(--areia);color:#1B1B17;padding:10px 16px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="topo">
    <h1>SEMEF Manaus<small>AFTM Manaus 2026 · FCC · prova 01/11</small></h1>
    <div class="placar" id="placar"><b>0</b>/0 dominados<br>0 para revisar hoje</div>
  </div>
  <div class="filtros">
    <select id="fMateria"><option selected="">TODAS</option><option>IPTU</option></select>
    <select id="fTema"><option selected="">TODOS</option></select>
    <button class="chip" id="cDevidas">Só as devidas</button>
    <button class="chip" id="cErradas">Só as erradas</button>
  </div>
</header>

<main id="tela"></main>

<nav>
  <button data-aba="juris" class="on"><span class="ic">⚖</span>Juris</button>
  <button data-aba="questoes" class=""><span class="ic">✎</span>Questões</button>
  <button data-aba="add"><span class="ic">＋</span>Adicionar</button>
  <button data-aba="ajustes" class=""><span class="ic">⚙</span>Ajustes</button>
</nav>

<div class="toast" id="toast">App gerado com sucesso!</div>

      "correta": 2,
      "fundamento": "a) ERRADA. Habitação econômica é definida por pontuação (até 36 pontos) e áreas máximas (terreno até 250 m² e construção até 70 m²), não por valor de mercado em reais. b) ERRADA. O reconhecimento é do órgão municipal, não federal, e o prazo, na redação vigente dada pela\nLei nº 2564/2019, é de dez anos. Lembre-se que a questão cobra conforme a lei, e que o decreto se encontra desatualizado. c) CERTA. Ficam isentos os imóveis pertencentes aos portadores de doenças crônicas terminais. d) ERRADA. O benefício alcança os contemplados em programas sociais, proprietários ou não, sem exigência de ausência de rendimentos. e) ERRADA. Não existe isenção baseada em idade do proprietário.\nArt. 42. Ficam isentos do IPTU, pelo prazo de dez anos, os imóveis de interesse histórico ou cultural, assim reconhecidos pelo órgão municipal competente, que tenham suas fachadas e coberturas restauradas em suas características arquitetônicas originais.\nArt. 43. Ficam isentos do IPTU os imóveis pertencentes aos portadores de doenças crônicas terminais.\nParágrafo único - A isenção aplica-se também aos portadores de necessidades especiais, proprietários ou não, que estejam contemplados nos programas sociais dos governos federal, estadual e/ou municipal.\nArt. 44. É isento do IPTU o imóvel qualificado como habitação econômica.\nParágrafo único - Considera-se habitação econômica o imóvel construído, de uso residencial ou misto, com tipo de construção precária, edificada em área de vulnerabilidade social, cuja soma de pontos seja igual ou inferior a 36 (trinta e seis), na forma do anexo V, com área de terreno igual ou inferior a 250 m² e área construída igual ou inferior a 70 m².\nResposta: Letra C"
    },

      "id": "q-iptu-l03",
      "materia": "IPTU",
      "origem": "FCC - 2019 - Prefeitura de Manaus - Auditor Fiscal de Tributos Municipais",
      "enunciado": "A Lei municipal nº 1.628, de 30 de dezembro de 2011, do Município de Manaus, estabelece que o lançamento do IPTU será efetuado para cada imóvel, com base nas informações existentes no Cadastro Imobiliário\nMunicipal, o qual poderá vir a ser impugnado. De acordo com a referida Lei,\nI. A impugnação poderá ser feita pelo contribuinte, pelo responsável solidário ou por representante legal.\nII. A impugnação deverá ser feita no prazo máximo de 15 dias, contado da data do vencimento da terceira e última parcela.\nIII. A impugnação exclui a exigibilidade do crédito tributário até a decisão definitiva na esfera administrativa.\nIV. No caso de pagamento realizado antes da decisão administrativa da impugnação apresentada, a quantia recolhida será aproveitada para a quitação definitiva do débito, de acordo com o julgamento de procedência, improcedência ou de procedência parcial da impugnação.\nEstá correto o que se afirma APENAS em",
      "alts": [
        "I, II e IV.",

        "III.",

        "I, II e III."

      "fundamento": "I. CERTA. Podem impugnar o contribuinte, o responsável solidário ou o representante legal.\nII. ERRADA. O prazo vai até o vencimento da cota única ou da primeira parcela, e não 15 dias da última.\nIII. ERRADA. A impugnação tempestiva suspende a exigibilidade, não a exclui.\nIV. CERTA. O pagamento anterior à decisão é aproveitado para a quitação definitiva, conforme o desfecho do julgamento.\nArt. 26. O lançamento será efetuado com base nas características do imóvel, existentes no Cadastro\nImobiliário Municipal na data da ocorrência do Fato Gerador, e poderá ser impugnado pelo sujeito passivo, seja contribuinte, responsável solidário ou representante legal, até a data do vencimento da cota única ou da primeira parcela, observadas as demais disposições regulamentares.\n§ 1º A impugnação tempestiva suspende a exigibilidade do crédito tributário até a decisão definitiva na esfera administrativa.\n§ 2º No caso de pagamento realizado antes da decisão administrativa, a quantia recolhida será aproveitada para a quitação definitiva do débito, observado o disposto nos incisos I a III do art. 30.\nResposta: Letra D"

      "enunciado": "As autoridades fiscais municipais, em visita a três imóveis localizados na zona urbana do Município, depararam com as seguintes situações: (1) no primeiro imóvel, encontraram um terreno limpo, no qual havia apenas um contêiner que abrigava, temporariamente, uma família de refugiados estrangeiros; (2) no segundo imóvel, encontraram apenas edificações condenadas, em razão de abalos sísmicos ocorridos na região; (3) no terceiro imóvel, encontraram terreno baldio, habitado por famílias nômades, vivendo em tendas há pouco mais de duas semanas.\nDe acordo com a Lei municipal nº 1.628, de 30 de dezembro de 2011, que dispõe sobre IPTU no Município de\nManaus,",

        "todos os três bens imóveis são considerados edificados, para fins de tributação do IPTU.",

      "enunciado": "De acordo com a Lei municipal nº 1.628, de 30 de dezembro de 2011, que instituiu o IPTU no Município de\nManaus,",

      ],
      "correta": 3,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A incidência é proporcional à área situada no Município, sem regra de parte mais valorizada. b) ERRADA. O fato gerador ocorre em 1º de janeiro, dia do calendário, útil ou não. c) ERRADA. Não há regra de maior parte da área; vale a proporcionalidade. d) CERTA. O domínio útil integra a tríade da hipótese de incidência, ao lado da propriedade e da posse. e) ERRADA. Também não existe regra de maior parte da edificação.\nArt. 1º O Imposto sobre a Propriedade Predial e Territorial Urbana - IPTU tem como hipótese de incidência a propriedade, o domínio útil ou a posse de bem imóvel, localizado na zona urbana do município.\nArt. 2º Na hipótese de o imóvel situar-se apenas parcialmente no território do Município, o imposto incide proporcionalmente sobre a área nele situada.\nArt. 3º Considera-se ocorrido o fato gerador em 1º de janeiro de cada exercício.\nResposta: Letra D"

      "id": "q-iptu-l07",

      "origem": "FCC - 2025 - DPE SP - Analista de Defensoria Pública",
      "enunciado": "João mora num mesmo imóvel alugado há 20 anos e, além do aluguel, sempre se responsabilizou pelo pagamento do Imposto Predial e Territorial Urbano (IPTU). Há muito tempo não tem contato com o proprietário do imóvel, que mora no exterior. No corrente ano, contudo, foi surpreendido por um aumento significativo e desproporcional no valor do IPTU, que deseja contestar. Considerando, sobre o tema, o entendimento expresso do Superior Tribunal de Justiça (STJ),",
      "alts": [

      "origem": "FCC - 2024 - Prefeitura de Jaboatão dos Guararapes - Auditor - Adaptada",
      "enunciado": "A Lei nº 1628/2011 permite que o arbitramento do valor venal seja feito tanto no caso de o",

      "enunciado": "Maria é proprietária de uma casa em Manaus. Admitindo-se que movimentos tectônicos na região do imóvel viessem a abrir fendas no solo e provocar rachaduras, com sensível e notória perda de valor dos imóveis da região, Maria, com base na Lei nº 1628/2011,",

        "está registrado em cartório de imóveis em nome do requerente há pelo menos dez anos.",
        "é o único imóvel do requerente e de todos os seus familiares, ainda que situados em outros municípios.",
        "tem valor de mercado inferior a limite fixado anualmente em reais pelo Poder Executivo.",
        "foi construído há mais de vinte anos e nunca sofreu ampliação.",
        "é de uso residencial ou misto, com tipo de construção precária, em área de vulnerabilidade social, com soma de pontos igual ou inferior a 36, área de terreno de até 250 m² e área construída de até 70 m²."
      ],
      "correta": 4,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A habitação econômica se define pela precariedade da construção e pelos limites objetivos de pontos e áreas, sem qualquer exigência de titulação registral ou tempo de registro. b) ERRADA. O critério de único imóvel em todos os municípios não integra a definição. c) ERRADA. Não há critério de valor de mercado em reais. d) ERRADA. O rol do parágrafo único é fechado: pontuação de até 36 pontos, terreno de até 250 m² e construção de até 70 m² em área de vulnerabilidade social; a idade da obra não integra a definição. e) CERTA. A definição legal soma cinco elementos: (1) uso residencial ou misto; (2) construção precária; (3)\nárea de vulnerabilidade social; (4) até 36 pontos na tabela do anexo; (5) terreno de até 250 m² e construção de até 70 m².\nArt. 44. É isento do IPTU o imóvel qualificado como habitação econômica.\nParágrafo único - Considera-se habitação econômica o imóvel construído, de uso residencial ou misto, com tipo de construção precária, edificada em área de vulnerabilidade social, cuja soma de pontos seja igual ou inferior a 36 (trinta e seis), na forma do anexo V, com área de terreno igual ou inferior a 250 m² e área construída igual ou inferior a 70 m².\nResposta: Letra E"
    },
    {
      "id": "q-iptu-l13",
      "materia": "IPTU",
      "origem": "FCC - 2024 - Prefeitura de Jaboatão dos Guararapes - Auditor Fiscal - Adaptada",
      "enunciado": "Aristeu recebeu a notificação de lançamento do IPTU do seu imóvel em Manaus e discorda do valor, por entender que os dados cadastrais registram área construída maior que a real, inflando o imposto. Conforme a\nLei nº 1628/2011, o fundamento adequado do pedido de revisão de Aristeu é",
      "alts": [
        "a nulidade do lançamento, por ilegitimidade passiva.",
        "o vício formal, por descumprimento de matéria de direito.",
        "a inconstitucionalidade da Planta Genérica de Valores.",
        "a irregularidade quanto à matéria de fato, relativa a dados cadastrais, com valor lançado maior que o imposto devido.",
        "a decadência do direito de lançar."
      ],
      "correta": 3,
      "fundamento": "Analisando cada alternativa: a) ERRADA. Ilegitimidade passiva diria respeito a lançamento contra quem não é sujeito passivo; Aristeu é o contribuinte correto e discute apenas o dado cadastral. b) ERRADA. Vício formal é o descumprimento de regra de direito no procedimento; aqui o problema é fático, o registro errado da área construída. c) ERRADA. O rol legal de fundamentos do pedido de revisão não contempla o controle de constitucionalidade, reservado a outras vias. d) CERTA. O caso é o típico fundamento de matéria de fato: dado cadastral divergente da realidade que elevou o imposto. Nesse fundamento, o impugnante deve inclusive submeter-se a eventual visita ao imóvel para aferição dos dados. e) ERRADA. Não há alegação de prazo extinto; a decadência pode ser fundamento para pedido de revisão, mas no caso concreto a alegação é de desconformidade do cadastro, e não lançamento de período decadente.\nArt. 27. O pedido de revisão referido no art. 26 dar-se-á quando o requerente entender que o lançamento:\nI - é nulo, por ilegitimidade ativa ou passiva;\nII - incidiu em vício formal, por descumprimento em matéria de direito established na legislação tributária vigente;\nIII - está irregular quanto à matéria de fato, relativo a dados cadastrais, com valor lançado maior que o imposto devido.\nArt. 29. Para as impugnações fundadas no disposto no inciso III do artigo 27, o defendente deverá submeter- se a eventual visita ao imóvel, visando à aferição dos dados informados.\nResposta: Letra D"
    },
    {
      "id": "q-iptu-l14",
      "materia": "IPTU",
      "origem": "FCC - 2022 - Prefeitura de Teresina - Fiscal de Serviços Públicos - Adaptada",
      "enunciado": "De acordo com a Lei nº 1628/2011, do Município de Manaus,",
      "alts": [
        "constitui fato gerador do IPTU a posse de todo e qualquer bem imóvel localizado no território do Município, ainda que fora da zona urbana.",
        "a conclusão de reforma ou aumento no imóvel durante o exercício produz efeitos no lançamento do próprio exercício em que ocorreu.",
        "considera-se edificado o imóvel com edificação em andamento ou cuja obra esteja paralisada, desde que mais de 75% da edificação esteja concluída.",
        "o IPTU incide tanto sobre imóveis edificados, como sobre imóveis não edificados.",
        "fica dispensada a inscrição cadastral do imóvel com área construída inferior a 30 m2."
      ],
      "correta": 3,
      "fundamento": "a) ERRADA. A hipótese de incidência exige localização na zona urbana. b) ERRADA. Modificações físicas do exercício só produzem efeito no lançamento a partir do exercício seguinte. c) ERRADA. Obra em andamento ou paralisada é hipótese de imóvel não edificado, sem percentual de conclusão. d) CERTA. O imposto alcança a propriedade predial e a territorial: incide sobre o edificado e o não edificado. e) ERRADA. Todos os imóveis urbanos se sujeitam à inscrição, inclusive isentos e imunes; a metragem só aparece como critério na isenção da habitação econômica, e mesmo ali sem dispensar o cadastro.\nArt. 1º O Imposto sobre a Propriedade Predial e Territorial Urbana - IPTU tem como hipótese de incidência a propriedade, o domínio útil ou a posse de bem imóvel, localizado na zona urbana do município.\nArt. 6º A base de cálculo do imposto é o valor venal do imóvel edificado ou não edificado, determinada anualmente, conforme Planta Genérica de Valores contida nos anexos I e II, a ser atualizada periodicamente com base nos procedimentos de cálculo listados no anexo IV desta Lei.\n§ 2º Considera-se não edificado o bem imóvel:\nI - em que houver construção paralisada ou em andamento;\nArt. 13. Os imóveis localizados na zona urbana e de transição urbana de Manaus, ainda que isentos ou imunes ao IPTU, ficam sujeitos à inscrição no cadastro imobiliário municipal da Secretaria Municipal de\nFinanças, Planejamento e Tecnologia da Informação - SEMEF.\nResposta: Letra D"
    },
    {
      "id": "q-iptu-l15",
      "materia": "IPTU",
      "origem": "FCC - 2022 - Prefeitura de Teresina - Procurador - Adaptada",
      "enunciado": "De acordo com a Lei nº 1628/2011, do Município de Manaus, o lançamento do IPTU deve ser efetuado",
      "alts": [
        "somente em nome do legítimo proprietário registral do imóvel, vedado o lançamento em nome de possuidor.",
        "em nome do contribuinte constante no Cadastro Imobiliário Municipal e, quando o loteamento não estiver regularizado, em nome do detentor da posse direta da unidade imobiliária.",
        "em nome do Município, na hipótese de não se saber quem é o proprietário do imóvel.",
        "em nome de qualquer pessoa que resida no imóvel na data do fato gerador.",
        "exclusivamente em lotes cujo projeto de loteamento tenha sido aprovado e registrado em cartório."
      ],
      "correta": 1,
      "fundamento": "a) ERRADA. A tríade inclui o possuidor a qualquer título, e o lançamento pode recair sobre ele. b) CERTA. Lançamento em nome do contribuinte do Cadastro e, no loteamento irregular, em nome do detentor da posse direta. c) ERRADA. Quando o titular não é identified, a lei resolve pelo cadastro de ofício e, no loteamento irregular, pelo lançamento sobre o detentor da posse direta; jamais desloca a sujeição passiva para o próprio credor do tributo. d) ERRADA. A posse que qualifica contribuinte é a exercida com ânimo de dono; o mero morador (locatário, comodatário, hóspede) exerce posse precária e não integra a tríade legal, de modo que o lançamento não pode recair sobre qualquer residente. e) ERRADA. A lei admite lançamento em loteamentos irregulares.\nArt. 4º Contribuinte do Imposto é o proprietário do imóvel, o titular do seu domínio útil ou o seu possuidor a qualquer título.\nArt. 18. O lançamento do IPTU será feito de ofício, anualmente, por meio de ato normativo editado pelo chefe do Poder Executivo Municipal, levando-se em conta a situação da unidade imobiliária no exercício imediatamente anterior, e será efetuado no nome do contribuinte constante no Cadastro Imobiliário\nMunicipal, com base nos elementos cadastrais.\nArt. 21. Quando o loteamento não estiver regularizado, o lançamento será efetuado em nome do detentor da posse direta da unidade imobiliária.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l16",
      "materia": "IPTU",
      "origem": "FCC - 2018 - Prefeitura de São Luís - Auditor Fiscal de Tributos I - Adaptada",
      "enunciado": "Conforme a Lei nº 1628/2011, o IPTU, no Município de Manaus,",
      "alts": [
        "tem como fato gerador a posse, de domínio útil ou não, de bem localizado no município, construído ou não, ainda que fora da zona urbana.",
        "tem como contribuinte o proprietário, o possuidor do imóvel ou o detentor de contrato de opção de compra do imóvel, registrado ou não.",
        "incide sobre a propriedade de imóveis em edificações ambulantes, desde que regularizados no setor de patrimônio histórico municipal.",
        "tem fato gerador que se considera ocorrido em 1º de janeiro de cada exercício, e o crédito tributário constituído acompanha o imóvel, respondendo por ele o sucessor na propriedade, no domínio útil ou na posse.",
        "trata como prédio o imóvel edificado localizado na zona rural do município, desde que utilizado com finalidade lucrativa."
      ],
      "correta": 3,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A zona urbana é requisito essencial da hipótese de incidência. b) ERRADA. O detentor de opção de compra não integra a tríade de contribuintes. c) ERRADA. Edificação ambulante não é construção permanente destinada a uso, gozo ou habitação. d) CERTA. O fato gerador ocorre em 1º de janeiro e o sucessor responde pelo crédito constituído do imóvel. e) ERRADA. Imóvel rural está fora do campo de incidência do IPTU.\nArt. 1º O Imposto sobre a Propriedade Predial e Territorial Urbana - IPTU tem como hipótese de incidência a propriedade, o domínio útil ou a posse de bem imóvel, localizado na zona urbana do município.\nArt. 3º Considera-se ocorrido o fato gerador em 1º de janeiro de cada exercício.\nArt. 4º Contribuinte do Imposto é o proprietário do imóvel, o titular do seu domínio útil ou o seu possuidor a qualquer título.\nArt. 5º O sucessor responde pelo crédito tributário constituído quanto ao imóvel que suceda na propriedade, no domínio útil ou na posse.\nResposta: Letra D"
    },
    {
      "id": "q-iptu-l17",
      "materia": "IPTU",
      "origem": "FCC - 2018 - Prefeitura de São Luís - Auditor Fiscal de Tributos I - Adaptada",
      "enunciado": "A Lei nº 1628/2011 prevê que a base de cálculo do IPTU de Manaus",
      "alts": [
        "e todas as alterações que possam modificar seu cálculo sejam informadas ao contribuinte com 90 dias de antecedência do lançamento.",
        "seja atualizada pela variação da SELIC, ou por qualquer outro índice confiável, ainda que não oficial.",
        "seja atualizada trienalmente pelo Poder Legislativo, com base nas transações realizadas no mercado.",
        "referente à área remanescente, em caso de desapropriação parcial, seja calculada em valor que não exceda 75% do metro quadrado pago na desapropriação.",
        "seja o valor venal do imóvel, apurado anualmente com base na Planta Genérica de Valores contida nos anexos da própria Lei."
      ],
      "correta": 4,
      "fundamento": "a) ERRADA. A publicidade do lançamento se dá pela notificação coletiva nos meios de comunicação de massa, e as alterações da Planta Genérica seguem o processo legislativo próprio; a lei não condiciona o lançamento a aviso individual antecipado. b) ERRADA. Os valores têm correspondência em UFM, não em SELIC ou índice não oficial. c) ERRADA. A determinação é anual, sem periodicidade trienal legislativa. d) ERRADA. Não existe essa regra de desapropriação parcial. e) CERTA. A base de cálculo é o valor venal, determinado anualmente pela Planta Genérica de Valores dos anexos da Lei.\nArt. 6º A base de cálculo do imposto é o valor venal do imóvel edificado ou não edificado, determinada anualmente, conforme Planta Genérica de Valores contida nos anexos I e II, a ser atualizada periodicamente com base nos procedimentos de cálculo listados no anexo IV desta Lei.\nArt. 9º Todos os valores fixados na Planta Genérica de Valores Imobiliários terão sua correspondência em unidade fiscal do município - UFM.\nArt. 19. O contribuinte será notificado do lançamento e das datas de vencimento do IPTU pela veiculação dessa matéria nos meios de comunicação de massa, independentemente do recebimento, por via postal, das guias de recolhimento desse tributo.\nResposta: Letra E"
    },
    {
      "id": "q-iptu-l18",
      "materia": "IPTU",
      "origem": "FCC - 2018 - Prefeitura de São Luís - Auditor Fiscal de Tributos I - Adaptada",
      "enunciado": "A Lei nº 1628/2011 determina que o IPTU, no Município de Manaus, seja lançado em nome do",
      "alts": [
        "contribuinte constante no Cadastro Imobiliário Municipal, com base nos elementos cadastrais.",
        "espólio, em qualquer hipótese de imóvel cujo proprietário tenha falecido, mesmo após a partilha.",
        "condômino máster, na hipótese de condomínio constituído de unidades autônomas pertencentes a diversas pessoas.",
        "Município, na hipótese de não se saber quem é o proprietário do imóvel.",
        "promissário comprador, no caso de lote resultante de loteamento rejeitado pela legislação urbanística."
      ],
      "correta": 0,
      "fundamento": "a) CERTA. O lançamento é feito no nome do contribuinte constante no Cadastro Imobiliário Municipal, com base nos elementos cadastrais. b) ERRADA. Após a partilha, os sucessores respondem como novos titulares. c) ERRADA. Cada unidade autônoma é lançada em nome do próprio condômino, sem condômino principal. d) ERRADA. Não existe lançamento em nome do Município. e) ERRADA. No loteamento irregular, o lançamento recai sobre o detentor da posse direta.\nArt. 5º O sucessor responde pelo crédito tributário constituído quanto ao imóvel que suceda na propriedade, no domínio útil ou na posse.\nArt. 18. O lançamento do IPTU será feito de ofício, anualmente, por meio de ato normativo editado pelo chefe do Poder Executivo Municipal, levando-se em conta a situação da unidade imobiliária no exercício imediatamente anterior, e será efetuado no nome do contribuinte constante no Cadastro Imobiliário\nMunicipal, com base nos elementos cadastrais.\nArt. 21. Quando o loteamento não estiver regularizado, o lançamento será efetuado em nome do detentor da posse direta da unidade imobiliária.\nArt. 25. Na hipótese de condomínio, o lançamento será realizado, observados os seguintes critérios:\nI - para condomínios em edificação: a) as unidades autônomas, em nome de cada condômino, titular de domínio útil ou possuidor;\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l19",
      "materia": "IPTU",
      "origem": "FCC - 2016 - Prefeitura de Teresina - Auditor Fiscal da Receita Municipal - Adaptada",
      "enunciado": "Fernando, residente em Brasília/DF, é possuidor, a título de dono, de um terreno localizado na zona urbana do\nMunicípio de Manaus, com área de seiscentos metros quadrados, sem uso e não edificado. Considerando o disposto na Lei nº 1628/2011, em relação a esse terreno, Fernando é",
      "alts": [
        "contribuinte do IPTU, pois a posse de bem imóvel na zona urbana integra a hipótese de incidência do imposto.",
        "mero responsável tributário, pois somente o proprietário registral pode ser contribuinte do IPTU.",
        "isento do IPTU, por não residir no Município de Manaus.",
        "imune ao IPTU, por se tratar de terreno sem uso e não edificado.",
        "devedor apenas de taxa de ocupação, e não de IPTU."
      ],
      "correta": 0,
      "fundamento": "Analisando cada alternativa: a) CERTA. A posse a título de dono sobre imóvel na zona urbana faz de Fernando contribuinte, pois a tríade legal inclui o possuidor a qualquer título. b) ERRADA. O registro não é condição para ser contribuinte; o possuidor integra a tríade. c) ERRADA. As isenções da lei formam rol taxativo (RPPN, residencial de pequeno valor, interesse histórico, doenças crônicas terminais, necessidades especiais e habitação econômica) e nenhuma toma a residência do titular como critério: a sujeição decorre da relação com o imóvel, onde quer que o contribuinte more. d) ERRADA. Imunidade é matéria constitucional (entes públicos, templos, partidos, sindicatos de trabalhadores, instituições de educação e assistência) e não contempla terrenos vazios; para a lei de Manaus, o terreno sem construção é a hipótese típica de imóvel não edificado, alcançado pela propriedade territorial urbana. e) ERRADA. Taxa de ocupação pressupõe uso de bem público; aqui o terreno é particular e a posse com\nânimo de dono realiza a hipótese de incidência do IPTU, afastando qualquer figura substitutiva.\nArt. 4º Contribuinte do Imposto é o proprietário do imóvel, o titular do seu domínio útil ou o seu possuidor a qualquer título.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l20",
      "materia": "IPTU",
      "origem": "FCC - 2016 - Prefeitura de Teresina - Auditor Fiscal da Receita Municipal - Adaptada",
      "enunciado": "Um imóvel urbano situado em área incluída no plano diretor de Manaus encontra-se não edificado e sem qualquer aproveitamento. Nos termos da Constituição Federal, para exigir do proprietário o adequado aproveitamento do solo, o Poder Público municipal deverá observar a seguinte ordem sucessiva de medidas:",
      "alts": [
        "IPTU progressivo no tempo; parcelamento ou edificação compulsórios; desapropriação com pagamento em títulos da dívida pública.",
        "parcelamento ou edificação compulsórios; IPTU progressivo no tempo; desapropriação com pagamento em títulos da dívida pública.",
        "desapropriação com pagamento em dinheiro; IPTU progressivo no tempo; parcelamento compulsório.",
        "IPTU progressivo em razão do valor venal; parcelamento compulsório; desapropriação com pagamento em títulos.",
        "notificação para edificar; desapropriação com pagamento em títulos; IPTU progressivo no tempo."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. Inverte a ordem: a progressividade no tempo é a segunda etapa, nunca a primeira. b) CERTA. A ordem constitucional é sucessiva e vinculada: primeiro o parcelamento ou edificação compulsórios; persistindo a inércia, o IPTU progressivo no tempo; por fim, a desapropriação paga em títulos da dívida pública aprovados pelo Senado. c) ERRADA. A desapropriação-sanção é a última medida e o pagamento é em títulos da dívida pública, não em dinheiro. d) ERRADA. Confunde as duas progressividades: a do valor venal (EC 29/2000) é fiscal e não integra o ritual da função social. e) ERRADA. Não existe a etapa autônoma de simples notificação, e a desapropriação jamais precede a progressividade.\nCF, art. 156, § 1º Sem prejuízo da progressividade no tempo a que se refere o art. 182, § 4º, inciso II, o imposto previsto no inciso I poderá:\nI - ser progressivo em razão do valor do imóvel; e\nCF, art. 182, § 4º É facultado ao Poder Público municipal, mediante lei específica para área incluída no plano diretor, exigir, nos termos da lei federal, do proprietário do solo urbano não edificado, subutilizado ou não utilizado, que promova seu adequado aproveitamento, sob pena, sucessivamente, de:\nI - parcelamento ou edificação compulsórios;\nII - imposto sobre a propriedade predial e territorial urbana progressivo no tempo;\nIII - desapropriação com pagamento mediante títulos da dívida pública de emissão previamente aprovada pelo Senado Federal, com prazo de resgate de até dez anos, em parcelas anuais, iguais e sucessivas, assegurados o valor real da indenização e os juros legais.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l21",
      "materia": "IPTU",
      "origem": "FCC - 2016 - Prefeitura de Teresina - Auditor Fiscal da Receita Municipal - Adaptada",
      "enunciado": "Aurelino, proprietário de galpão localizado na zona urbana de Manaus, deseja saber como será apurado o valor venal do seu imóvel para fins de IPTU. Conforme a Lei nº 1628/2011, o valor venal",
      "alts": [
        "será declarado anualmente pelo próprio contribuinte, prevalecendo sobre os valores oficiais.",
        "corresponderá ao preço efetivamente pago por Aurelino na aquisição do galpão, corrigido pela inflação.",
        "será determinado anualmente conforme a Planta Genérica de Valores dos anexos da Lei, com correspondência em UFM, combinando o valor do metro quadrado da construção e do terreno.",

        "equivalerá ao valor de mercado apurado por corretor credenciado, à custa do contribuinte."
      ],
      "correta": 2,
      "fundamento": "Analisando cada alternativa: a) ERRADA. O lançamento do IPTU é de ofício e a base decorre da Planta Genérica; declaração do contribuinte não substitui a avaliação oficial e, se inidônea, autoriza até arbitramento. b) ERRADA. O preço histórico de aquisição não é base de cálculo: o valor venal é redeterminado pelos critérios objetivos da Planta. c) CERTA. A base é o valor venal apurado anualmente pela Planta Genérica de Valores (anexos da própria lei), expresso em UFM, somando os componentes da edificação e do terreno segundo os fatores legais. d) ERRADA. Não há avaliação judicial nem ciclo quinquenal: a determinação é administrativa e anual. e) ERRADA. A lei não terceiriza a avaliação a corretores; os critérios são os da Planta Genérica, aplicados pela administração.\nArt. 6º A base de cálculo do imposto é o valor venal do imóvel edificado ou não edificado, determinada anualmente, conforme Planta Genérica de Valores contida nos anexos I e II, a ser atualizada periodicamente com base nos procedimentos de cálculo listados no anexo IV desta Lei.\nArt. 9º Todos os valores fixados na Planta Genérica de Valores Imobiliários terão sua correspondência em unidade fiscal do município - UFM.\nArt. 10. Aplicar-se-á o critério de arbitramento para fixação do valor venal de imóveis edificados quando:\nIII - houver omissão quanto às informações que possibilitem apurar a base de cálculo, ou não mereçam fé as declarações, esclarecimentos e documentos fornecidos pelo sujeito passivo.\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l22",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "De acordo com a Lei nº 1628/2011, considera-se gleba, para fim exclusivo de aplicação do fator de correção de terrenos, o imóvel",
