<!DOCTYPE html>
<html lang="pt-BR" style="--font-size-base: 15px;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SEMEF Manaus 2026</title>
<style>
:root{
  --bg-primary: #0F172A;
  --bg-surface: #1E293B;
  --bg-elevated: #334155;
  --border-subtle: #334155;
  --border-strong: #475569;
  
  --accent: #3B82F6;
  --accent-soft: rgba(59, 130, 246, 0.15);
  --accent-hover: #2563EB;
  --ouro: #F59E0B;
  --ouro-soft: rgba(245, 158, 11, 0.12);
  
  --certo: #10B981;
  --errado: #EF4444;
  
  --texto-primary: #F8FAFC;
  --texto-secondary: #94A3B8;
  --texto-muted: #64748B;
  
  --r: 12px;
  --font-size-base: 16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg-primary);
  color:var(--texto-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
  font-size:var(--font-size-base);line-height:1.45;
  padding-bottom:86px;
  overscroll-behavior-y:contain;
}
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg-surface) 85%,rgba(30,41,59,.9));
  border-bottom:1px solid var(--border-subtle);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;
}
.topo{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:15px;margin:0;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--texto-primary)}
h1 small{display:block;letter-spacing:.03em;text-transform:none;font-weight:400;font-size:11px;color:var(--texto-secondary);margin-top:2px}
.placar{font-variant-numeric:tabular-nums;font-size:12px;color:var(--texto-secondary);text-align:right;white-space:nowrap}
.placar b{color:var(--accent);font-size:15px}
.filtros{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
select,input,textarea,button{font-family:inherit;font-size:calc(var(--font-size-base) - 2px)}
select,input,textarea{
  background:var(--bg-elevated);color:var(--texto-primary);border:1px solid var(--border-strong);
  border-radius:8px;padding:8px 10px;width:100%;
}
textarea{min-height:78px;resize:vertical;line-height:1.4}
.filtros select{flex:1;min-width:120px}
.chip{
  border:1px solid var(--border-strong);background:transparent;color:var(--texto-secondary);
  border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s ease
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#ffffff;font-weight:700}
.chip.erradas-on{background:var(--errado);border-color:var(--errado);color:#ffffff;font-weight:700}

main{
  padding:12px 14px;
  width:100%;
  max-width:100%;
  margin:0;
}
@media (min-width: 768px) {
  main { padding: 16px 20px; }
  .questao-container { padding: 22px 24px; }
}

.vazio{border:1px dashed var(--border-strong);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--texto-secondary);font-size:14px}
.vazio b{color:var(--texto-primary);display:block;margin-bottom:6px;font-size:15px}

.acoes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.btn{
  border:1px solid var(--border-strong);background:var(--bg-surface);color:var(--texto-primary);
  border-radius:8px;padding:12px 8px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;
  transition:background .15s ease;
}
.btn:active{transform:translateY(1px)}
.btn.err{border-color:rgba(239,68,68,0.4);color:#FCA5A5;background:rgba(239,68,68,0.1)}
.btn.meio{border-color:rgba(245,158,11,0.4);color:#FCD34D;background:rgba(245,158,11,0.1)}
.btn.ok{border-color:rgba(16,185,129,0.4);color:#6EE7B7;background:rgba(16,185,129,0.1)}
.btn.cheio{background:var(--accent);border-color:var(--accent);color:#ffffff}
.btn.cheio:hover{background:var(--accent-hover)}
.btn.linha{width:100%;margin-top:8px}

.questao-container{
  background:#ffffff;
  border-radius:10px;
  padding:20px 16px;
  color:#1e293b;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
  width:100%;
  touch-action: pan-y;
}
.tec-stats-container{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid #e2e8f0;
}
.tec-stats{font-size:14px;color:#334155}
.tec-stats b{font-weight:700}
.tec-stats .st-res{color:#475569}
.tec-stats .st-ok{color:#10b981;font-weight:700}
.tec-stats .st-err{color:#ef4444;font-weight:700}

.btn-restaurar-todas{
  background:#fee2e2;border:1px solid #fca5a5;color:#b91c1c;
  border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;
}
.btn-restaurar-todas:hover{background:#ef4444;color:#fff}

.enunciado{background:transparent;border:none;padding:0;margin-bottom:20px}
.enunciado .eyebrow{font-size:12px;color:#64748b;margin-bottom:10px;font-weight:600}
.enunciado .txt{
  font-size:var(--font-size-base);line-height:1.65;white-space:pre-line;text-align:justify;color:#0f172a
}

.alts{margin:16px 0;display:flex;flex-direction:column;gap:10px}
.alt{
  display:flex;gap:14px;text-align:left;align-items:flex-start;background:#f8fafc;
  border:1px solid #cbd5e1;color:#1e293b;border-radius:8px;padding:14px 16px;cursor:pointer;
  font-size:var(--font-size-base);line-height:1.55;width:100%;position:relative;
  transition:all .15s ease;-webkit-user-select:none;user-select:none;
}
.alt .letra{
  font-weight:600;color:#475569;min-width:30px;height:30px;display:flex;align-items:center;
  justify-content:center;border:1px solid #cbd5e1;border-radius:50%;flex-shrink:0;font-size:13px;background:#fff
}
.alt .texto-alt{flex:1;white-space:pre-line;text-align:justify}

.alt.riscada{background:#f1f5f9!important;border-color:#e2e8f0!important}
.alt.riscada .texto-alt{text-decoration:line-through;opacity:0.35;color:#94a3b8}
.alt.riscada .letra{opacity:0.3;background:#e2e8f0}

.alt.selecionada{border-color:#3b82f6;background:#eff6ff}
.alt.selecionada .letra{color:#1d4ed8;border-color:#3b82f6;background:#dbeafe}
.alt.certa{border-color:#10b981!important;background:#ecfdf5!important}
.alt.certa .letra{color:#047857!important;border-color:#10b981!important;background:#d1fae5!important}
.alt.errada{border-color:#ef4444!important;background:#fef2f2!important}
.alt.errada .letra{color:#b91c1c!important;border-color:#ef4444!important;background:#fee2e2!important}

.gab{
  margin-top:18px;border-left:4px solid #10b981;padding:16px;background:#f0fdf4;
  border-radius:0 8px 8px 0;font-size:calc(var(--font-size-base) - 1px);line-height:1.65;color:#166534;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.gab b{color:#15803d;font-size:calc(var(--font-size-base) + 1px);display:block;margin-bottom:8px}

.controles-questao{
  display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 20px;
  padding:8px 12px;background:#f1f5f9;border-radius:8px;
}
.controle-fonte{display:flex;gap:6px;align-items:center}
.btn-fonte{
  background:#fff;border:1px solid #cbd5e1;color:#334155;border-radius:6px;padding:4px 8px;cursor:pointer;
  font-size:12px;font-weight:600;min-width:28px
}
.info-questao{font-size:12px;color:#64748b;white-space:nowrap}

.btn-resolver{
  width:100%;padding:14px 16px;background:#2563eb;border:none;color:#fff;
  border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;
  box-shadow:0 2px 4px rgba(0,0,0,.1);display:block;text-align:center;margin-top:12px;
}
.btn-resolver:active{opacity:0.9}

.linha-refazer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.btn-refazer-circulo{
  width:36px;height:36px;background:#f1f5f9;border:1px solid #cbd5e1;color:#475569;
  border-radius:50%;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;
}

.juris-card{
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r);
  padding:20px 18px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);cursor:pointer;position:relative;
}
.juris-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.juris-tag{background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;text-transform:uppercase}
.juris-meta{font-size:12px;color:var(--texto-secondary);font-weight:500}
.juris-pergunta{font-size:16px;line-height:1.6;color:var(--texto-primary);font-weight:500;text-align:justify}
.juris-resposta{margin-top:16px;padding-top:16px;border-top:1px dashed var(--border-strong);animation:fadeInJuris 0.2s ease-in-out}
.juris-tese-box{
  background:rgba(16,185,129,0.12);border-left:4px solid var(--certo);border-radius:0 8px 8px 0;
  padding:12px 14px;color:#6ee7b7;font-size:14.5px;line-height:1.5;font-weight:600;margin-bottom:12px;
}
.juris-obs-box{
  background:var(--ouro-soft);border:1px solid rgba(245,158,11,0.25);border-radius:8px;padding:11px 13px;color:#fde68a;font-size:13px;line-height:1.5;
}
.juris-obs-box b{color:var(--ouro)}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r);padding:14px;text-align:center}
.stat-card h3{margin:0;font-size:24px;font-weight:700;color:var(--texto-primary)}
.stat-card p{margin:4px 0 0;font-size:12px;color:var(--texto-secondary)}
.prog-bar-container{background:var(--bg-elevated);border-radius:99px;height:8px;overflow:hidden;margin-top:6px}
.prog-bar{height:100%;background:var(--accent);transition:width .3s ease}

.sim-grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-bottom:14px}
.sim-nav-btn{background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--texto-secondary);border-radius:6px;height:36px;font-weight:600;cursor:pointer}
.sim-nav-btn.respondida{background:var(--bg-elevated);color:var(--texto-primary);border-color:var(--accent)}
.sim-nav-btn.atual{border:2px solid var(--accent);color:#fff;background:var(--accent-soft)}

.item{border:1px solid var(--border-subtle);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--bg-surface)}
.item h4{margin:0 0 6px;font-size:14.5px;color:var(--texto-primary)}
.item p{margin:0;font-size:13px;color:var(--texto-secondary)}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-secondary);margin:12px 0 5px;font-weight:600}
.aviso{font-size:13px;color:var(--texto-secondary);border:1px dashed var(--border-subtle);border-radius:10px;padding:12px;margin-top:14px}
hr{border:0;border-top:1px solid var(--border-subtle);margin:20px 0}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--bg-surface);border-top:1px solid var(--border-subtle);
  padding-bottom:env(safe-area-inset-bottom)
}
nav button{
  background:none;border:0;color:var(--texto-secondary);padding:10px 2px 10px;
  font-size:10px;letter-spacing:.02em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px
}
nav button .ic{font-size:17px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:50;
  background:#ffffff;color:#0f172a;padding:10px 18px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.on{opacity:1}

@keyframes fadeInJuris {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<header>
  <div class="topo">
    <h1>SEMEF Manaus<small>AFTM Manaus 2026 · FCC · prova 01/11</small></h1>
    <div class="placar" id="placar"><b>0</b>/0 dominados<br>0 para revisar hoje</div>
  </div>
  <div class="filtros" id="filtros-container">
    <select id="fMateria"><option selected="">TODAS</option></select>
    <select id="fTema"><option selected="">TODOS</option><option>Sem tema</option></select>
    <button class="chip" id="cDevidas">Não respondidas</button>
    <button class="chip" id="cErradas">Só as erradas</button>
  </div>
</header>

<main id="tela"></main>

<nav>
  <button data-aba="juris" class="on"><span class="ic">⚖</span>Juris</button>
  <button data-aba="questoes"><span class="ic">✎</span>Questões</button>
  <button data-aba="simulados"><span class="ic">⏱</span>Simulado</button>
  <button data-aba="stats"><span class="ic">📊</span>Stats</button>
  <button data-aba="add"><span class="ic">＋</span>Adicionar</button>
  <button data-aba="ajustes"><span class="ic">⚙</span>Ajustes</button>
</nav>

<div class="toast" id="toast">App pronto!</div>

<script id="script-dados">
// SEED inicial vazio: dados vêm do conteudo.json e simulados vêm de localStorage/Supabase
let SEED = {
  "juris": [],
  "questoes": [],
  "simulados": []
};
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY_PROG='semef2026_progresso_v1', KEY_USER='semef2026_meusitens_v1', KEY_FONT='semef2026_fontsize_v1';
const mem={};
const store={
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null }catch(e){ return mem[k]??null } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){ mem[k]=v } }
};

// ===== SINCRONIZAÇÃO NA NUVEM =====
const SUPABASE_URL = 'https://iyzojejpeueoqgapseuh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CoL8WD5Kj0Psqarh7ai28w_GUm6o0B4';
const AUTH_KEY  = 'semef2026_auth';
const APAGA_KEY = 'semef2026_apagamento_pendente';
const EMAIL_KEY = 'semef2026_email';

const memAuth = {};
const authStorage = {
  getItem   : k     => { try { return localStorage.getItem(k) } catch(e){ return memAuth[k] ?? null } },
  setItem   : (k,v) => { try { localStorage.setItem(k,v) }      catch(e){ memAuth[k] = v } },
  removeItem: k     => { try { localStorage.removeItem(k) }     catch(e){ delete memAuth[k] } }
};

let sb = null;
try {
  if (window.supabase && window.supabase.createClient && /^https?:\/\//.test(SUPABASE_URL)) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:false,
              storage:authStorage, storageKey:AUTH_KEY }
    });
  }
} catch(e) { console.warn('Supabase indisponível', e); }

let syncUser=null, syncTimer=null, sincronizando=false, syncPendente=false, epocaDados=0;
let forcarEnvio = store.get(APAGA_KEY) === true;
let syncMsg = sb ? 'aguardando…' : 'desligada (biblioteca não carregou)';

function setSync(t){
  syncMsg = t;
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = t;
}

function escolherProg(a,b){
  const ta=(a.acertos||0)+(a.erros||0), tb=(b.acertos||0)+(b.erros||0);
  if(ta!==tb) return ta>tb?a:b;
  const va=a.visto||'', vb=b.visto||'';
  if(va!==vb) return va>vb?a:b;
  return (a.prox||'')>=(b.prox||'')?a:b;
}

function mesclarProgresso(local,remoto){
  const out=Object.assign({},local||{});
  Object.entries(remoto||{}).forEach(([id,pr])=>{ out[id]=out[id]?escolherProg(out[id],pr):pr });
  return out;
}

function mesclarMeus(local, remoto){
  const localVal = local || {};
  const remotoVal = remoto || {};
  
  const excluidosLocal = Array.isArray(localVal.excluidos) ? localVal.excluidos : [];
  const excluidosRemoto = Array.isArray(remotoVal.excluidos) ? remotoVal.excluidos : [];
  const x = new Set([...excluidosLocal, ...excluidosRemoto]);
  
  const out = { juris: [], questoes: [], simulados: [], excluidos: [...x] };

  ['juris', 'questoes', 'simulados'].forEach(t => {
    const map = new Map();
    const itensLocal = Array.isArray(localVal[t]) ? localVal[t] : [];
    const itensRemoto = Array.isArray(remotoVal[t]) ? remotoVal[t] : [];

    // Prioriza o que está no aparelho local
    itensLocal.forEach(i => {
      if (i && i.id && !x.has(i.id)) map.set(i.id, i);
    });

    // Adiciona novidades remotas sem sobrescrever adições locais recentes
    itensRemoto.forEach(i => {
      if (i && i.id && !x.has(i.id) && !map.has(i.id)) map.set(i.id, i);
    });

    out[t] = [...map.values()];
  });

  return out;
}

async function usuarioAtual(silencioso){
  if(!sb) return null;
  if(syncUser) return syncUser;
  const { data } = await sb.auth.getSession();
  if(data && data.session && data.session.user){ syncUser=data.session.user; return syncUser }
  return silencioso ? null : await entrarNaConta();
}

async function entrarNaConta(){
  if(!sb){ toast('Supabase não configurado'); return null }
  const email=(prompt('E-mail da sincronização:', authStorage.getItem(EMAIL_KEY)||'')||'').trim();
  if(!email) return null;
  const senha=prompt('Senha (mínimo 6 caracteres):');
  if(!senha) return null;
  let { data, error } = await sb.auth.signInWithPassword({ email, password:senha });
  if(error){
    const semConta=/invalid login|not found|credentials/i.test(error.message||'');
    if(!semConta || !confirm('Não encontrei essa conta. Deseja criá-la agora?')){
      toast('Login falhou: '+error.message); setSync('não conectado'); return null;
    }
    const r=await sb.auth.signUp({ email, password:senha });
    if(r.error){ toast('Não deu para criar: '+r.error.message); return null }
    if(!r.data.session){ toast('Confirme o e-mail enviado e entre de novo'); return null }
    data=r.data;
  }
  authStorage.setItem(EMAIL_KEY,email);
  syncUser=data.user;
  toast('Conectado! Sincronizando...');
  return syncUser;
}

async function sairDaConta(){
  if(!sb) return;
  await sb.auth.signOut();
  syncUser=null; setSync('desconectado'); toast('Você saiu da conta'); render();
}

async function sincronizar(opcoes){
  const silencioso = !opcoes || opcoes.silencioso !== false;
  if(!sb){ if(!silencioso) toast('Supabase não configurado'); return false }
  if(sincronizando){ syncPendente=true; return false }
  if(!navigator.onLine){ setSync('offline — envia ao voltar'); syncPendente=true; return false }

  const user=await usuarioAtual(silencioso);
  if(!user){ setSync('não conectado — toque em “Entrar”'); return false }

  sincronizando=true; setSync(forcarEnvio ? 'aplicando na nuvem…' : 'sincronizando…');
  const ep = epocaDados;
  try{
    if(forcarEnvio){
      const up=await sb.from('app_state').upsert(
        { user_id:user.id, progresso, meus, updated_at:new Date().toISOString() },
        { onConflict:'user_id' });
      if(up.error) throw up.error;
      forcarEnvio=false;
      store.set(APAGA_KEY, false);
      setSync('nuvem atualizada · '+new Date().toLocaleTimeString().slice(0,5));
      if(!silencioso) toast('Nuvem atualizada!');
      return true;
    }
    const { data, error } = await sb.from('app_state')
      .select('progresso,meus,updated_at').eq('user_id',user.id).maybeSingle();
    if(error) throw error;
    if(ep !== epocaDados){ syncPendente = true; return false; }

    const remoto=data||{};
    const progAntes=JSON.stringify(progresso), meusAntes=JSON.stringify(meus);

    progresso = mesclarProgresso(progresso, remoto.progresso||{});
    meus      = mesclarMeus(meus, remoto.meus||{juris:[],questoes:[],simulados:[],excluidos:[]});
    ['juris','questoes','simulados'].forEach(t=>{ if(!Array.isArray(meus[t])) meus[t]=[] });
    if(!Array.isArray(meus.excluidos)) meus.excluidos=[];

    const mudouLocal = JSON.stringify(progresso)!==progAntes || JSON.stringify(meus)!==meusAntes;
    if(mudouLocal){ 
      store.set(KEY_PROG,progresso); 
      store.set(KEY_USER,meus); 
    }

    const precisaSubir = !data
      || JSON.stringify(remoto.progresso||{}) !== JSON.stringify(progresso)
      || JSON.stringify(remoto.meus||{})      !== JSON.stringify(meus);

    if(precisaSubir){
      const up=await sb.from('app_state').upsert(
        { user_id:user.id, progresso, meus, updated_at:new Date().toISOString() },
        { onConflict:'user_id' });
      if(up.error) throw up.error;
    }

    setSync('sincronizado · '+new Date().toLocaleTimeString().slice(0,5));
    if(mudouLocal) atualizarTelaAposSync();
    if(!silencioso) toast('Sincronizado!');
    return true;
  }catch(e){
    console.error('[sync]',e);
    setSync('erro: '+(e.message||'falha'));
    return false;
  }finally{
    sincronizando=false;
    if(syncPendente){ syncPendente=false; setTimeout(()=>sincronizar({silencioso:true}),1500) }
  }
}

function atualizarTelaAposSync(){
  try{ placar() }catch(e){}
  const ocupado = estado.revelado || estado.respondida!==null || estado.aba==='add';
  if(!ocupado) render();
}

async function sincronizarNuvem(){
  if(!sb){ toast('Supabase não configurado'); return }
  const user=await usuarioAtual(false);
  if(!user) return;
  await sincronizar({silencioso:false});
}

function marcarApagamento(){
  forcarEnvio = true;
  store.set(APAGA_KEY, true);
  epocaDados++;
  clearTimeout(syncTimer);
  sincronizando = false;
  syncPendente = false;
  setSync('apagamento pendente — enviando…');
  if(sb) sincronizar({silencioso:true});
}

function agendarSync(){
  if(!sb) return;
  clearTimeout(syncTimer);
  setSync('alterações pendentes…');
  syncTimer=setTimeout(()=>sincronizar({silencioso:true}),4000);
}

function iniciarSync(){
  if(!sb){ setSync('sincronização desligada'); return }
  if(forcarEnvio) setSync('apagamento pendente — enviando…');
  sb.auth.onAuthStateChange((_e,session)=>{ syncUser=(session&&session.user)||null });
  sincronizar({silencioso:true});
  setInterval(()=>{ if(document.visibilityState==='visible') sincronizar({silencioso:true}) },120000);
  document.addEventListener('visibilitychange',()=>sincronizar({silencioso:true}));
  window.addEventListener('online',()=>sincronizar({silencioso:true}));
  window.addEventListener('pagehide',()=>sincronizar({silencioso:true}));
}

let progresso = store.get(KEY_PROG) || {};
let meus = store.get(KEY_USER) || {juris:[],questoes:[],simulados:[]};
['juris','questoes','simulados'].forEach(t=>{ if(!Array.isArray(meus[t])) meus[t]=[] });
if(!Array.isArray(meus.excluidos)) meus.excluidos=[];
const fora=()=>new Set(meus.excluidos||[]);

const salvarProg=()=>{ store.set(KEY_PROG,progresso); agendarSync(); };
const salvarMeus=()=>{ store.set(KEY_USER,meus); agendarSync(); };
const hoje=()=>new Date().toISOString().slice(0,10);
const somaDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KEY_CONT='semef2026_conteudo_v1';
let fonteConteudo='carregando do servidor...';

function aplicarConteudo(d,fonte){
  if(!d) return false;
  SEED = { juris:d.juris||[], questoes:d.questoes||[], simulados:d.simulados||[] };
  fonteConteudo = fonte;
  const ocupado = estado.revelado || estado.respondida!==null || estado.aba==='add';
  if(!ocupado && document.getElementById('tela')) render();
  return true;
}

async function carregarConteudo(){
  const cache = store.get(KEY_CONT);
  if(cache && cache.dados) aplicarConteudo(cache.dados,'conteudo.json (cópia local)');
  if(location.protocol==='file:') return;
  try{
    const r = await fetch('./conteudo.json?v='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    if(!aplicarConteudo(d,'conteudo.json')) throw new Error('formato inválido');
    store.set(KEY_CONT,{dados:d, em:new Date().toISOString()});
  }catch(e){
    console.warn('[conteudo.json]', e.message);
    if(!cache) fonteConteudo='conteudo.json pendente / offline';
  }
}

function base(tipo){
  const map=new Map(), x=fora();
  (SEED[tipo]||[]).forEach(i=>{ if(i && i.id && !x.has(i.id)) map.set(i.id,i) });
  ((meus && meus[tipo])||[]).forEach(i=>{ if(i && i.id && !x.has(i.id)) map.set(i.id,i) });
  return [...map.values()];
}
function prog(id){ return progresso[id] || {caixa:0, prox:'2000-01-01', acertos:0, erros:0, ultimaResp:null} }
function devida(id){ return prog(id).prox <= hoje() }

let estado={
  aba:'juris', materia:'TODAS', tema:'TODOS', soDevidas:false, soErradas:false, adiantarJuris:false, 
  idx:0, revelado:false, respondida:null, fontSize:store.get(KEY_FONT)||16, riscadas:{}, selecionada:null, 
  errMateria:'TODAS', errTema:'TODOS',
  simuladoId: null, simIdx: 0, simRespostas: {}, simFinalizado: false, simModoRevisao: 'todas'
};

function respostaVisivel(p){
  if(estado.respondida !== null) return estado.respondida;
  if(estado.soErradas && estado.aba==='questoes') return null;
  return p.ultimaResp;
}

function materiasDisponiveis(){
  const s=new Set();
  ['juris','questoes'].forEach(t=>base(t).forEach(i=>s.add(i.materia||'Sem matéria')));
  return ['TODAS',...[...s].sort()];
}
function temasDisponiveis(){
  const s=new Set();
  ['juris','questoes'].forEach(t=>base(t).forEach(i=>{
    if(estado.materia==='TODAS'||i.materia===estado.materia) s.add(i.tema||'Sem tema');
  }));
  return ['TODOS',...[...s].sort()];
}
function fila(tipo){
  let l=base(tipo).filter(i=>estado.materia==='TODAS'||i.materia===estado.materia);
  l=l.filter(i=>estado.tema==='TODOS'||(i.tema||'Sem tema')===estado.tema);
  if(tipo==='juris' && estado.adiantarJuris){ return l; }
  if(estado.soErradas){ l=l.filter(i=>prog(i.id).erros > 0); }
  else if(estado.soDevidas){ l=l.filter(i=>{ const p=prog(i.id); return (p.acertos||0)+(p.erros||0) === 0 }) }
  else if(tipo==='juris'){ l=l.filter(i=>devida(i.id)) }
  return l;
}

function irParaPrimeiraNaoResolvida(){
  const l = fila('questoes');
  if(!l.length) { estado.idx = 0; return; }
  const iNaoResolvida = l.findIndex(item => {
    const p = prog(item.id);
    return (p.acertos + p.erros) === 0;
  });
  estado.idx = iNaoResolvida !== -1 ? iNaoResolvida : 0;
}

function responderJuris(id, dias){
  const p = prog(id);
  p.acertos = (p.acertos || 0) + 1;
  p.prox = somaDias(dias);
  p.visto = hoje();
  progresso[id] = p;
  salvarProg();
}

function responderQuestao(id, nota, altEscolhida=null){
  const p=prog(id);
  if(nota===2){ p.acertos++ }
  else { p.erros++ }
  p.prox = somaDias(nota===0 ? 0 : 3);
  p.visto = hoje();
  if(altEscolhida !== null) p.ultimaResp = altEscolhida;
  progresso[id]=p; salvarProg();
}

function refazerQuestao(id){
  delete progresso[id];
  salvarProg(); marcarApagamento();
  estado.respondida = null;
  estado.selecionada = null;
  if(estado.riscadas[id]) delete estado.riscadas[id];
  toast('Questão liberada!');
  render();
}

const KEY_BKP='semef2026_backups_prog_v1';
function lerBackups(){ const b=store.get(KEY_BKP); return Array.isArray(b)?b:[] }
function snapshotProgresso(rotulo){
  try{
    const lista=lerBackups();
    lista.push({em:new Date().toISOString(), rotulo:rotulo||'restauração', progresso:JSON.parse(JSON.stringify(progresso))});
    while(lista.length>8) lista.shift();
    store.set(KEY_BKP,lista);
  }catch(e){ console.warn('[backup]',e) }
}
function desfazerUltimaRestauracao(){
  const lista=lerBackups();
  if(!lista.length){ toast('Não há restauração para desfazer'); return }
  const ult=lista[lista.length-1];
  const quando=new Date(ult.em).toLocaleString('pt-BR');
  if(!confirm(`Desfazer "${ult.rotulo}" e trazer de volta o progresso de ${quando}?`)) return;
  progresso = mesclarProgresso(progresso, ult.progresso||{});
  lista.pop(); store.set(KEY_BKP,lista);
  salvarProg(); marcarApagamento();
  estado.respondida=null; estado.selecionada=null;
  toast('Progresso restaurado');
  render();
}

function erradasDoCaderno(materia,tema){
  return base('questoes').filter(i =>
    (materia==='TODAS' || (i.materia||'Sem matéria')===materia) &&
    (tema==='TODOS'   || (i.tema||'Sem tema')===tema) &&
    prog(i.id).erros > 0
  );
}
function restaurarErradas(materia,tema){
  const l=erradasDoCaderno(materia,tema);
  if(!l.length){ toast('Nenhuma questão errada nesse caderno'); return }
  if(!confirm(`Restaurar ${l.length} questão(ões) errada(s) de ${materia} / ${tema}?`)) return;
  snapshotProgresso(`erradas · ${materia} / ${tema}`);
  l.forEach(i=>{ delete progresso[i.id]; if(estado.riscadas[i.id]) delete estado.riscadas[i.id] });
  salvarProg(); marcarApagamento();
  estado.idx=0; estado.respondida=null; estado.selecionada=null;
  toast(l.length+' questões erradas restauradas');
  render();
}

function restaurarTodasDoFiltro(){
  const l = fila('questoes');
  if(!l.length) return;
  if(confirm(`Restaurar o histórico das ${l.length} questões deste filtro?`)){
    snapshotProgresso('restaurar todas do filtro');
    l.forEach(i => delete progresso[i.id]);
    salvarProg(); marcarApagamento();
    estado.idx = 0; estado.respondida = null; estado.selecionada = null;
    toast('Caderno restaurado!');
    render();
  }
}

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1600) }

function placar(){
  const todos=['juris','questoes'].flatMap(t=>base(t));
  const dominados=todos.filter(i=>prog(i.id).acertos>=3).length;
  const dev=todos.filter(i=>devida(i.id)).length;
  document.getElementById('placar').innerHTML=`<b>${dominados}</b>/${todos.length} dominados<br>${dev} para revisar hoje`;
}

function filtros(){
  const fContainer = document.getElementById('filtros-container');
  if(estado.aba === 'stats' || estado.aba === 'simulados' || estado.aba === 'add' || estado.aba === 'ajustes'){
    fContainer.style.display = 'none';
    return;
  }
  fContainer.style.display = 'flex';
  const sel=document.getElementById('fMateria');
  const atual=estado.materia;
  sel.innerHTML=materiasDisponiveis().map(m=>`<option ${m===atual?'selected':''}>${esc(m)}</option>`).join('');
  const st=document.getElementById('fTema');
  const temas=temasDisponiveis();
  if(!temas.includes(estado.tema)) estado.tema='TODOS';
  st.innerHTML=temas.map(m=>`<option ${m===estado.tema?'selected':''}>${esc(m)}</option>`).join('');
  document.getElementById('cDevidas').classList.toggle('on',estado.soDevidas);
  document.getElementById('cErradas').classList.toggle('erradas-on',estado.soErradas);
}

function render(){
  filtros(); placar();
  const tela=document.getElementById('tela');
  tela.innerHTML = ({
    juris:vJuris, questoes:vQuestao, simulados:vSimulados, stats:vStats, add:vAdd, ajustes:vAjustes

      <h4 style="margin:0; font-size:14px; color:var(--texto-primary)">${esc(sim.titulo)}</h4>
      <button class="btn err" style="padding:4px 8px; font-size:11px" onclick="finalizarSimulado()">Finalizar Prova</button>
    </div>

    <div class="sim-grid-nav">
      ${questoes.map((_, i)=>`
        <button class="sim-nav-btn ${i===estado.simIdx?'atual':''} ${estado.simRespostas[i]!==undefined?'respondida':''}" onclick="irParaQuestaoSimulado(${i})">${i+1}</button>
      `).join('')}
    </div>

    <div class="questao-container" id="questao-container">
      <div class="enunciado">
        <div class="eyebrow">Questão <b>${estado.simIdx + 1}</b> de <b>${questoes.length}</b> (Peso ${q.peso||1}) — ${esc(q.materia||'')}</div>
        <div class="txt">${esc(q.enunciado)}</div>
      </div>
      <div class="alts">
        ${q.alts.map((a,i)=>`
          <button class="alt ${respAtual===i?'selecionada':''}" onclick="responderItemSimulado(${i})">
            <span class="letra">${letras[i]}</span>
            <span class="texto-alt">${esc(a)}</span>
          </button>
        `).join('')}
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:12px">
        <button class="btn" style="width:48%" onclick="navegarSimulado(-1)">← Anterior</button>
        <button class="btn" style="width:48%; background:var(--accent); color:#fff" onclick="navegarSimulado(1)">Próxima →</button>
      </div>
    </div>`;
}

function iniciarSimulado(id){
  estado.simuladoId = id; estado.simIdx = 0; estado.simRespostas = {}; estado.simFinalizado = false;
  render();
}
function responderItemSimulado(altIdx){
  estado.simRespostas[estado.simIdx] = altIdx;
  const sim = base('simulados').find(s=>s.id===estado.simuladoId);
  if(sim && estado.simIdx < sim.questoes.length - 1){
    estado.simIdx++;
  }
  render();
}
function navegarSimulado(delta){
  const sim = base('simulados').find(s=>s.id===estado.simuladoId);
  if(!sim) return;
  estado.simIdx = Math.max(0, Math.min(sim.questoes.length - 1, estado.simIdx + delta));
  render();
}
function irParaQuestaoSimulado(idx){
  estado.simIdx = idx; render();
}
function finalizarSimulado(){
  if(confirm('Deseja realmente entregar e finalizar o simulado?')){
    estado.simFinalizado = true; estado.simIdx = 0; estado.simModoRevisao = 'todas';
    render();
  }
}
function setModoRevisao(modo){
  estado.simModoRevisao = modo; estado.simIdx = 0; render();
}
function navegarRevisao(delta){
  estado.simIdx += delta; render();
}
function sairSimulado(){
  estado.simuladoId = null; render();
}
function incorporarAoBanco(simId){
  const sim = base('simulados').find(s=>s.id===simId);
  if(!sim || !sim.questoes) return;
  const jaTem = idsExistentes();
  let n = 0;
  sim.questoes.forEach(q=>{
    const item = Object.assign({}, q);
    item.id = item.id || 'q-sim-'+Math.random().toString(36).slice(2,8);
    if(!jaTem.has(item.id)){ 
      if(Array.isArray(meus.excluidos)) meus.excluidos = meus.excluidos.filter(x=>x!==item.id);
      meus.questoes.push(item); 
      jaTem.add(item.id); 
      n++; 
    }
  });
  salvarMeus(); toast(n + ' questões adicionadas ao treino geral!');
}

/* ================= ABA: ESTATÍSTICAS ================= */
function vStats(){
  const qs = base('questoes');
  let totalAcertos = 0, totalErros = 0, totalRespondidas = 0;
  const porMateria = {};

  qs.forEach(q => {
    const p = prog(q.id);
    const tot = (p.acertos||0) + (p.erros||0);
    const m = q.materia || 'Sem matéria';
    if(!porMateria[m]) porMateria[m] = { acertos:0, erros:0, total:0 };
    porMateria[m].total++;
    if(tot > 0){
      totalRespondidas++;
      totalAcertos += p.acertos;
      totalErros += p.erros;
      porMateria[m].acertos += p.acertos;
      porMateria[m].erros += p.erros;
    }
  });

  const percGeral = (totalAcertos + totalErros) > 0 ? ((totalAcertos / (totalAcertos + totalErros)) * 100).toFixed(1) : 0;
  const todasJuris = base('juris');
  const dominadasJuris = todasJuris.filter(j=>prog(j.id).acertos >= 3).length;

  return `
    <div class="stat-grid">
      <div class="stat-card">
        <h3>${percGeral}%</h3>
        <p>Taxa de Acerto Geral</p>
      </div>
      <div class="stat-card">
        <h3>${totalRespondidas} / ${qs.length}</h3>
        <p>Questões Feitas</p>
      </div>
      <div class="stat-card">
        <h3>${dominadasJuris} / ${todasJuris.length}</h3>
        <p>Juris Dominadas</p>
      </div>
    </div>

    <div class="item">
      <h4>Desempenho por Matéria</h4>
      ${Object.entries(porMateria).map(([m, dados])=>{
        const totResp = dados.acertos + dados.erros;
        const perc = totResp > 0 ? ((dados.acertos / totResp)*100).toFixed(0) : 0;
        return `
          <div style="margin-top:12px">
            <div style="display:flex; justify-content:space-between; font-size:13px">
              <span><b>${esc(m)}</b> (${totResp}/${dados.total})</span>
              <span style="color:${perc>=70?'var(--certo)':'var(--errado)'}"><b>${perc}%</b></span>
            </div>
            <div class="prog-bar-container">
              <div class="prog-bar" style="width:${perc}%; background:${perc>=70?'var(--certo)':'var(--errado)'}"></div>
            </div>
          </div>
        `;
      }).join('')}
    </div>`;
}

  const itens=[['TODOS',l.length],...[...mapa.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0])))];

/* ---------- Eventos e Ligação do DOM ---------- */
let touchStartX = 0;
let touchEndX = 0;
let tapTimer = null;
let lastTapAlt = null;

function ligar(){
  const card=document.getElementById('card');
  if(card) card.onclick=()=>{ estado.revelado=!estado.revelado; render() };

  document.querySelectorAll('[data-dias]').forEach(b=>b.onclick=()=>{
    const l=fila('juris');
    if(l.length > 0){
      responderJuris(l[estado.idx].id, +b.dataset.dias);
      toast(`Revisão agendada (+${b.dataset.dias}d)`);
      estado.revelado=false;
      if(estado.adiantarJuris) estado.idx++;
      render();
    }
  });

  const btnAdiantar=document.getElementById('btn-adiantar');
  if(btnAdiantar) btnAdiantar.onclick=()=>{ estado.adiantarJuris=true; estado.idx=0; render(); };
  const btnAdiantarToggle=document.getElementById('btn-adiantar-toggle');
  if(btnAdiantarToggle) btnAdiantarToggle.onclick=()=>{ estado.adiantarJuris=!estado.adiantarJuris; estado.idx=0; render(); };

  const pular=document.getElementById('pular');
  if(pular) pular.onclick=()=>{ estado.revelado=false; estado.idx++; estado.riscadas={}; render() };

  // Navegação por Swipe (Deslize)
  const container = document.getElementById('questao-container');
  if(container){
    container.addEventListener('touchstart', e => { 
      touchStartX = e.changedTouches[0].screenX; 
    }, { passive: true });
    
    container.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const dist = touchEndX - touchStartX;
      if(Math.abs(dist) > 70){
        if(estado.aba === 'questoes'){
          const l = fila('questoes');
          if(dist < 0 && estado.idx < l.length - 1){
            estado.idx++; estado.riscadas={}; estado.selecionada=null; estado.respondida=null; render();
          } else if(dist > 0 && estado.idx > 0){
            estado.idx--; estado.riscadas={}; estado.selecionada=null; estado.respondida=null; render();
          }
        } else if(estado.aba === 'simulados' && estado.simuladoId){
          if(dist < 0){
            if(estado.simFinalizado) navegarRevisao(1);
            else navegarSimulado(1);
          } else if(dist > 0){
            if(estado.simFinalizado) navegarRevisao(-1);
            else navegarSimulado(-1);
          }
        }
      }
    }, { passive: true });
  }

  // Toque simples seleciona, Toque duplo risca
  document.querySelectorAll('[data-alt]').forEach(b=>{
    b.onclick = ev => {
      ev.preventDefault();
      const l = fila('questoes'), q = l[estado.idx], i = +b.dataset.alt;
      const p = prog(q.id);
      if (respostaVisivel(p) !== null) return;

      if (tapTimer && lastTapAlt === i) {
        clearTimeout(tapTimer);
        tapTimer = null; lastTapAlt = null;
        if (!estado.riscadas[q.id]) estado.riscadas[q.id] = {};
        estado.riscadas[q.id][i] = !estado.riscadas[q.id][i];
        render();
      } else {
        clearTimeout(tapTimer);
        lastTapAlt = i;
        tapTimer = setTimeout(() => {
          estado.selecionada = i;
          tapTimer = null; lastTapAlt = null;
          render();
        }, 250);
      }
    };
  });

  const resolver=document.getElementById('resolver');
  if(resolver) resolver.onclick=()=>{
    if(estado.selecionada===null){
      toast('Selecione uma alternativa');
    } else {
      const l=fila('questoes'), q=l[estado.idx];
      estado.respondida=estado.selecionada;
      responderQuestao(q.id, estado.selecionada===q.correta?2:0, estado.selecionada);
      render();
    }
  };

  const prox=document.getElementById('proxima');
  if(prox) prox.onclick=()=>{ estado.respondida=null; estado.idx++; estado.riscadas={}; estado.selecionada=null; render() };

  const ant=document.getElementById('btn-anterior');
  if(ant) ant.onclick=()=>{ estado.respondida=null; estado.idx=Math.max(0,estado.idx-1); estado.riscadas={}; estado.selecionada=null; render() };

  const refazer=document.getElementById('btn-refazer');
  if(refazer) refazer.onclick=()=>{ const l=fila('questoes'), q=l[estado.idx]; refazerQuestao(q.id); };

  const resTodas=document.getElementById('btn-restaurar-todas');
  if(resTodas) resTodas.onclick=()=>restaurarTodasDoFiltro();

  const aumentar=document.getElementById('aumentar-fonte');
  const diminuir=document.getElementById('diminuir-fonte');
  if(aumentar) aumentar.onclick=()=>{ estado.fontSize=Math.min(estado.fontSize+2,24); store.set(KEY_FONT, estado.fontSize); render(); };
  if(diminuir) diminuir.onclick=()=>{ estado.fontSize=Math.max(estado.fontSize-2,12); store.set(KEY_FONT, estado.fontSize); render(); };

  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-add]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('form').innerHTML=formAdd(b.dataset.add);
    document.getElementById('form').dataset.tipo=b.dataset.add;
    ligarForm();
  });

  if(estado.aba==='add'){
    const f=document.getElementById('form');
    if(f && !f.innerHTML){ f.innerHTML=formAdd('juris'); f.dataset.tipo='juris'; ligarForm() }
    listaMeus(); ligarLote();
  }
  if(estado.aba==='ajustes') ligarAjustes();
}

function ligarForm(){
  const f=document.getElementById('form');
  document.getElementById('salvarItem').onclick=()=>{
    const tipo=f.dataset.tipo, v={};
    f.querySelectorAll('[data-k]').forEach(e=>v[e.dataset.k]=e.value.trim());
    const id = (tipo === 'simulados' ? 's-' : (tipo === 'questoes' ? 'q-' : 'j-')) + Date.now().toString(36);
    let item;
    if(tipo==='simulados'){
      let questoes = [];
      try { 
        questoes = JSON.parse(v.questoes_json); 
        if(!Array.isArray(questoes)) throw new Error();
      } catch(e){ 
        return toast('JSON de questões inválido! Verifique o formato.'); 
      }
      item = { id, titulo: v.titulo || 'Simulado Sem Título', descricao: v.descricao || '', questoes };
    } else if(tipo==='questoes'){
      const alts=['a','b','c','d','e'].map(k=>v[k]).filter(Boolean);
      const letra=(v.correta||'').toUpperCase();
      if(!v.enunciado||alts.length<2||!'ABCDE'.includes(letra)) return toast('Falta dados obrigatórios');
      item={id,materia:v.materia||'Sem matéria',origem:v.origem||'sem origem',enunciado:v.enunciado,alts,correta:'ABCDE'.indexOf(letra),fundamento:v.fundamento};
    } else {
      if(!v.ref||!v.tese) return toast('Falta referência ou tese');
      item={id,materia:v.materia||'Sem matéria',tribunal:v.tribunal,ref:v.ref,tese:v.tese,obs:v.obs};
    }
    
    if(!meus[tipo]) meus[tipo] = [];
    if(Array.isArray(meus.excluidos)) meus.excluidos = meus.excluidos.filter(x => x !== item.id);
    
    meus[tipo].push(item); 
    salvarMeus();
    f.querySelectorAll('[data-k]').forEach(e=>e.value='');
    toast('Item adicionado!'); 
    listaMeus(); 
    ligarDel(); 
    placar(); 
    filtros();
  };
  ligarDel();
}

function ligarDel(){
  document.querySelectorAll('[data-del]').forEach(a=>a.onclick=ev=>{
    ev.preventDefault();
    const {del,tipo}=a.dataset;
    
    if(meus[tipo]) {
      meus[tipo] = meus[tipo].filter(i=>i.id !== del);
    }
    
    if(!Array.isArray(meus.excluidos)) meus.excluidos = [];
    if(!meus.excluidos.includes(del)) meus.excluidos.push(del);
    
    delete progresso[del];
    salvarMeus();
    salvarProg();
    marcarApagamento();
    
    listaMeus();
    ligarDel();
    placar();
    toast('Apagado e sincronizado!');
  });
}

function idsExistentes(){
  const s=new Set();
  ['juris','questoes','simulados'].forEach(t=>base(t).forEach(i=>s.add(i.id)));
  return s;
}

function importarArray(arr){
  if(!Array.isArray(arr)) throw 0;
  const jaTem = idsExistentes();
  let n = 0, pulados = 0;
  arr.forEach(o => {
    // Se o objeto possui a chave "questoes" como array, é um Simulado
    const tipo = o.tipo || (Array.isArray(o.questoes) ? 'simulados' : (o.alts ? 'questoes' : 'juris'));
    if(!meus[tipo]) meus[tipo] = [];
    const item = Object.assign({}, o); 
    delete item.tipo;
    item.id = item.id || (tipo[0] + '-u-' + Math.random().toString(36).slice(2,9));
    
    if(Array.isArray(meus.excluidos)) meus.excluidos = meus.excluidos.filter(x => x !== item.id);
    
    if(jaTem.has(item.id)){ pulados++; return; }
    meus[tipo].push(item); 
    jaTem.add(item.id); 
    n++;
  });
  salvarMeus(); 
  placar(); 
  filtros();
  return { n, pulados };
}

function ligarLote(){
  const arq=document.getElementById('arq');
  if(arq) arq.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const r=importarArray(JSON.parse(fr.result));
        toast(r.n+' adicionados'); listaMeus(); ligarDel();
      }catch(err){ toast('Arquivo inválido') }
    };
    fr.readAsText(f);
  };
  document.getElementById('importarLote').onclick=()=>{
    try{
      const arr=JSON.parse(document.getElementById('lote').value);
      const r=importarArray(arr);
      document.getElementById('lote').value='';
      toast(r.n+' adicionados'); listaMeus(); ligarDel();
    }catch(e){ toast('JSON inválido') }
  };
}

  const bs=document.getElementById('btSincronizar');
  if(bs) bs.onclick=sincronizarNuvem;

  document.getElementById('exportar').onclick=()=>{

    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='backup_semef_'+hoje()+'.json'; a.click();
  };

  const arqB=document.getElementById('arqBackup');
  if(arqB) arqB.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(d.progresso){ snapshotProgresso('restaurar backup arquivo'); progresso=d.progresso; salvarProg() }
        if(d.meus){ meus=d.meus; salvarMeus() }
        toast('Backup restaurado'); render();
      }catch(err){ toast('Arquivo inválido') }
    };
    fr.readAsText(f);
  };

  document.getElementById('btRestaurar').onclick=()=>{
    try{
      const d=JSON.parse(document.getElementById('restaurar').value);
      if(d.progresso){ snapshotProgresso('restaurar backup colado'); progresso=d.progresso; salvarProg() }
      if(d.meus){ meus=d.meus; salvarMeus() }
      toast('Backup restaurado'); render();
    }catch(e){ toast('JSON inválido') }
  };
  document.getElementById('zerar').onclick=()=>{
    if(confirm('Zerar todo o progresso?')){ snapshotProgresso('zerar progresso'); progresso={}; salvarProg(); marcarApagamento(); toast('Progresso zerado'); render() }
  };

  const em=document.getElementById('errMateria'), et=document.getElementById('errTema');
  if(em) em.onchange=e=>{ estado.errMateria=e.target.value; estado.errTema='TODOS'; if(et) et.innerHTML=optErrTema(estado.errMateria) };
  if(et) et.onchange=e=>{ estado.errTema=e.target.value };
  const bre=document.getElementById('btRestErradas');
  if(bre) bre.onclick=()=>restaurarErradas(estado.errMateria, estado.errTema);
  const bdf=document.getElementById('btDesfazer');
  if(bdf) bdf.onclick=()=>desfazerUltimaRestauracao();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  estado.aba=b.dataset.aba; estado.revelado=false; estado.respondida=null; estado.riscadas={}; estado.selecionada=null;
  if(estado.aba === 'questoes'){
    irParaPrimeiraNaoResolvida();
  } else {
    estado.idx = 0;
  }
  window.scrollTo(0,0); render();
});

document.getElementById('fMateria').onchange=e=>{ 
  estado.materia=e.target.value; estado.tema='TODOS'; estado.revelado=false; estado.respondida=null; estado.selecionada=null; 
  if(estado.aba === 'questoes') irParaPrimeiraNaoResolvida();
  else estado.idx=0;
  render(); 
};

document.getElementById('fTema').onchange=e=>{ 
  estado.tema=e.target.value; estado.revelado=false; estado.respondida=null; estado.selecionada=null; 
  if(estado.aba === 'questoes') irParaPrimeiraNaoResolvida();
  else estado.idx=0;
  render(); 
};

document.getElementById('cDevidas').onclick=()=>{ 
  estado.soDevidas = !estado.soDevidas; 
  if(estado.soDevidas) estado.soErradas = false;
  estado.revelado=false; estado.respondida=null; 
  if(estado.aba === 'questoes') irParaPrimeiraNaoResolvida();
  else estado.idx=0;
  render();
};

document.getElementById('cErradas').onclick=()=>{ 
  estado.soErradas = !estado.soErradas; 
  if(estado.soErradas) estado.soDevidas = false;
  estado.revelado=false; estado.respondida=null; 
  if(estado.aba === 'questoes') irParaPrimeiraNaoResolvida();
  else estado.idx=0;
  render();
};

render();
iniciarSync();
carregarConteudo();
</script>

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
