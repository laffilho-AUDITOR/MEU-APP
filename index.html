      ],
      "correta": 2,
      "fundamento": "Analisando cada alternativa: a) ERRADA. O piso legal de área é de 10.000 m²; 5.000 m² não caracteriza gleba. b) ERRADA. A definição exige área mínima de 10.000 m²; a localização em zona de expansão não substitui o critério de área. c) CERTA. A redação vigente combina o lote de pelo menos 10.000 m² com uma de duas situações: terreno vazio e não parcelado, ou construção inferior a um nono da área do lote. d) ERRADA. Inverte o critério: construção superior a 1/9 descaracteriza a gleba. e) ERRADA. Obra paralisada é hipótese de imóvel não edificado, mas sozinha não faz gleba: falta o critério de\nárea mínima.\nArt. 6º, § 3º Considera-se gleba, para fim exclusivo de aplicação do fator de correção de terrenos de que trata o Anexo IV desta Lei, o imóvel não parcelado e não edificado, ou edificado com área total construída inferior a 1/9 (um nono) da área do terreno, cuja área do lote seja igual ou superior a 10.000 M² (dez mil metros quadrados).\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l23",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Sobre a exclusão de Área de Preservação Permanente (APP) da base de cálculo do IPTU, a Lei nº 1628/2011 estabelece que",
      "alts": [
        "a exclusão é automática, bastando que a área esteja graficamente identificada como APP em qualquer mapa oficial.",
        "a exclusão implica isenção integral do IPTU do imóvel.",
        "a exclusão alcança qualquer APP, inclusive as de topo de morro, com efeitos retroativos aos cinco exercícios anteriores.",
        "a exclusão depende de decisão judicial transitada em julgado.",
        "a exclusão depende de reconhecimento do órgão ambiental municipal, de localização às margens de curso d'água e de pedido do contribuinte, produzindo efeitos a partir do exercício seguinte ao deferimento."
      ],
      "correta": 4,
      "fundamento": "Analisando cada alternativa: a) ERRADA. Não há automaticidade: a lei exige o reconhecimento pelo órgão ambiental municipal e a iniciativa do contribuinte. b) ERRADA. O benefício não é isenção do imóvel: apenas a área de APP sai da base de cálculo, e o restante do terreno continua tributado. c) ERRADA. A hipótese legal é restrita às margens de curso d'água e não há retroatividade. d) ERRADA. A via é administrativa, perante a administração tributária, sem exigência de processo judicial. e) CERTA. São três condições cumulativas: (1) reconhecimento pelo órgão ambiental municipal; (2) localização às margens de curso d'água; (3) pedido do contribuinte. E o efeito é prospectivo, só a partir do exercício seguinte ao deferimento.\nArt. 6º, § 5º Não integrará a Base de Cálculo do imposto as áreas do terreno classificadas pela legislação municipal como Área de Preservação Permanente (APP), reconhecida pelo órgão ambiental municipal nos termos regulamentares e das normas ambientais vigentes, localizadas nas margens de curso d'água, a partir do exercício seguinte em que for deferido o pedido do contribuinte pela administração tributária.\nResposta: Letra E"
    },
    {
      "id": "q-iptu-l24",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Um terreno não edificado de esquina em Manaus tem frente para dois logradouros de valores unitários distintos na Planta Genérica. Nos termos da Lei nº 1628/2011, a tributação seguirá",
      "alts": [
        "o logradouro de maior valor unitário, por presunção de maior valorização do imóvel.",
        "a média aritmética dos valores dos dois logradouros.",
        "o logradouro descrito no documento de propriedade ou posse do imóvel e, na falta de documentos, o endereço do acesso principal.",
        "o logradouro escolhido pelo contribuinte no requerimento de inscrição cadastral.",
        "o logradouro de menor valor, em homenagem à interpretação mais favorável ao contribuinte."
      ],
      "correta": 2,
      "fundamento": "a) ERRADA. A lei não adota presunção de maior valor: o critério é documental. b) ERRADA. Não existe regra de média entre logradouros. c) CERTA. O critério legal é objetivo: vale o logradouro que consta do documento de propriedade ou posse; sem documento, o do acesso principal do imóvel. d) ERRADA. A definição não fica ao alvedrio do contribuinte, justamente para evitar a escolha do logradouro mais barato. e) ERRADA. O princípio do in dubio pro contribuinte não se aplica: há regra expressa e não há dúvida a resolver.\nArt. 7º Tratando-se de imóvel não edificado, com frente para mais de um logradouro, a tributação equivalerá\nà do logradouro correspondente ao descrito no documento de propriedade ou posse do imóvel.\nParágrafo único - Tratando-se de imóvel que não possua os documentos de propriedade ou posse, na forma definida no caput, adotar-se-á o endereço referente ao acesso principal do imóvel.\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l25",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Cornélio parcelou o IPTU do seu imóvel em Manaus e deixou de pagar a parcela de abril, embora tenha quitado normalmente as parcelas de maio a dezembro. De acordo com a Lei nº 1628/2011,",
      "alts": [
        "o pagamento da última parcela presume a quitação de todas as anteriores, extinguindo o débito de abril.",
        "o débito de abril deve ser quitado antes das parcelas seguintes, que não podem ser recebidas enquanto ele estiver em aberto.",
        "a parcela de abril é automaticamente remida após o pagamento de seis parcelas subsequentes.",
        "a parcela de abril permanece devida, será atualizada no início do exercício seguinte pelo índice de reajuste da UFM e sofrerá os encargos moratórios, pois o pagamento de cada parcela independe das anteriores.",
        "a parcela de abril prescreve em noventa dias."
      ],
      "correta": 3,
      "fundamento": "a) ERRADA. A lei nega expressamente a presunção de quitação: cada parcela é autônoma. b) ERRADA. É o oposto da regra legal: o pagamento de cada parcela independe das anteriores, de modo que as seguintes podem ser normalmente recebidas mesmo com abril em aberto. c) ERRADA. Não existe remissão automática por adimplemento parcial na lei. d) CERTA. A parcela inadimplida subsiste, é atualizada no exercício seguinte pelo mesmo índice da UFM e acumula juros e multa de mora; o adimplemento das demais não a alcança. e) ERRADA. Não há prazo prescricional de noventa dias; a prescrição do crédito segue o CTN.\nArt. 38. O valor do IPTU será calculated em unidade fiscal do município (UFM) no momento do pagamento.\nParágrafo único - O não pagamento de qualquer parcela do IPTU de determinado exercício será atualizado no início do exercício seguinte pelo mesmo índice que reajustar a UFM, sem prejuízo da aplicação dos encargos moratórios decorrentes da inadimplência previstos na legislação tributária.\nArt. 39. O pagamento de cada parcela independe das anteriores e não presume a quitação das mesmas.\nParágrafo único - O atraso no pagamento de parcelas consecutivas ou não, em quantidade e situações definidas em regulamento, acarretará o vencimento antecipado do total da dívida.\nResposta: Letra D"
    },
    {
      "id": "q-iptu-l26",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Vanusa concluiu em março uma ampliação de 40 m² na área construída de sua casa em Manaus. Conforme a\nLei nº 1628/2011, ela deverá comunicar a modificação ao Cadastro Imobiliário Municipal",
      "alts": [
        "em 15 dias, contados do alvará da obra.",
        "em 30 dias, contados da ocorrência do evento, mediante requerimento próprio.",
        "em 60 dias, contados do exercício seguinte.",
        "apenas se pretender vender o imóvel.",
        "somente quando notificada pela fiscalização."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. O prazo legal é de trinta dias e o termo inicial é a ocorrência do evento, não o alvará. b) CERTA. Inscrição, atualização e alteração cadastral seguem o mesmo regime: requerimento próprio no prazo de trinta dias contados do evento, aqui a conclusão da ampliação. c) ERRADA. Não existe prazo de sessenta dias nem deslocamento para o exercício seguinte: o efeito no lançamento é que só ocorre no exercício seguinte, mas o dever de comunicar nasce do evento. d) ERRADA. O dever de comunicar modificação física independe de alienação futura. e) ERRADA. A comunicação é espontânea e obrigatória; esperar a fiscalização sujeita o contribuinte à multa e ao lançamento complementar.\nArt. 14, § 1º O contribuinte requererá a inscrição cadastral sempre que formar uma unidade imobiliária, ficando, ainda, obrigado a comunicar sua atualização sempre que promover modificações em suas características físicas.\n§ 3º A solicitação de inscrição e a comunicação de atualização ou alteração cadastral deverão ser efetuadas mediante requerimento próprio, no prazo de 30 (trinta) dias, contado da ocorrência dos referidos eventos.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l27",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Decorrido o prazo legal sem que o contribuinte tenha promovido a atualização cadastral devida, a Lei nº\n1628/2011 autoriza que a administração tributária de Manaus",
      "alts": [
        "promova a atualização de ofício, ficando o contribuinte, nesse caso, dispensado das penalidades pela omissão.",
        "promova a atualização de ofício, sem prejuízo das penalidades aplicáveis ao contribuinte ou responsável.",
        "aguarde a próxima transferência de titularidade para regularizar o cadastro.",
        "suspenda o lançamento do IPTU até a regularização voluntária.",
        "apenas notifique o contribuinte, vedada a atuação de ofício em cadastro de imóvel privado."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A atuação de ofício não apaga a infração: a lei ressalva expressamente a sujeição às penalidades. b) CERTA. Escoado o prazo, o Fisco atualiza de ofício e o contribuinte continua respondendo pela multa da omissão, cumulação que a lei prevê textualmente. c) ERRADA. Não há espera legal: o descumprimento do prazo é o próprio gatilho da atuação de ofício. d) ERRADA. O lançamento não se suspende; ele sai com os dados do cadastro, atualizados ou não. e) ERRADA. A atuação de ofício é expressamente autorizada, inclusive para imóveis particulares.\nArt. 15. A inscrição, a atualização e a alteração no cadastro serão promovidas:\nIII - de ofício, em se tratando de patrimônio federal, estadual ou municipal, ou de suas entidades autárquicas e fundações, ou ainda para os demais imóveis, quando a inscrição, atualização ou alteração deixar de ser feita no prazo legal, independentemente do contribuinte ou responsável ficar sujeito às penalidades previstas nesta Lei.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l28",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Gilmar ampliou seu imóvel há três anos sem comunicar a alteração ao Cadastro. Arrependido, compareceu espontaneamente à SEMEF e informou a modificação. Segundo a Lei nº 1628/2011, a revisão cadastral decorrente dessa iniciativa",
      "alts": [
        "afasta a multa por falta de comunicação, salvo se comprovados dolo, fraude ou simulação, mas não dispensa o pagamento das diferenças de imposto dos exercícios não decaídos.",
        "afasta a multa e as diferenças de imposto dos exercícios anteriores.",
        "não produz qualquer efeito sobre as penalidades.",
        "exige o pagamento em dobro das diferenças, como condição da espontaneidade.",
        "só é admitida se formulada no mesmo exercício da modificação."
      ],
      "correta": 0,
      "fundamento": "Analisando cada alternativa: a) CERTA. A denúncia espontânea cadastral elide a multa pela falta de comunicação, ressalvados dolo, fraude ou simulação; as diferenças do imposto continuam devidas nos exercícios não atingidos pela decadência, com dedução do que já foi pago. b) ERRADA. A espontaneidade alcança a penalidade, não o tributo: as diferenças permanecem exigíveis. c) ERRADA. A lei atribui efeito expresso à espontaneidade, elidindo a multa da omissão de comunicação. d) ERRADA. Não existe pagamento em dobro como condição; o dobro é sanção de reincidência, instituto diverso. e) ERRADA. A revisão cadastral pode ocorrer a qualquer tempo; o limite temporal relevante é a decadência do lançamento.\nArt. 16, § 2º, III - a Administração Tributária poderá efetuar o lançamento do IPTU complementar de exercícios anteriores quando ficar comprovado, durante procedimento fiscal ou qualquer procedimento administrativo de atualização ou revisão cadastral, que ocorreram alterações nas características físicas do imóvel que implicaram a alteração na base de cálculo ou na alíquota, ou de ambas, aplicadas no lançamento original dos períodos não atingidos pela decadência;\nIV - a revisão cadastral efetuada com base em informações espontaneamente apresentadas pelo contribuinte elide a aplicação das penalidades de falta de comunicação de alteração cadastral, salvo se comprovada, no âmbito do processo administrativo, a ocorrência de dolo, fraude ou simulação.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l29",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Quanto à impugnação do lançamento anual do IPTU de Manaus, a Lei nº 1628/2011 estabelece que ela somente será admitida",
      "alts": [
        "no exercício seguinte ao do lançamento, após a consolidação dos dados cadastrais.",
        "no mesmo exercício fiscal em que tenha ocorrido o lançamento, observados o prazo e as regras do regulamento.",
        "a qualquer tempo, enquanto não prescrito o crédito.",
        "no prazo de cinco dias úteis, contado da retirada do carnê.",
        "mediante depósito prévio do valor integral do imposto."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A janela é o próprio exercício do lançamento, não o seguinte. b) CERTA. A lei delimita a impugnação ao mesmo exercício fiscal do lançamento, remetendo o prazo específico e o procedimento ao regulamento; dentro do exercício, o marco prático é o vencimento da cota única ou da primeira parcela. c) ERRADA. A impugnação administrativa tem janela anual; o que pode ocorrer a qualquer tempo é a revisão cadastral, instituto distinto. d) ERRADA. Não há prazo de cinco dias nem vínculo com a retirada do carnê, até porque a notificação é coletiva. e) ERRADA. A lei não condiciona a impugnação a depósito prévio; a impugnação tempestiva, por si, suspende a exigibilidade.\nArt. 18, § 1º Somente se admitirá a impugnação do lançamento do IPTU referido neste artigo no mesmo exercício fiscal em que tenha ocorrido o lançamento, e que seja observado o prazo para impugnação e demais regras established em regulamento.\nArt. 26. O lançamento será efetuado com base nas características do imóvel, existentes no Cadastro\nImobiliário Municipal na data da ocorrência do Fato Gerador, e poderá ser impugnado pelo sujeito passivo, seja contribuinte, responsável solidário ou representante legal, até a data do vencimento da cota única ou da primeira parcela, observadas as demais disposições regulamentares.\n§ 1º A impugnação tempestiva suspende a exigibilidade do crédito tributário até a decisão definitiva na esfera administrativa.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l30",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "A fiscalização de Manaus identificou imóvel edificado que jamais fora inscrito no Cadastro Imobiliário\nMunicipal e promoveu sua inclusão de ofício. Quanto aos efeitos temporais, conforme a Lei nº 1628/2011,",
      "alts": [
        "o lançamento decorrente da inclusão de ofício retroage à data da ocorrência do fato gerador, observada a decadência.",
        "o lançamento só produz efeitos a partir do exercício seguinte ao da inclusão.",
        "o lançamento alcança, no máximo, o exercício em curso.",
        "a inclusão de ofício é vedada, cabendo apenas notificação para inscrição voluntária.",
        "o lançamento retroativo depende de autorização judicial."
      ],
      "correta": 0,
      "fundamento": "Analisando cada alternativa: a) CERTA. A regra é expressa: o lançamento da inclusão de ofício retroage ao fato gerador, permitindo cobrar os exercícios pretéritos dentro do prazo decadencial. b) ERRADA. O efeito só a partir do exercício seguinte vale para as modificações físicas comunicadas, não para a inclusão de imóvel omitido. c) ERRADA. A retroação alcança exercícios anteriores não decaídos, não apenas o corrente. d) ERRADA. A inclusão de ofício é instrumento expresso da lei, admitida a qualquer tempo. e) ERRADA. A retroação é efeito legal automático do lançamento de ofício, sem reserva de jurisdição.\nArt. 22. O lançamento decorrente da inclusão de ofício retroage à data da ocorrência do fato gerador.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l31",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Sobre o lançamento do IPTU em Manaus, a Lei nº 1628/2011 prevê que",
      "alts": [
        "prevalece a situação constante do título de propriedade sobre a situação física do imóvel, em respeito à fé pública registral.",
        "em shopping centers, cada loja com área comercial autônoma recebe lançamento individual em nome do lojista.",
        "considera-se a situação física do bem imóvel quando diferente da situação contida no título de propriedade, e, em shopping centers, o lançamento é feito em nome do condomínio.",
        "o lançamento de imóvel construído e entregue ocorre no próprio exercício da entrega das chaves.",
        "a divergência entre título e realidade suspende o lançamento até retificação cartorária."
      ],
      "correta": 2,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A lei inverte a prevalência: vale a realidade física, exatamente para evitar que registros desatualizados esvaziem a tributação. b) ERRADA. O shopping center é a exceção expressa do regime condominial: o lançamento sai em nome do condomínio, ainda que haja áreas autônomas. c) CERTA. A alternativa combina as duas regras literais: prevalência da situação física divergente do título e lançamento unificado do shopping em nome do condomínio. d) ERRADA. O lançamento do imóvel alienado ou construído ocorre no exercício posterior ao da entrega. e) ERRADA. A divergência não suspende nada: o lançamento é feito imediatamente pela situação física.\nArt. 23. O lançamento do IPTU será efetuado no exercício posterior ao da data da entrega do imóvel alienado ou construído, com base nas informações obtidas na declaração referida no art. 31 desta Lei.\nArt. 24. Para efeito de lançamento, será considerada a situação física do bem imóvel, quando esta for diferente da situação contida no respectivo título de propriedade.\nArt. 25. Na hipótese de condomínio, o lançamento será realizado, observados os seguintes critérios:\nI - para condomínios em edificação: c) em shoppings centers, em nome do condomínio, ainda que haja individualização em áreas comerciais autônomas.\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l32",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Sobre a Declaração Mensal Imobiliária Eletrônica (DMI-e), instituída pela Lei nº 1628/2011, é correto afirmar que",
      "alts": [
        "constitui obrigação principal, por envolver o dever de pagar tributo.",
        "deve ser emitida na data do registro da incorporação, ainda que a obra não tenha começado.",
        "é de envio anual, junto com a declaração de ajuste do contribuinte.",
        "alcança imobiliárias, incorporadoras e construtoras, e também os Oficiais dos Cartórios de Registro de Imóveis e Notas, estes em modelo específico.",
        "foi revogada pela legislação do habite-se eletrônico."
      ],
      "correta": 3,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A DMI-e é obrigação acessória: dever instrumental de informar, sem conteúdo pecuniário direto. b) ERRADA. O gatilho legal é a entrega oficial das chaves ou a conclusão da edificação, não o registro da incorporação. c) ERRADA. Como o próprio nome indica, a declaração é mensal, e o marco material é a entrega das chaves ou a conclusão da edificação. d) CERTA. A lei impõe o envio às empresas do setor imobiliário e estende o dever, em modelo específico, aos cartórios de registro de imóveis e de notas, que informam inscrições, averbações e escrituras. e) ERRADA. Não houve revogação; a obrigação permanece no texto vigente da lei.\nArt. 31. Fica instituída a declaração mensal imobiliária eletrônica - DMI-E, visando manter banco de dados junto à SEMEF que contenha informações sobre as operações relativas a alienações e construções de imóveis realizadas por imobiliárias, incorporadoras e construtoras, as quais deverão ser emitidas na data da entrega oficial das chaves ou da conclusão da edificação.\n§ 1º Ato do Chefe do Poder Executivo definirá o conteúdo e o prazo de envio da Declaração de que trata o caput.\n§ 2º Além das imobiliárias, incorporadoras e construtoras, ficam também obrigados a enviar a DMI-e, em modelo específico, os Oficiais dos Cartórios de Registro de Imóveis e Notas, visando informar a inscrição, averbação e escrituração de imóveis e direitos a eles relativos.\nResposta: Letra D"
    },
    {
      "id": "q-iptu-l33",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Aristides desmembrou seu terreno em Manaus em três lotes, registrando o desmembramento no Cartório de\nRegistro de Imóveis em 10 de maio. Nos termos da Lei nº 1628/2011,",
      "alts": [
        "deverá solicitar a inscrição cadastral dos novos lotes em 30 dias contados do registro, e eventual inscrição de ofício de unidades de loteamento sem registro tem caráter precário.",
        "a inscrição dos novos lotes é automática, dispensando requerimento.",
        "o prazo de inscrição é de 90 dias, contado do primeiro lançamento seguinte.",
        "os lotes só podem ser inscritos após a construção das respectivas edificações.",
        "a inscrição de ofício de unidades sem registro é definitiva e insuscetível de cancelamento."
      ],
      "correta": 0,
      "fundamento": "a) CERTA. O prazo é de trinta dias do registro cartorário; e quando o Fisco inscreve de ofício unidades de loteamento sem registro, com base na posse direta, essa inscrição é precária, cancelável por decisão judicial ou a pedido do titular. b) ERRADA. A inscrição depende de requerimento do proprietário; a atuação de ofício é subsidiária. c) ERRADA. O prazo legal é de trinta dias e conta do registro, não do lançamento. d) ERRADA. Terreno não edificado também se inscreve; a edificação não é condição do cadastro. e) ERRADA. A lei qualifica expressamente essa inscrição como precária.\nArt. 32. Os proprietários de imóveis resultantes de desmembramento ou remembramento deverão solicitar sua inscrição cadastral dentro de 30 (trinta) dias, contados da data do respectivo registro do imóvel junto ao Cartório de Registro de Imóveis.\nArt. 33. Admitir-se-á a inscrição cadastral de ofício das unidades resultantes de loteamento imobiliário, ainda que na falta de sua inscrição no Cartório de Registro de Imóveis, ou do projeto aprovado, quando se verificar a ocorrência da posse direta das unidades autônomas.\nParágrafo único - A inscrição cadastral efetuada na forma do caput possui caráter precário, podendo ser cancelada por determinação judicial, ou a requerimento do titular da propriedade.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l34",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Belarmino impugnou o lançamento do seu IPTU alegando erro na área construída cadastrada. Designada visita de aferição, ele impediu a entrada do agente no imóvel. De acordo com a Lei nº 1628/2011, esse impedimento",
      "alts": [
        "apenas transfere o ônus da prova ao Fisco.",
        "suspende o julgamento até nova tentativa de visita.",
        "não produz efeito algum, pois o domicílio é inviolável para fins fiscais.",
        "autoriza a procedência automática da impugnação, por presunção favorável ao contribuinte.",
        "implica o imediato arquivamento do pedido de revisão, além da possibilidade de sanções."
      ],
      "correta": 4,
      "fundamento": "Analisando cada alternativa: a) ERRADA. O efeito legal não é probatório, é extintivo do próprio pedido. b) ERRADA. Não há suspensão: a consequência é imediata. c) ERRADA. A lei veda expressamente impedir o acesso da autoridade para medição cadastral, e o descumprimento gera as consequências do arquivamento e das multas. d) ERRADA. A presunção operaria contra quem obstrui, jamais a favor; a lei simplesmente arquiva. e) CERTA. Quem impugna por matéria de fato deve submeter-se à aferição; impedir ou inviabilizar o acesso arquiva o pedido de imediato e ainda expõe o infrator a sanções.\nArt. 34. É vedado ao proprietário, titular do domínio útil ou possuidor a qualquer título de bem imóvel, impedir o acesso de autoridade competente ou pessoa contratada pela Administração Pública, para proceder à medição do imóvel para efeito de atualização cadastral, cadastramento, recadastramento ou atendimento a pedido de revisão de lançamento, bem como se negar a exibir documentos vinculados ao imóvel.\n§ 1º O impedimento ou a inviabilização de acesso ao imóvel, quando do pedido de revisão de lançamento por impugnação, implicará seu imediato arquivamento, além da possibilidade de aplicação de sanções.\nResposta: Letra E"
    },
    {
      "id": "q-iptu-l35",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Um particular adquiriu de entidade imune um imóvel urbano em Manaus. Quanto ao dever de comunicação ao Cadastro Imobiliário Municipal, a Lei nº 1628/2011 determina que",
      "alts": [
        "apenas o adquirente imune comunique a operação, em 60 dias do registro.",
        "apenas o transmitente comunique, pois o imune está dispensado de obrigações acessórias.",
        "tanto o adquirente quanto o transmitente comuniquem a operação, no prazo de trinta dias contado da assinatura do contrato ou documento de suporte.",
        "a comunicação é dispensada, pois o imóvel deixará de ser tributado.",
        "a comunicação seja feita exclusivamente pelo cartório, na DMI-e."
      ],
      "correta": 2,
      "fundamento": "Analisando cada alternativa: a) ERRADA. O prazo é de trinta dias, conta da assinatura do contrato e o dever não é exclusivo do adquirente. b) ERRADA. Imunidade não dispensa obrigações acessórias; e a lei expressamente estende o dever ao transmitente. c) CERTA. A lei impõe a comunicação bilateral: adquirente e transmitente, cada qual em trinta dias da assinatura do instrumento da operação. d) ERRADA. Justamente por alterar o regime de tributação, a operação precisa ser comunicada; o cadastro alcança até imóveis imunes. e) ERRADA. A DMI-e dos cartórios coexiste com o dever próprio das partes, não o substitui.\nArt. 35. O adquirente ou cessionário de imóvel ou de direito real a ele relativo, de pessoa física ou jurídica, isenta ou imune ao IPTU, fica obrigado a comunicar sua situação junto ao Cadastro Imobiliário Municipal, no prazo de trinta dias, contado da data da assinatura do contrato ou documento que dê suporte a essa operação.\nParágrafo único - A obrigação referida no caput aplica-se também ao transmitente ou cedente do imóvel ou do direito real a ele relativo.\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l36",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Quanto ao recolhimento do IPTU em Manaus, a Lei nº 1628/2011 autoriza",
      "alts": [
        "parcelamento em até 10 parcelas, com desconto máximo de 50% para a cota única.",
        "cota única ou até 12 parcelas mensais e sucessivas, facultados descontos como o do débito automático, observado o limite total máximo de 30%, definido a cada exercício pelo Executivo.",
        "parcelamento em até 24 parcelas, sem qualquer desconto.",
        "exclusivamente o pagamento em cota única, com desconto fixo de 30%.",
        "parcelamento livre, a critério do contribuinte, sem teto de descontos."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. São até doze parcelas, e o teto legal dos descontos é de 30%, não 50%. b) CERTA. A alternativa reproduz o desenho legal completo: (1) cota única ou até doze parcelas mensais e sucessivas; (2) descontos diferenciados, como o do débito automático; (3) teto agregado de 30%; (4) percentuais anuais fixados por ato do Executivo. c) ERRADA. O limite é de doze parcelas e a lei expressamente faculta descontos. d) ERRADA. O parcelamento é alternativa expressa, e o desconto não é fixo: 30% é o máximo. e) ERRADA. O número de parcelas e o teto dos descontos são limites legais, não escolhas do contribuinte.\nArt. 37. O IPTU poderá ser recolhido integralmente em cota única ou, a critério do Poder Executivo\nMunicipal, em até 12 (doze) parcelas mensais e sucessivas, sendo facultada a aplicação de descontos diferenciados ao contribuinte que optar pelo pagamento por meio de débito automático bancário, ou em outras modalidades definidas em regulamento.\nParágrafo único - O Chefe do Poder Executivo definirá, a cada exercício, os percentuais dos descontos aplicáveis ao pagamento em cota única, em débito automático, ou em outra modalidade, observado o limite total máximo de 30% (trinta por cento).\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l37",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Sobre as isenções da Lei nº 1628/2011, assinale a alternativa correta.",
      "alts": [
        "A RPPN gera redução de 50% do imposto, e não isenção.",
        "O imóvel de interesse histórico restaurado goza de isenção perpétua, reconhecida pelo IPHAN.",
        "A isenção do imóvel histórico independe do cumprimento da função social.",
        "A isenção do imóvel histórico exige apenas a restauração da fachada, dispensada a cobertura.",
        "A área reconhecida como Reserva Particular do Patrimônio Natural (RPPN) é isenta do IPTU."
      ],
      "correta": 4,
      "fundamento": "Analisando cada alternativa: a) ERRADA. O benefício da RPPN é isenção da área reconhecida, não redução percentual. b) ERRADA. A isenção do imóvel histórico é temporária (dez anos, na redação vigente) e o reconhecimento é do órgão municipal competente, não do IPHAN. c) ERRADA. O parágrafo único é expresso: o imóvel isento deve cumprir a sua função social. d) ERRADA. A lei exige a restauração de fachadas e coberturas nas características arquitetônicas originais. e) CERTA. A lei isenta a área do imóvel reconhecida pelo Poder Público Municipal como RPPN, observados os procedimentos regulamentares.\nArt. 40. A área do imóvel reconhecida pelo Poder Público Municipal como reserva particular do patrimônio natural - RPPN, nos termos da Lei nº 886/2005, está isenta do IPTU, devendo o contribuinte observar os procedimentos regulamentares.\nArt. 42. Ficam isentos do IPTU, pelo prazo de dez anos, os imóveis de interesse histórico ou cultural, assim reconhecidos pelo órgão municipal competente, que tenham suas fachadas e coberturas restauradas em suas características arquitetônicas originais.\nParágrafo único - O imóvel objeto da isenção deverá cumprir a sua função social, nos termos da legislação aplicável.\nResposta: Letra E"
    },
    {
      "id": "q-iptu-l38",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Segundo a Lei nº 1628/2011, constitui infração a ação ou omissão que importe inobservância de obrigação tributária",
      "alts": [
        "principal, exclusivamente, e desde que comprovada a intenção dolosa.",
        "acessória, exclusivamente, pois o inadimplemento da principal gera apenas mora.",
        "principal ou acessória, seja a conduta voluntária ou não.",
        "principal ou acessória, desde que o prejuízo ao erário supere uma UFM.",
        "principal ou acessória, exigindo-se culpa grave do agente."
      ],
      "correta": 2,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A infração alcança também as obrigações acessórias e prescinde de dolo. b) ERRADA. O descumprimento da obrigação principal também constitui infração; a mora é consequência adicional, não excludente. c) CERTA. A definição legal é ampla e objetiva: qualquer inobservância de obrigação principal ou acessória, voluntária ou não, configura infração e sujeita o infrator às penalidades da legislação. d) ERRADA. Não há piso de materialidade em UFM para caracterizar a infração. e) ERRADA. A responsabilidade é objetiva: a lei dispensa a perquirição de culpa ou dolo.\nArt. 45. Constitui infração a ação ou omissão, voluntária ou não, que importe em inobservância, por parte do sujeito passivo, de obrigação tributária principal ou acessória estabelecida na legislação municipal.\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l39",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Autuado por infração à Lei nº 1628/2011, Firmino pretende pagar rapidamente para reduzir a multa. Três anos antes, ele já havia sido definitivamente condenado pela mesma infração. Nesse cenário,",
      "alts": [
        "Firmino pode obter redução de 50% da multa pagando integralmente em até 30 dias, mas a penalidade- base será aplicada em dobro, pois há reincidência dentro do prazo de cinco anos.",
        "a reincidência afasta qualquer possibilidade de redução da multa.",
        "a redução máxima é de 30%, exclusiva do pagamento à vista.",
        "o prazo de reincidência é de dois anos, já superado, de modo que não há agravamento.",
        "a redução de 50% exige parcelamento em cinco vezes."
      ],
      "correta": 0,
      "fundamento": "a) CERTA. Os dois institutos convivem: a mesma infração em até cinco anos configura reincidência e dobra a penalidade; sobre a multa resultante, o pagamento integral em até trinta dias assegura a redução de 50%. b) ERRADA. A lei não exclui o reincidente do regime de reduções do pagamento tempestivo. c) ERRADA. Inverte a escada: 50% é a redução do pagamento integral em trinta dias; 30% é a menor, para cinco parcelas. d) ERRADA. O prazo legal da reincidência é de cinco anos, e o intervalo de três anos está dentro dele. e) ERRADA. O parcelamento em cinco vezes dá a redução mínima de 30%, não a de 50%.\nArt. 48. O sujeito passivo de autuação ou notificação fiscal poderá proceder ao recolhimento do valor lançado em até 150 (cento e cinquenta) dias, com as seguintes reduções do valor da multa:\nI - 50%, para recolhimento integral em até 30 dias;\nII - 45%, em duas parcelas;\nIII - 40%, em três parcelas;\nIV - 35%, em quatro parcelas;\nV - 30%, em cinco parcelas.\nArt. 49. As penalidades previstas nesta Lei serão aplicadas em dobro em caso de reincidência, assim considerada quando ocorrer o cometimento da mesma infração no prazo de até 5 (cinco) anos contados da data do pagamento da exigência, do término do prazo de defesa ou da decisão condenatória irrecorrível relativa à infração anterior.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l40",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Sobre os encargos do recolhimento do IPTU fora do prazo em Manaus, a Lei nº 1628/2011 prevê",
      "alts": [
        "multa de mora ilimitada, proporcional aos dias de atraso.",
        "juros de 2% ao mês e multa de mora fixa de 10%.",
        "apenas atualização monetária, vedada a cumulação com juros.",
        "juros de mora de 1% ao mês ou fração e multa de mora de 0,33% ao dia, limitada a 20%, além da atualização pelo índice da UFM.",
        "juros de 1% ao ano e multa de 0,33% ao mês."
      ],
      "correta": 3,
      "fundamento": "a) ERRADA. A multa de mora tem teto expresso de 20% do valor. b) ERRADA. Os percentuais legais são 1% ao mês (juros) e 0,33% ao dia com teto de 20% (multa), não os indicados. c) ERRADA. A cumulação é expressa: atualização, juros e multa de mora convivem. d) CERTA. O atraso gera a tríade legal: (1) atualização pelo índice de reajuste da UFM; (2) juros de mora de 1% ao mês ou fração; (3) multa de mora de 0,33% ao dia, com teto de 20%. e) ERRADA. Troca as periodicidades: os juros são mensais e a multa é diária.\nArt. 51. O recolhimento do IPTU fora do prazo legal será atualizado pelo mesmo índice que reajustar a\nUFM, incidindo sobre seu valor os seguintes encargos:\nI - juros de mora, à razão de 1% (um por cento) ao mês ou fração;\nII - multa de mora à razão de 0,33% ao dia, limitada a 20% (vinte por cento).\nResposta: Letra D"
    },
    {
      "id": "q-iptu-l41",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Comparando os regimes sancionatórios da Lei nº 1628/2011, é correto afirmar que",
      "alts": [
        "a multa de mora pelo atraso no pagamento confunde-se com a multa por infração apurada em ação fiscal.",
        "a multa por infração de 40% incide sobre o IPTU complementar lançado quando a ação fiscal constata divergência entre o cadastro e a realidade física do imóvel, sem prejuízo dos juros de mora.",
        "o IPTU complementar decorrente de ação fiscal não retroage à data do fato gerador.",
        "a multa de 40% aplica-se também ao contribuinte que espontaneamente comunicou a divergência cadastral.",
        "as multas do descumprimento de obrigações acessórias são fixadas em reais, atualizados pela SELIC."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. São sanções distintas: a mora pune o atraso no pagamento (0,33% ao dia, teto 20%); a multa por infração pune a divergência cadastral apurada em fiscalização (40%). b) CERTA. Constatada em ação fiscal a diferença positiva entre o imposto devido e o lançado, cobra-se o complementar retroativo com multa por infração de 40% e juros de mora. c) ERRADA. A retroação à data do fato gerador é expressa, observada a decadência. d) ERRADA. A comunicação espontânea elide a penalidade da falta de comunicação, salvo dolo, fraude ou simulação; a multa de 40% pressupõe a constatação em ação fiscal. e) ERRADA. As penalidades da lei são medidas em UFM, não em reais com SELIC.\nArt. 46. A constatação, mediante ação fiscal, de diferença positiva entre o valor do imposto devido e o valor lançado, em decorrência da não conformidade das informações do Cadastro com as características físicas reais do imóvel, sujeita o contribuinte ao lançamento do imposto complementar, retroagindo à data da ocorrência do Fato Gerador, acrescido de multa por infração de quarenta por cento e dos juros moratórios devidos.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l42",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Sobre as regras finais da Lei nº 1628/2011, assinale a alternativa correta.",
      "alts": [
        "A lei do IPTU de Manaus entrou em vigor e produziu efeitos imediatos em 30 de dezembro de 2011.",
        "A inscrição de ofício de imóveis não legalizados é vedada.",
        "A revisão de valores venais em casos singulares depende de lei específica para cada imóvel.",
        "A lei revogou expressamente o Código Tributário Nacional no âmbito municipal.",
        "Em casos singulares nos quais os procedimentos legais conduzam a tributação manifestamente injusta ou inadequada, o órgão competente pode rever os valores venais, nos termos do regulamento."
      ],
      "correta": 4,
      "fundamento": "Analisando cada alternativa: a) ERRADA. A lei entrou em vigor na publicação, mas só produziu efeitos no exercício de 2012, em atenção à anterioridade. b) ERRADA. A lei expressamente admite a inscrição de ofício de imóveis, legalizados ou não, apurados os elementos necessários. c) ERRADA. A revisão é administrativa, autorizada genericamente pela própria lei; não se exige lei por imóvel. d) ERRADA. A lei revogou a norma municipal anterior do IPTU (Lei nº 1.091/2006); jamais poderia revogar o\nCTN, norma nacional. e) CERTA. É a válvula de equidade do sistema: diante de tributação manifestamente injusta ou inadequada em casos singulares, a administração pode rever os valores venais com novos critérios de correção, na forma regulamentar.\nArt. 52. O órgão competente poderá, a qualquer tempo, efetivar a inscrição de ofício de imóveis, legalizados ou não, desde que apurados os elementos necessários para esse fim.\nArt. 53. Nos casos singulares de imóveis para os quais a aplicação dos procedimentos previstos nesta Lei possa conduzir à tributação manifestamente injusta ou inadequada, poderá o órgão competente rever os valores venais, adotando novos critérios de correção, nos termos established em regulamento.\nArt. 56. Revogam-se as disposições em contrário, especialmente a Lei nº 1.091, de 29 de dezembro de 2006.\nArt. 57. Esta Lei entra em vigor na data de sua publicação, produzindo seus efeitos no exercício de 2012.\nResposta: Letra E"
    },
    {
      "id": "q-iptu-l43",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Tobias arrematou, em hasta pública, imóvel urbano situado em Manaus que acumulava IPTU não pago de exercícios anteriores. Conforme a Lei nº 1628/2011, Tobias responde pelos créditos tributários referentes aos fatos geradores ocorridos",
      "alts": [
        "desde a data da propositura da execução fiscal que originou a hasta.",
        "a partir da emissão da carta de arrematação.",
        "nos cinco exercícios anteriores à arrematação, até o limite do lance.",
        "em todo o período de propriedade do executado, por sucessão imobiliária.",
        "somente a partir do registro da carta de arrematação no cartório de imóveis."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. O marco legal não é a propositura da execução fiscal, e sim a emissão da carta de arrematação. b) CERTA. Quem arremata em hasta pública responde pelos fatos geradores ocorridos a partir da emissão da carta de arrematação, e não pelo passivo acumulado pelo executado. c) ERRADA. A regra da arrematação não tem alcance retroativo de cinco exercícios nem limitação ao valor do lance. d) ERRADA. Essa é a lógica da sucessão comum, que faz o crédito acompanhar o imóvel. A arrematação tem regra própria, que corta o passado. e) ERRADA. O marco é a emissão da carta de arrematação, não o seu registro imobiliário.\nArt. 5º O sucessor responde pelo crédito tributário constituído quanto ao imóvel que suceda na propriedade, no domínio útil ou na posse.\nArt. 5º, § 2º Quando a aquisição do imóvel ocorrer em hasta pública, o adquirente será responsável pelos créditos tributários referentes aos fatos geradores ocorridos a partir da emissão da carta de arrematação definida na forma do parágrafo único do art. 693 da Lei nº 5.869, de 11 de janeiro de 1973.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l44",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Em junho, entidade religiosa imune adquiriu de particular imóvel urbano em Manaus cujo IPTU do exercício já havia sido lançado e vinha sendo pago em parcelas. Quanto às prestações ainda não vencidas, a Lei nº\n1628/2011 determina que",
      "alts": [
        "sejam canceladas, por força da imunidade do adquirente.",
        "permaneçam nos vencimentos originais, sob responsabilidade do adquirente imune.",
        "vençam antecipadamente, respondendo por elas o adquirente imune.",
        "sejam transferidas para o exercício seguinte, quando cessa a tributação do imóvel.",
        "vençam antecipadamente, respondendo por elas o alienante."
      ],
      "correta": 4,
      "fundamento": "a) ERRADA. A imunidade do adquirente não apaga crédito já lançado sobre fato gerador ocorrido quando o imóvel ainda era tributável. b) ERRADA. A lei não preserva o cronograma original de vencimentos: ela o antecipa. c) ERRADA. Metade do raciocínio está certa, pois há antecipação do vencimento, mas o responsável não é o adquirente imune. d) ERRADA. Não existe postergação das parcelas para o exercício seguinte. e) CERTA. Antecipado o vencimento das prestações vincendas, a lei imputa o pagamento ao alienante, que era o sujeito passivo no momento do fato gerador.\nArt. 5º, § 3º Quando o adquirente da posse, domínio útil ou propriedade de bem imóvel já lançado for pessoa imune ou isenta, vencerão antecipadamente as prestações vincendas relativas ao imposto, respondendo por elas o alienante.\nResposta: Letra E"
    },
    {
      "id": "q-iptu-l45",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "O titular de direito real sobre bem imóvel alheio, estabelecido na forma da lei civil, que esteja na posse direta de imóvel urbano em Manaus, conforme a Lei nº 1628/2011,",
      "alts": [
        "fica solidariamente responsável pelo pagamento do imposto.",
        "responde apenas subsidiariamente, esgotado o patrimônio do proprietário.",
        "passa a ser contribuinte exclusivo, afastando a sujeição do proprietário.",
        "responde somente pelas obrigações acessórias relativas ao imóvel.",
        "não responde pelo imposto, por não deter a propriedade do bem."
      ],
      "correta": 0,
      "fundamento": "Analisando cada alternativa: a) CERTA. A lei exige dois elementos cumulativos: ser titular de direito real sobre imóvel alheio e estar na posse direta. Presentes os dois, a responsabilidade é solidária. b) ERRADA. Solidariedade não comporta benefício de ordem, de modo que não há exigência de esgotar antes o patrimônio do proprietário. c) ERRADA. A responsabilidade solidária soma devedores, não substitui o contribuinte. d) ERRADA. A responsabilidade alcança o pagamento do imposto, e não apenas deveres instrumentais. e) ERRADA. Basta lembrar que a própria posse a qualquer título já coloca alguém na condição de contribuinte.\nArt. 5º, § 1º Os titulares de direito real sobre bem imóvel alheio, estabelecidos na forma da lei civil, quando estiverem na posse direta do imóvel, ficam solidariamente responsáveis pelo pagamento do imposto.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l46",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Considerada a redação do art. 11 da Lei nº 1628/2011 dada pela Lei nº 2564/2019, um imóvel edificado em\nManaus, com valor venal de R$ 400.000,00, enquadrado no Cadastro Imobiliário Municipal como de uso misto, terá IPTU no valor de",
      "alts": [
        "R$ 4.800,00.",
        "R$ 8.000,00.",
        "R$ 3.600,00.",
        "R$ 6.000,00.",
        "R$ 12.000,00."
      ],
      "correta": 2,
      "fundamento": "Vamos por partes: (1) Enquadramento: o parágrafo único manda enquadrar na alíquota do primeiro inciso a edificação de uso exclusivamente residencial ou aquela cadastrada como de uso misto. O imóvel é de uso misto, logo entra nessa faixa. (2) Alíquota aplicável: 0,9%. (3) Cálculo do imposto: 0,9% de R$ 400.000,00, ou seja, R$ 3.600,00.\nAnalisando cada alternativa: a) ERRADA. R$ 4.800,00 corresponde a 1,2%, alíquota do imóvel edificado de uso não residencial. É a pegadinha central: o candidato vê comércio no imóvel misto e sobe a alíquota. b) ERRADA. R$ 8.000,00 corresponde a 2,0%, alíquota do imóvel não edificado. c) CERTA. R$ 3.600,00, resultado de 0,9% sobre R$ 400.000,00. d) ERRADA. R$ 6.000,00 corresponde a 1,5%, percentual que existia na redação anterior do dispositivo, hoje superada. e) ERRADA. R$ 12.000,00 corresponde a 3,0%, também remanescente da redação anterior.\nArt. 11. As alíquotas do Imposto sobre a Propriedade Predial e Territorial Urbana são as seguintes:\nI - 0,9% (nove décimos percentuais) para imóvel edificado de uso residencial;\nII - 1,2% (um vírgula dois por cento) para imóvel edificado de uso não residencial;\nIII - 2,0% (dois por cento) para imóvel não edificado.\nParágrafo único. Somente será enquadrado na alíquota de que trata o inciso I deste artigo a edificação de uso exclusivamente residencial ou aquelas enquadradas no Cadastro Imobiliário Municipal como de uso misto. (Redação dada pela Lei nº 2564/2019)\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l47",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Um contribuinte de Manaus pagou parcela de IPTU de R$ 2.000,00 com 40 dias de atraso. Desconsiderada a atualização pelo índice de reajuste da UFM, o valor total a recolher, conforme os encargos da Lei nº\n1628/2011, é de",
      "alts": [
        "R$ 2.040,00.",
        "R$ 2.264,00.",
        "R$ 2.304,00.",
        "R$ 2.400,00.",
        "R$ 2.440,00."
      ],
      "correta": 2,
      "fundamento": "Vamos por partes: (1) Juros de mora: 1% ao mês ou fração. Quarenta dias equivalem a um mês inteiro mais uma fração, logo dois períodos, o que dá 2% de R$ 2.000,00, ou seja, R$ 40,00. (2) Multa de mora: 0,33% por dia. Em quarenta dias chega-se a 13,2%, percentual ainda abaixo do teto de\n20%, o que dá R$ 264,00. (3) Total a recolher: R$ 2.000,00 mais R$ 40,00 de juros mais R$ 264,00 de multa, resultando em R$ 2.304,00. a) ERRADA. R$ 2.040,00 computa apenas os juros e esquece a multa de mora, que é cumulativa. b) ERRADA. R$ 2.264,00 computa apenas a multa de mora e esquece os juros. c) CERTA. R$ 2.304,00, somados o imposto, os juros de 2% e a multa de mora de 13,2%. d) ERRADA. R$ 2.400,00 aplica 20% sobre o imposto sem distinguir juros de multa. e) ERRADA. R$ 2.440,00 leva a multa de mora direto ao teto de 20%, que só seria alcançado a partir de aproximadamente sessenta e um dias de atraso.\nArt. 51. O recolhimento do IPTU fora do prazo legal será atualizado pelo mesmo índice que reajustar a\nUFM, incidindo sobre seu valor os seguintes encargos:\nI - juros de mora, à razão de 1% (um por cento) ao mês ou fração;\nII - multa de mora à razão de 0,33% ao dia, limitada a 20% (vinte por cento).\nResposta: Letra C"
    },
    {
      "id": "q-iptu-l48",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Autuado pela fiscalização de Manaus, o sujeito passivo pretende conhecer os prazos que lhe são aplicáveis.\nNos termos da Lei nº 1628/2011, ele",
      "alts": [
        "tem 15 dias, contados da ciência da intimação, para pagar, parcelar ou impugnar, e pode recolher o valor lançado em até 90 dias, com reduções da multa.",
        "tem 30 dias, contados da ciência da intimação, apenas para impugnar, sendo o pagamento do valor lançado exigível de imediato, sem reduções.",
        "tem 60 dias, contados da ciência da intimação, para pagar ou impugnar, e o recolhimento em até 150 dias não gera qualquer redução da multa.",
        "tem 30 dias, contados da ciência da intimação ou notificação, para pagar, parcelar ou impugnar, e pode recolher o valor lançado em até 150 dias, com reduções da multa.",
        "não tem prazo fixado em lei para pagar, parcelar ou impugnar, ficando a matéria integralmente entregue ao regulamento municipal."
      ],
      "correta": 3,
      "fundamento": "Analisando cada alternativa: a) ERRADA. Troca os dois números: o prazo de defesa é de trinta dias e o de recolhimento com redução vai a cento e cinquenta dias. b) ERRADA. O prazo de trinta dias serve tanto para o pagamento e o parcelamento quanto para a impugnação. c) ERRADA. O recolhimento em até cento e cinquenta dias é exatamente o que gera as reduções escalonadas da multa. d) CERTA. Trinta dias da ciência para pagar, parcelar ou impugnar, e até cento e cinquenta dias para recolher com redução da multa, que vai de 50% no pagamento integral em trinta dias a 30% em cinco parcelas. e) ERRADA. Os prazos estão na própria lei; o regulamento apenas os operacionaliza.\nArt. 50. O sujeito passivo autuado ou notificado terá o prazo de trinta dias, contado da ciência da intimação ou notificação, para efetuar o pagamento ou parcelamento do crédito tributário ou penalidade, na forma do art. 48, ou para apresentação de impugnação, nos termos do Processo Administrativo Fiscal.\nArt. 48. O sujeito passivo de autuação ou notificação fiscal poderá proceder ao recolhimento do valor lançado em até 150 (cento e cinquenta) dias, com as seguintes reduções do valor da multa:\nI - 50%, para recolhimento integral em até 30 dias;\nII - 45%, em duas parcelas;\nIII - 40%, em três parcelas;\nIV - 35%, em quatro parcelas;\nV - 30%, em cinco parcelas.\nResposta: Letra D"
    },
    {
      "id": "q-iptu-l49",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Entidade religiosa alugou de particular imóvel urbano no qual passou a celebrar seus cultos. Quanto ao IPTU, a Constituição Federal, na redação vigente, estabelece que o imposto",
      "alts": [
        "incide normally, pois a imunidade religiosa alcança apenas o imóvel de propriedade da entidade de culto.",
        "não incide sobre o imóvel, ainda que a entidade abrangida pela imunidade seja apenas locatária do bem.",
        "incide com a alíquota reduzida à metade, como forma de compensar a destinação religiosa dada ao imóvel.",
        "não incide, desde que o proprietário locador também seja entidade religiosa reconhecida pelo Município.",
        "incide normalmente, salvo se o contrato de locação estiver registrado no cartório de registro de imóveis."
      ],
      "correta": 1,
      "fundamento": "Analisando cada alternativa: a) ERRADA. Essa era a leitura anterior. O texto constitucional hoje diz o contrário de forma expressa. b) CERTA. A Constituição afasta a incidência do IPTU sobre templos de qualquer culto ainda que a entidade imune seja apenas locatária do bem imóvel. c) ERRADA. O tratamento constitucional é de não incidência, e não de redução de alíquota. d) ERRADA. A norma não condiciona o benefício à natureza do locador. e) ERRADA. O registro do contrato de locação é irrelevante para a regra constitucional.\nCF, art. 156, § 1º-A O imposto previsto no inciso I do caput deste artigo não incide sobre templos de qualquer culto, ainda que as entidades abrangidas pela imunidade de que trata a alínea \"b\" do inciso VI do caput do art. 150 desta Constituição sejam apenas locatárias do bem imóvel.\nResposta: Letra B"
    },
    {
      "id": "q-iptu-l50",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Sobre o IPTU na Constituição Federal, considere as afirmativas a seguir.\nI. O imposto pode ser progressivo em razão do valor do imóvel.\nII. O imposto pode ter alíquotas diferentes de acordo com a localização e o uso do imóvel.\nIII. A exigência de adequado aproveitamento do solo urbano não edificado prescinde de lei específica para\nárea incluída no plano diretor.\nIV. A desapropriação com pagamento mediante títulos da dívida pública precede a exigência do imposto progressivo no tempo.\nEstá correto o que se afirma APENAS em",
      "alts": [
        "I e II.",
        "I, II e III.",
        "II e IV.",
        "I e IV.",
        "III e IV."
      ],
      "correta": 0,
      "fundamento": "Analisando cada alternativa:\nI. CERTA. É a progressividade fiscal, graduada pelo valor do imóvel.\nII. CERTA. São as alíquotas diferenciadas por localização e uso, que em Manaus aparecem na distinção entre uso residencial e não residencial.\nIII. ERRADA. A exigência de aproveitamento adequado depende de lei específica para área incluída no plano diretor. Sem plano diretor e sem lei específica, o município não pode acionar o mecanismo.\nIV. ERRADA. A ordem é sucessiva e a desapropriação é a última etapa, não a primeira. Vem antes o parcelamento ou edificação compulsórios e, depois, o imposto progressivo no tempo.\nCorretas apenas I e II, o que conduz à letra a).\nCF, art. 156, § 1º Sem prejuízo da progressividade no tempo a que se refere o art. 182, § 4º, inciso II, o imposto previsto no inciso I poderá:\nI - ser progressivo em razão do valor do imóvel; e\nII - ter alíquotas diferentes de acordo com a localização e o uso do imóvel;\nIII - ter sua base de cálculo atualizada pelo Poder Executivo, conforme critérios estabelecidos em lei municipal.\nCF, art. 182, § 4º É facultado ao Poder Público municipal, mediante lei específica para área incluída no plano diretor, exigir, nos termos da lei federal, do proprietário do solo urbano não edificado, subutilizado ou não utilizado, que promova seu adequado aproveitamento, sob pena, sucessivamente, de:\nI - parcelamento ou edificação compulsórios;\nII - imposto sobre a propriedade predial e territorial urbana progressivo no tempo;\nIII - desapropriação com pagamento mediante títulos da dívida pública de emissão previamente aprovada pelo Senado Federal, com prazo de resgate de até dez anos, em parcelas anuais, iguais e sucessivas, assegurados o valor real da indenização e os juros legais.\nResposta: Letra A"
    },
    {
      "id": "q-iptu-l51",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Contribuinte de Manaus alega a nulidade do lançamento do IPTU porque não recebeu, pela via postal, a guia de recolhimento do imposto. Conforme a Lei nº 1628/2011,",
      "alts": [

        "a alegação procede, pois sem a guia o contribuinte fica impossibilitado de conhecer o valor do imposto e as respectivas datas de vencimento.",
        "a alegação procede em parte, cabendo à administração tributária renovar o lançamento por meio de edital individualizado dirigido ao contribuinte.",
        "a alegação é irrelevante, pois o lançamento anual do IPTU dispensa por completo qualquer forma de notificação prévia ao contribuinte.",
        "a alegação não procede, pois a notificação se dá pela veiculação da matéria nos meios de comunicação de massa, independentemente do recebimento das guias por via postal."

      "correta": 4,
      "fundamento": "a) ERRADA. A lei diz o oposto: a notificação vale independentemente do recebimento das guias pelo correio. b) ERRADA. A lei garante ao contribuinte o acesso à impressão das guias no portal eletrônico da Prefeitura e nos pontos de atendimento, desde o lançamento. c) ERRADA. Não existe exigência de edital individualizado; a veiculação em massa é a forma legal de notificação. d) ERRADA. Há notificação, e ela é formal. O que a lei dispensa é a via postal, não a notificação. e) CERTA. A notificação do lançamento e dos vencimentos se opera pela divulgação nos meios de comunicação de massa, sendo a guia postal mera comodidade.\nArt. 19. O contribuinte será notificado do lançamento e das datas de vencimento do IPTU pela veiculação dessa matéria nos meios de comunicação de massa, independentemente do recebimento, por via postal, das guias de recolhimento desse tributo.\nParágrafo único - Ficará disponibilizado ao contribuinte o acesso para impressão de guias do IPTU no\nPortal Eletrônico da Prefeitura de Manaus, e nos demais pontos de atendimento da SEMEF, desde o lançamento do tributo.\nResposta: Letra E"
    },
    {
      "id": "q-iptu-l52",
      "materia": "IPTU",
      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Construtora entregou as chaves de unidade residencial nova em Manaus em outubro de 2025 e informou a operação por meio da declaração mensal imobiliária eletrônica. Conforme a Lei nº 1628/2011, o lançamento do IPTU desse imóvel",

      "fundamento": "Analisando cada alternativa: a) ERRADA. O IPTU não é proporcionalizado por meses. O fato gerador é anual e se considera ocorrido em 1º de janeiro. b) ERRADA. O lançamento é de ofício, e a informação chega à administração pela declaração da construtora. c) ERRADA. Erra no exercício e ainda cria uma exigência de cota única que a lei não faz. d) CERTA. Para o imóvel alienado ou construído, a lei desloca o lançamento para o exercício posterior ao da entrega, usando como fonte a declaração mensal imobiliária eletrônica. e) ERRADA. A lei prestigia a situação física do imóvel, não a regularidade cartorária.\nArt. 3º Considera-se ocorrido o fato gerador em 1º de janeiro de cada exercício.\nArt. 18. O lançamento do IPTU será feito de ofício, anualmente, por meio de ato normativo editado pelo chefe do Poder Executivo Municipal, levando-se em conta a situação da unidade imobiliária no exercício imediatamente anterior, e será efetuado no nome do contribuinte constante no Cadastro Imobiliário\nMunicipal, com base nos elementos cadastrais.\nArt. 23. O lançamento do IPTU será efetuado no exercício posterior ao da data da entrega do imóvel alienado ou construído, com base nas informações obtidas na declaração referida no art. 31 desta Lei.\nResposta: Letra D"
    },

      "fundamento": "Analisando cada alternativa: a) ERRADA. As partes comuns não vão para o síndico: são rateadas pela fração ideal de cada unidade autônoma. b) ERRADA. Não existe sorteio. No condomínio diviso, cada condômino é lançado pela parte que lhe cabe, de acordo com a fração ideal. c) CERTA. Reúne as duas regras exatamente como a lei as põe: rateio das partes comuns pela fração ideal nos condomínios em edificação e lançamento individualizado por fração ideal no condomínio ordinário indiviso. d) ERRADA. O lançamento em nome do condomínio é a exceção reservada aos shopping centers, ainda que haja individualização de áreas comerciais autônomas. e) ERRADA. As unidades autônomas são lançadas em nome de cada condômino, titular de domínio útil ou possuidor.\nArt. 25. Na hipótese de condomínio, o lançamento será realizado, observados os seguintes critérios:\nI - para condomínios em edificação: a) as unidades autônomas, em nome de cada condômino, titular de domínio útil ou possuidor; b) as partes comuns serão rateadas proporcionalmente à fração ideal de cada unidade autônoma; c) em shoppings centers, em nome do condomínio, ainda que haja individualização em áreas comerciais autônomas.\nII - para condomínio ordinário: a) quando indiviso, em nome de cada condômino, titular do domínio útil ou possuidor, observada a fração ideal; b) quando diviso, em nome de cada condômino, observada a parte de cada um, de acordo com a fração ideal.\nResposta: Letra C"
    },
    {

      "origem": "INÉDITA – LTF – PROF. RABELO – ISS/MANAUS",
      "enunciado": "Julgada a impugnação do lançamento do IPTU em Manaus e constatada a existência de vício, a Lei nº\n1628/2011 determina que",

      ],
      "correta": 1,
      "fundamento": "a) ERRADA. O vício sanável não anula nada: ele é corrigido por revisão do lançamento. b) CERTA. A lei separa os dois caminhos. Vício sanável se resolve por revisão do lançamento; vício formal insanável obriga a administração a lançar de novo, se couber. c) ERRADA. Inverte exatamente os dois efeitos. É a pegadinha típica desse dispositivo. d) ERRADA. Vício formal não extingue o crédito. Justamente por isso a lei prevê novo lançamento. e) ERRADA. A revisão é administrativa e decorre do próprio julgamento da impugnação.\nArt. 28. As impugnações decorrentes das situações dispostas no art. 27 serão julgadas de acordo com o\nProcedimento Administrativo Tributário definido na legislação tributária municipal, podendo ser recolhido o IPTU de acordo com os critérios regulamentares.\n§ 1º Quando o vício for sanável, será efetuada a revisão de lançamento, devendo o sujeito passivo realizar o recolhimento observados os prazos e critérios definidos em regulamento.\n§ 2º Quando da ocorrência de vício formal insanável, deverá ser efetuado novo lançamento, se couber, conforme regulamento.\nResposta: Letra B"
    },
